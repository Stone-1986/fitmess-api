reporte_qa:
  fecha: "2026-08-20"
  ciclo: 2
  razonamiento: >
    QUÉ: re-ejecuté los 6 gates completos (no solo openapi:validate) porque el
    cambio toca DTOs de respuesta que atraviesa el pipeline HTTP completo
    (ValidationPipe, ResponseInterceptor, Swagger). Confirmé que los 15 campos
    afectados tienen `type: String` agregado en los 6 DTOs de src/ y que sus 6
    equivalentes en outputs/contrato_openapi/ son idénticos byte a byte (diff
    vacío). Inspeccioné outputs/openapi.json regenerado por el propio gate y
    verifiqué campo por campo que el shape no cambió: mismos 15 campos,
    `type: string`, `nullable: true`, mismo `example`, misma `description`,
    mismo `format` donde aplica — solo se agregó la metadata de tipo que
    faltaba. POR QUÉ: rulesArquitectura §Validación OpenAPI exige el gate y el
    LT pidió confirmar explícitamente que no hubo cambio de superficie de API.
    REFERENCIA: spectral --format json devolvió `[]` (0 errores, 0 warnings —
    los 17 de operation-tag-defined desaparecieron); 443/443 unitarios y
    159/159 e2e en verde, cobertura idéntica al ciclo 1 (99.59%/100%); `find
    -newer` confirma que solo se tocaron los 6 DTOs de src/, sus 6 copias en
    outputs/contrato_openapi/ y scripts/export-openapi.mjs — ningún test ni
    código de producción adicional.

  linting:
    eslint: "PASS"
    prettier: "PASS"
    errores: []

  cobertura:
    dominio:
      porcentaje: 99.59
      target: 80
      cumple: true
    adaptadores:
      porcentaje: 100
      target: 70
      cumple: true

  tests:
    unitarios:
      pasaron: 443
      fallaron: 0
    e2e:
      estado: "PASS"
      pasaron: 159
      fallaron: 0
      fallos: []

  criterios_de_aceptacion:
    - id: "CA-008-1/CA-008-2"
      descripcion: "Plan se guarda en Borrador completo o incompleto; RN-01 solo bloquea al publicar"
      cumple: true
      evidencia: "SIN CAMBIOS DEL CICLO 1 — plans.service.spec.ts (create, publish/validatePlanCompleteness); plans.e2e-spec.ts POST /api/plans y PLAN_INCOMPLETE"
    - id: "CA-008-3"
      descripcion: "SessionExercise persiste exerciseVersionId vigente al momento de agregarse (RN-07)"
      cumple: true
      evidencia: "SIN CAMBIOS DEL CICLO 1 — plans.e2e-spec.ts 'CA-006-1 (EPICA-02) — PATCH de un ejercicio EN USO...' y 'POST .../exercises — 201'"
    - id: "CA-008-4/CA-008-5"
      descripcion: "ATHLETE y usuario sin autenticar rechazados en mutaciones de plan"
      cumple: true
      evidencia: "SIN CAMBIOS DEL CICLO 1 — plans.e2e-spec.ts — 401/403 en los 15 endpoints de PlansController"
    - id: "CA-008-6"
      descripcion: "Ownership — solo el coach propietario modifica su plan"
      cumple: true
      evidencia: "SIN CAMBIOS DEL CICLO 1 — plans.service.spec.ts (findOne/update RESOURCE_OWNERSHIP_DENIED); plans.e2e-spec.ts GET/PATCH 403 con otherCoachToken"
    - id: "CA-009-1/CA-009-2"
      descripcion: "publish() transiciona a Publicado o lista requisitos faltantes (PLAN_INCOMPLETE)"
      cumple: true
      evidencia: "SIN CAMBIOS DEL CICLO 1 — plans.service.spec.ts (publish, 4 variantes de PLAN_INCOMPLETE); plans.e2e-spec.ts 200/422 con context.missingRequirements"
    - id: "CA-009-3"
      descripcion: "unpublish() sin suscriptores regresa el plan a Borrador"
      cumple: true
      evidencia: "SIN CAMBIOS DEL CICLO 1 — plans.service.spec.ts 'procede cuando hasSubscribers() retorna false'; plans.e2e-spec.ts 200"
    - id: "CA-009-4"
      descripcion: "Estructura y fechas inmutables tras publicar (RN-31) — PLAN_IMMUTABLE"
      cumple: true
      evidencia: "SIN CAMBIOS DEL CICLO 1 — plan-published.guard.spec.ts; plans.service.spec.ts (update); plans.e2e-spec.ts PATCH 409 y POST phases 409 post-publish"
    - id: "CA-009-5"
      descripcion: "Ownership en publish/unpublish"
      cumple: true
      evidencia: "SIN CAMBIOS DEL CICLO 1 — plans.service.spec.ts; plans.e2e-spec.ts 403 con otherCoachToken en publish y unpublish"
    - id: "CA-009-6"
      descripcion: "ATHLETE no puede publicar/despublicar"
      cumple: true
      evidencia: "SIN CAMBIOS DEL CICLO 1 — plans.e2e-spec.ts 403 ATHLETE en publish/unpublish"
    - id: "CA-009-7"
      descripcion: "unpublish() rechaza con PLAN_HAS_SUBSCRIBERS si hasSubscribers()=true"
      cumple: true
      evidencia: >
        SIN CAMBIOS DEL CICLO 1 — GAP DECLARADO, sigue vigente y documentado
        explícitamente en este ciclo (no se omite): solo verificable con test
        unitario mockeando hasSubscribers() (plans.service.spec.ts).
        hasSubscribers() es un stub fijo en false; la rama "con suscritos" NO
