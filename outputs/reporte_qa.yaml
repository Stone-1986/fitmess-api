reporte_qa:
  fecha: "2026-08-20"
  ciclo: 1
  razonamiento: >
    QUÉ: valide la implementacion completa de EPICA-04 (modulo subscriptions,
    6 endpoints nuevos; hasSubscribers() real en plans.service.ts; 3
    listeners + 3 metodos de EmailService en notifications). Escribi
    subscriptions.service.spec.ts (37 tests), subscriptions.controller.spec.ts
    (7 tests), 3 specs de listener (22 tests), tests nuevos para
    EmailService (15 tests) y test/subscriptions.e2e-spec.ts (37 tests, los 6
    endpoints + CA-009-7 end-to-end). POR QUÉ: cerrar los 14 criterios de
    aceptacion tecnicos del plan, con enfasis en los dos casos de CA-014-8
    (Archivado y PUBLISHED-vencido-sin-write-through) senalados como riesgo
    explicito. REFERENCIA: en el camino encontre que el cambio de
    hasSubscribers() (de stub a query real) rompio 3 tests preexistentes de
    plans.service.spec.ts porque mockPrisma no tenia `subscription.count` —
    los corregi (agregando el mock y separando la aserción de la query real)
    porque son archivos de test, no codigo de produccion. Build, lint,
    format, test:cov (535/535) y test:e2e (199/199, incluye los 4 suites
    preexistentes) en verde tras esa correccion.

