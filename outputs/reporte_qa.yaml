      completa de la seccion 5 del proceso de QA (ver `vulnerabilidades`
      arriba y el detalle de cada checklist abajo). Se escala al Lider
      Tecnico/humano para decidir si `/security-review` se ejecuta aparte
      antes del CHECKPOINT.
    hallazgos: []
    resumen:
      total: 0
      high: 0
      medium: 0
      low: 0
      descartados: 0

