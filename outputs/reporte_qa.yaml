    - id: "CA-011-2"
      descripcion: "Detalle del catalogo con estructura (solo conteo de ejercicios) y perfil publico completo del entrenador"
      cumple: true
      evidencia: "SIN CAMBIOS DEL CICLO 1 — plans.service.spec.ts findPublishedOne(); plans.e2e-spec.ts GET /api/catalog/plans/:id — exerciseCount presente, exercises ausente, description/bannerUrl con y sin CoachRequest APPROVED"
    - id: "CA-011-3"
      descripcion: "Planes Borrador/Finalizado/Archivado no aparecen en el catalogo"
      cumple: true
      evidencia: "SIN CAMBIOS DEL CICLO 1 — plans.e2e-spec.ts 'CA-011-3 — un plan Publicado con endDate en el pasado NO aparece en el catalogo'"
    - id: "CA-011-4"
      descripcion: "Catalogo rechaza sin autenticacion"
      cumple: true
      evidencia: "SIN CAMBIOS DEL CICLO 1 — plans.e2e-spec.ts 401 en GET /api/catalog/plans y GET /api/catalog/plans/:id"
    - id: "CA-006-1 (EPICA-02)"
      descripcion: "isUsedInPlan(exerciseId) deja de ser stub y consulta SessionExercise real; PATCH de un ejercicio en uso crea version nueva, RN-07 conservada"
      cumple: true
      evidencia: "SIN CAMBIOS DEL CICLO 1 — GAP CERRADO END-TO-END. exercises.service.spec.ts (2 tests nuevos con sessionExercise.count mockeado, sin spy sobre isUsedInPlan); plans.e2e-spec.ts test dedicado crea ejercicio -> lo usa en plan -> PATCH -> verifica ExerciseVersion nueva"
    - id: "FK compuesta Week(phaseId,planId)->Phase(id,planId)"
