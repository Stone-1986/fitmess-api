reporte_qa:
  fecha: "2026-08-21"
  ciclo: 1
  razonamiento: >
    QUE: valide la implementacion completa de EPICA-05 (modulo nuevo
    `execution` — 5 endpoints de InstancesController, SubscriptionActivatedListener;
    D-15/EPICA-03 reabierta — PATCH de prescripcion en plans; D-14/EPICA-04
    reabierta — segundo LegalAcceptance en accept-consent). Escribi
    instances.service.spec.ts (36 tests), instances.controller.spec.ts (5),
    subscription-activated.listener.spec.ts (5), test/instances.e2e-spec.ts
    (16 tests, los 5 endpoints + idempotencia CA-023-8), mas tests nuevos en
    plans.service.spec.ts (updateSessionExercisePrescription + 2 casos D-15
    de publish()), plans.controller.spec.ts (delegacion del PATCH) y
    subscriptions.service.spec.ts (el segundo LegalAcceptance HEALTH_DATA_CONSENT
    en la misma $transaction, cobertura que el Desarrollador dejo pendiente).
    Corregi el fixture diagnosticado de addSessionExercise() (plans.service.spec.ts)
    y escribi el test e2e de PARCIALIDAD del indice unico de subscriptions
    (espejo del de exercises), mas el test unitario CA-016-9. POR QUE: cerrar
    los criterios de aceptacion tecnicos del plan v1.4 y los hallazgos ya
    diagnosticados por el team lead. REFERENCIA: mensaje de asignacion del
    2026-08-21.

    HALLAZGOS PROPIOS, no diagnosticados por el team lead, encontrados y
    corregidos en el camino (solo archivos de test, nunca codigo de
    produccion):

    (1) CRITICO — subscriptions.e2e-spec.ts y plans.e2e-spec.ts (42 tests)
    estaban rotos en masa: sus helpers buildPublishedPlan()/buildCompletePlan()
    agregaban un SessionExercise SIN prescripcion y despues llamaban
    publish() — desde D-15, publish() ahora exige prescripcion significativa
    por ejercicio, asi que TODO plan construido por esos dos helpers fallaba
    con 422 PLAN_INCOMPLETE. Ademas, subscriptions.e2e-spec.ts seguia
    enviando el campo viejo `documentVersion` en accept-consent, renombrado
    por D-14 a `sportConsentDocumentVersion`/`healthDataConsentDocumentVersion`
    (ambos ahora obligatorios) — todo intento de aceptar consentimiento
    fallaba con 400. Corregidos ambos helpers (agregando sets/reps al
    agregar el ejercicio) y los 9 usos de accept-consent en
    subscriptions.e2e-spec.ts; agregado tambien un test explicito de
    atomicidad del segundo LegalAcceptance y de rechazo si falta cualquiera
    de los dos campos.

    (2) El afterAll() de subscriptions.e2e-spec.ts violaba una FK nueva
    (plan_instances_subscription_id_fkey, Restrict): desde que accept-consent
    dispara SubscriptionActivatedListener (HU-023), cada Subscription activada
    en ese archivo ahora crea una PlanInstance — borrar la Subscription antes
    de la PlanInstance fallaba. Corregido el orden de limpieza.

    (3) instances.e2e-spec.ts, dos tests con falso negativo por diseno del
    propio D-3: GET /instances (listado) y findForCoach() NO tienen
    auto-reparacion sincrona (solo GET /instances/:planId la tiene) — el
    listener de HU-023 es fire-and-forget, asi que consultarlos INMEDIATAMENTE
    despues de accept-consent puede ganarle la carrera al listener. Corregidos
    forzando primero el GET self-heal del atleta antes de verificar el
    listado/panel del coach — documentado en el propio test, no es un bug de
    produccion, es el alcance ya documentado de D-3.

    (4) Un test de instances.e2e-spec.ts (HU-017/D-9, construye DOS planes
    completos) excedia el testTimeout de 20000ms del archivo — extendido a
    40000ms via el tercer argumento de it().

    Build, lint (0 errores, 342 warnings preexistentes de no-unsafe-argument,
    relajado por el proyecto), format, test:cov (591/591) y test:e2e
    (218/218, los 6 suites del repo en la misma corrida) en verde tras estas
    correcciones. openapi:validate sin errores de Spectral.

