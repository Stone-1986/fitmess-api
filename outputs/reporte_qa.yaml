        categoria: "Exposicion de token en URL de correo"
        archivo: "src/modules/notifications/email.service.ts"
        linea: 53
        descripcion: >
          El rawToken se incluye como query parameter en el enlace del correo de invitacion.
          Puede quedar en logs del servidor de correo, historial del navegador y headers
          Referer si el usuario navega desde un contexto con Referer habilitado.
        escenario_explotacion: >
          Un atacante con acceso a logs del servidor de correo, o que intercepte trafico
          HTTP sin TLS, podria obtener el token. El token es de uso unico y expira en 48h.
        recomendacion: >
          Usar HTTPS para el frontend (produccion). El patron es aceptable dado uso unico
          y expiracion. Alternativa: tokens de corta duracion (ej: 1h) para mayor seguridad.
        descartado: false
        motivo_descarte: ""

      - severidad_original: "LOW"
