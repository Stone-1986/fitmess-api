  regresion_response_interceptor:
    pregunta_lider_tecnico: >
      El interceptor envuelve TODAS las respuestas del proyecto (EPICA-01,
      EPICA-09, EPICA-02) aunque solo se haya tocado su codigo y el de
      exercises/. ¿Hay algun endpoint existente cuya forma de respuesta
      pudiera cambiar con la nueva expresion, en particular un DTO de
      respuesta con un campo propio llamado `data`?
    analisis: >
      Busque en todo src/ (`grep -rn "  data:" --include=*.dto.ts` y una
      revision manual de los 5 controllers del proyecto: auth.controller.ts,
      coach-requests.controller.ts, admin-invitations.controller.ts,
      exercises.controller.ts, health.controller.ts) y NINGUN DTO de respuesta
      ni objeto retornado por un controller tiene un campo propio llamado
      `data` fuera del patron de envelope intencional ya soportado
      ({ data, meta } en paginacion — coach-requests/search y
      GET /exercises comparten el mismo shape; { data, message } en
      operaciones que retornan un mensaje). Tampoco hay ningun controller que
      retorne un array de forma directa (sin envolver) ni ninguno que retorne
      `null`/`undefined` fuera de exercises/deactivate(). Comparacion
      explicita vieja vs nueva expresion, caso por caso:
        - Objeto plano SIN clave `data` (ej. AthleteRegistrationResponseDto,
          AuthTokenResponseDto, CoachRequestResponseDto, ExerciseResponseDto):
          `'data' in data` es false en ambas versiones → mismo resultado
          (retorna el objeto completo). SIN CAMBIO.
        - { data: [...], meta } (paginacion, coach-requests/search y
          GET /exercises): `data.data` es un array truthy en ambas versiones
          → mismo resultado. SIN CAMBIO.
        - { data: X, message } con X no nulo (ninguna respuesta actual del
          proyecto usa este shape con X no nulo — el unico caso real es
          deactivate() con X=null): tampoco cambia, `data.data` truthy en
          ambas versiones.
        - { data: null, message } — SOLO exercises/deactivate() en todo el
          proyecto usa este shape hoy: este es el caso que cambio
          deliberadamente (el fix). CAMBIO INTENCIONAL, ya cubierto arriba.
        - `null`/`undefined` retornado directo por un controller: ningun
          controller del proyecto lo hace hoy (todos retornan un DTO, un
          array via { data, meta }, o el shape { data: null, message } de
          deactivate()). Sin caso real afectado; cubierto igual por los 2
          tests nuevos del Desarrollador por completitud.
      CONCLUSION: no encontre ningun endpoint existente de EPICA-01/EPICA-09
      cuya forma de respuesta cambie con el fix. El unico caso cuyo
      comportamiento cambia es exactamente el que se queria corregir
      (DELETE /exercises/:id). Los 71/71 e2e y 296/296 unitarios en verde son
      consistentes con este analisis estatico.

  criterios_de_aceptacion:
    - id: "a) Cobertura e2e de los 5 endpoints nuevos"
      cumple: true
      evidencia: "Sin cambios respecto al ciclo 1 — ver historial de este archivo."
    - id: "b) Orden de validaciones de update() — isUsedInPlan() NO se invoca si esta inhabilitado (CA-006-6)"
      cumple: true
      evidencia: "Sin cambios respecto al ciclo 1."
    - id: "c) Unicidad case-insensitive filtrando solo activos — create() y rename de update() (CA-005-2/CA-005-6)"
      cumple: true
      evidencia: "Sin cambios respecto al ciclo 1."
    - id: "d) EXERCISE_IN_USE no se usa en ninguna parte del modulo"
      cumple: true
      evidencia: "Sin cambios respecto al ciclo 1."
    - id: "e) Gap CA-006-1/CA-006-3 — declarado explicitamente (no defecto)"
      cumple: true
      evidencia: "Sin cambios respecto al ciclo 1 — gap sigue declarado, pendiente hasta EPICA-03."
    - id: "f) DELETE /exercises/:id retorna { data: null, message } tal como documenta el plan"
      descripcion: >
        Error critico del ciclo 1 (ver historial): ResponseInterceptor
        desenvolvia mal un `data: null` explicito.
      cumple: true
      evidencia: >
        Corregido en src/modules/common/interceptors/response.interceptor.ts.
        Verificado en 3 capas: unitario (response.interceptor.spec.ts, 6 casos
        en verde), e2e (test/exercises.e2e-spec.ts, assert explicito
        `data === null`, no solo status 200) y analisis estatico de regresion
        sobre el resto de la API (ver `regresion_response_interceptor`).

