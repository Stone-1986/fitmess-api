        archivo: "src/modules/auth/admin-invitations.controller.ts"
        linea: 135
        descripcion: >
          POST /admin-invitations/verify no tiene rate limiting especifico por token.
        escenario_explotacion: >
          Con 256 bits de entropia (2^256 combinaciones posibles), la fuerza bruta es
          infactible computacionalmente. ThrottlerGuard global (100 req/min) ya aplica.
        recomendacion: >
          El ThrottlerGuard global es suficiente. La entropia del token hace impractica
          cualquier estrategia de adivinanza.
        descartado: true
        motivo_descarte: >
          Token de 256 bits (randomBytes(32)) hace infactible la fuerza bruta.
          ThrottlerGuard global ya aplica. Riesgo teorico, no practico.

