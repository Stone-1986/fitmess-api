  vulnerabilidades:
    - severidad: "BAJA"
      descripcion: >
        GET /instances (listado) y GET /instances/:planId/athletes/:athleteId
        (panel del coach) NO tienen auto-reparacion sincrona — solo GET
        /instances/:planId la tiene (D-3, decision explicita del Arquitecto).
        El listener de subscription.activated es fire-and-forget
        (EventEmitter2.emit no espera al handler): un cliente que consulte
        el listado o el panel del coach en la ventana de milisegundos entre
        la respuesta 200 de accept-consent y el fin del listener puede ver
        una lista vacia o un 404 transitorio.
      ubicacion: "src/modules/execution/instances.service.ts:140 (findAll), :359 (findForCoach)"
      recomendacion: >
        No es una vulnerabilidad de seguridad ni un bug — es el alcance
        deliberado de D-3, y el propio plan de implementacion ya documenta
        el riesgo hermano ('si NADIE vuelve a consultar la instancia, el
        hueco persiste'). Se documenta aqui porque instances.e2e-spec.ts lo
        expuso empiricamente (2 tests fallaron por esta razon en la primera
        corrida) y quedo resuelto en el test forzando primero el GET
        self-heal — no requiere cambio de codigo, solo que el Lider Tecnico
        confirme que el alcance es el que D-3 documento.
      descartado: false
      motivo_descarte: "N/A — no bloquea, se documenta por completitud"

  escaneo_automatico:
    ejecutado: true
    ejecutado_por: "orquestador"
    detalle_ejecucion_orquestador: >
      RESUELTO por el orquestador el 2026-08-21, que si puede invocar el
      slash-command. `/security-review` corrido sobre el diff completo de
      EPICA-05 (modulo `execution` nuevo, cambios en `plans` y
      `subscriptions`, schema y migraciones). Resultado: **CERO hallazgos**
      que superen el umbral de confianza. Evidencia negativa con numeros de
      linea, que es lo que hace util el resultado: (1) los 5 handlers llevan
      @Roles explicito (lineas 84/136/186/240/313) bajo @UseGuards a nivel de
      clase (69), sin ningun @Public en el modulo, y todos los params UUID
      pasan por ParseUUIDPipe; (2) el vector de IDOR mas plausible esta
      cerrado — `:sessionId` y `:weekId` atraviesan TRES compuertas
      (suscripcion ACTIVE, pertenencia al plan, y
      `instance.athleteId !== athleteId` -> RESOURCE_OWNERSHIP_DENIED en
      instances.service.ts:446 y :602), recorriendo la cadena por relaciones
      FK reales y NO por la columna denormalizada InstanceWeek.instanceId;
      (3) `assertExactExerciseSet` (549-567) impide que el upsert de
      resultados apunte a una fila fuera de la sesion ya verificada; (4) el
      coach se corta en `plan.coachId !== coachId` (377) ANTES de leer dato
      alguno del atleta; (5) la auto-reparacion no es secuestrable — el
      subscriptionId sale siempre de findActiveSubscriptionOrFail con el
      athleteId del JWT (667), nunca del request; (6) Ley 1581/2012: el unico
      logger del modulo registra `{ subscriptionId, errorMessage }`
      (listener:52), `registerWeeklyFeeling` no loggea nada,
      InstanceSummaryResponseDto no serializa sensaciones, y el
      ProblemDetailFilter —que SI vuelca `exception.context` en la respuesta
      (problem-detail.filter.ts:51)— solo lleva ids propios del llamante, sin
      nombres, emails ni valores de sensaciones; (7) cero `$queryRaw` en el
      codigo nuevo; ValidationPipe con `whitelist` + `forbidNonWhitelisted`
      cierra el mass-assignment sobre los upserts; paginacion acotada a 100.
      Confirmado ademas que `updateSessionExercisePrescription` en `plans`
      usa la misma forma de tres compuertas, sin IDOR.
    motivo_no_ejecucion_original: >
      Este agente QA opera en esta sesion sin acceso a la herramienta de
      invocacion de skills/slash-commands de Claude Code (solo dispongo de
      Read/Write/Bash/SendMessage) — no puedo invocar `/security-review`
