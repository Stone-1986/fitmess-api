  vulnerabilidades:
    - severidad: "BAJA"
      descripcion: >
        El token de invitacion se incluye como query parameter en el enlace del correo:
        APP_BASE_URL/auth/admin/register?token=${rawToken}. El token puede aparecer en
        logs del servidor de correo y en el historial del navegador del receptor.
      ubicacion: "src/modules/notifications/email.service.ts:53"
      recomendacion: >
        Este patron es inherente al flujo de invitacion por email. Se mitiga con token
        de uso unico (ya implementado) y expiracion de 48h configurable. No requiere
        accion adicional — es un riesgo inherente al flujo de invitacion por email.

    - severidad: "BAJA"
      descripcion: >
        El campo identificationNumber en seed.ts usa el placeholder `seed-admin-${Date.now()}`.
        Si el campo tiene restriccion unique en DB y el seed se ejecuta dos veces en el mismo
        milisegundo (improbable), podria generar colision. La idempotencia por email lo previene.
      ubicacion: "prisma/seed.ts:97"
      recomendacion: >
        Reemplazar Date.now() por crypto.randomUUID() para mayor robustez. Impacto real: nulo
        dado que el seed verifica el email primero y hace exit(0) si ya existe.

