        mismo patrón que CA-006-1 de EPICA-02). Cobertura e2e real llega con
        EPICA-04.
    - id: "CA-010-1"
      descripcion: "Evaluacion perezosa de Finalizado — cualquier consulta muestra el plan vencido como Finalizado"
      cumple: true
      evidencia: "SIN CAMBIOS DEL CICLO 1 — plans.service.spec.ts computeEffectiveStatus (via findOne/findAll/archive); plans.e2e-spec.ts GET /api/plans/:id status=FINALIZED tras endDate pasada"
    - id: "CA-010-2"
      descripcion: "archive() transiciona Borrador/Publicado/Finalizado -> Archivado"
      cumple: true
      evidencia: "SIN CAMBIOS DEL CICLO 1 — plans.service.spec.ts (3 variantes de estado origen); plans.e2e-spec.ts 200 desde Borrador y desde Publicado"
    - id: "CA-010-3"
