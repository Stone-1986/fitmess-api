      cumple: true
      evidencia: "SIN CAMBIOS DEL CICLO 1 — plans.e2e-spec.ts 'Postgres RECHAZA insertar una Week cuyo planId no coincide...' — INSERT directo con Prisma saltandose el service, rejects con P2003"
    - id: "criterio_tecnico_plan — publish() lista requisitos faltantes explicitamente"
      descripcion: "No usa mensaje generico"
      cumple: true
      evidencia: "SIN CAMBIOS DEL CICLO 1 — plans.service.spec.ts 4 tests de PLAN_INCOMPLETE con context.missingRequirements especifico por combinacion de estructura faltante"
    - id: "criterio_tecnico_plan — AddSessionExerciseDto 404/422 sin crear SessionExercise"
      descripcion: "Ningun caso de error crea el SessionExercise"
      cumple: true
      evidencia: "SIN CAMBIOS DEL CICLO 1 — plans.service.spec.ts (create no invocado en los expects); plans.e2e-spec.ts 422 verifica explicitamente que la sesion sigue con 1 solo ejercicio"
    - id: "gate_openapi_ciclo2 — contrato pasa Spectral sin errores ni warnings"
      descripcion: "Correccion del ciclo 1 (type: String en 15 propiedades de 6 DTOs, tags plans/plans-catalog en export-openapi.mjs) resuelve el bloqueante sin cambiar el shape del contrato"
      cumple: true
