      porcentaje: 100
      target: 80
      cumple: true
    adaptadores:
      porcentaje: 100
      target: 70
      cumple: true
    detalle_por_archivo:
      - archivo: "src/modules/subscriptions/subscriptions.service.ts"
        statements: 100
        branches: 100
        functions: 100
        lines: 100
        tipo: "dominio"
      - archivo: "src/modules/plans/plans.service.ts"
        statements: 99.59
        branches: 95.34
        functions: 100
        lines: 99.58
        tipo: "dominio"
        nota: "modificado (hasSubscribers real); linea 254 sin cubrir es preexistente de EPICA-03, ajena a este cambio"
      - archivo: "src/modules/subscriptions/subscriptions.controller.ts"
        statements: 100
        branches: 100
        functions: 100
        lines: 100
        tipo: "adaptador"
      - archivo: "src/modules/notifications/listeners/subscription-requested.listener.ts"
        statements: 100
        branches: 100
        functions: 100
        lines: 100
        tipo: "adaptador"
      - archivo: "src/modules/notifications/listeners/subscription-approved.listener.ts"
        statements: 100
        branches: 100
        functions: 100
        lines: 100
        tipo: "adaptador"
      - archivo: "src/modules/notifications/listeners/subscription-rejected.listener.ts"
        statements: 100
        branches: 100
        functions: 100
        lines: 100
        tipo: "adaptador"
      - archivo: "src/modules/notifications/email.service.ts"
        statements: 100
        branches: 85.71
        functions: 100
        lines: 100
        tipo: "adaptador"
        nota: "modificado (3 metodos nuevos); ramas sin cubrir (lineas 117,176,235,291) son preexistentes de sendAdminInvitation, ajenas a este cambio"

  tests:
    unitarios:
      pasaron: 535
      fallaron: 0
    e2e:
      estado: "PASS"
      pasaron: 200
      fallaron: 0
      motivo_no_ejecutado: ""
      fallos: []
      nota: >
        199 al cierre del ciclo 1 = 37 tests nuevos de
        test/subscriptions.e2e-spec.ts + 162 de los 4 suites preexistentes
        (audit 10, auth 34, exercises 37, plans 81), todos en la misma
        corrida (fileParallelism: false). ACTUALIZADO A 200 por el
        orquestador tras el ciclo 2: el +1 es el test de auditoria que
        verifica audit_logs.resourceIds en GET /subscriptions/pending,
        agregado al corregir el unico hallazgo del Lider Tecnico. Cifra
        confirmada contra la salida real de `pnpm run test:e2e` (exit 0)
        despues de la correccion.

  criterios_de_aceptacion:
    - id: "CAT-1"
      descripcion: "Cobertura de dominio (SubscriptionsService) >= 80%/80%/75%/80% lineas/funciones/branches/statements, medido por archivo"
      cumple: true
      evidencia: "subscriptions.service.ts: 100/100/100/100 (pnpm run test:cov)"
    - id: "CAT-2"
      descripcion: "Cobertura de adaptadores (SubscriptionsController) >= 70%"
      cumple: true
      evidencia: "subscriptions.controller.ts: 100/100/100/100"
    - id: "CAT-3"
      descripcion: "SubscriptionsService usa unicamente BusinessException/BusinessError y TechnicalException/TechnicalError"
      cumple: true
      evidencia: "Lectura de subscriptions.service.ts: todos los throw son BusinessException o TechnicalException, sin excepciones HTTP nativas de Nest"
    - id: "CAT-4"
      descripcion: "subscriptions NO importa PlansService/PlansModule/AuthService/AuthModule — solo PrismaService y EventEmitter2"
      cumple: true
      evidencia: "Imports de subscriptions.service.ts/.controller.ts/.module.ts revisados: PrismaService, EventEmitter2, exceptions/common, DTOs propios y generated/prisma unicamente"
    - id: "CAT-5"
      descripcion: "Todos los endpoints documentan sus respuestas de error con @ApiProblemResponse"
      cumple: true
      evidencia: "6/6 endpoints con @ApiProblemResponse por cada codigo declarado en `errores` del plan (create: 400/401/403/404/409; findMine/findPending: 401/403; approve/reject: 401/403/404/409; acceptConsent: 400/401/403/404/409)"
    - id: "CAT-6"
      descripcion: "Test unitario que verifica que hasSubscribers(planId) consulta Subscription con status IN [APPROVED, ACTIVE] excluyendo PENDING"
      cumple: true
      evidencia: "plans.service.spec.ts > unpublish() > 'hasSubscribers(planId) consulta Subscription con status IN [APPROVED, ACTIVE] y excluye PENDING'"
    - id: "CAT-7"
      descripcion: "Test e2e de unpublish(): plan publicado + suscripcion Aprobada -> 409 PLAN_HAS_SUBSCRIBERS; solo Pendientes SI permite despublicar"
      cumple: true
      evidencia: "subscriptions.e2e-spec.ts > 'POST /api/plans/:id/unpublish — CA-009-7' (3 tests: APPROVED bloquea, ACTIVE bloquea, solo PENDING no bloquea)"
    - id: "CAT-8"
      descripcion: "Test unitario/e2e: Rechazada NO bloquea reintento (CA-012-3); Pendiente/Aprobada/Activa SI bloquean (CA-012-2)"
      cumple: true
      evidencia: "unitario: it.each sobre los 3 estados bloqueantes + test dedicado de reintento tras Rechazo; e2e: 'CA-012-2/CA-012-3 — bloquea...pero permite reintentar tras un Rechazo'"
    - id: "CAT-9"
      descripcion: "Test unitario de atomicidad de accept-consent en la $transaction"
      cumple: true
      evidencia: "subscriptions.service.spec.ts > acceptConsent() > 'atomicidad: si la $transaction falla...'; complementado en e2e verificando el LegalAcceptance persistido en el happy path"
    - id: "CAT-10"
      descripcion: "Test e2e: POST /subscriptions a un plan en Borrador -> 409 PLAN_NOT_PUBLISHED sin crear fila"
      cumple: true
      evidencia: "subscriptions.e2e-spec.ts > 'CA-012-4 — rechaza con 409 PLAN_NOT_PUBLISHED...sin crear ninguna fila' (verificado con prisma.subscription.count)"
    - id: "CAT-11"
      descripcion: "Test unitario/e2e de accept-consent con plan Archivado -> 409 PLAN_NOT_PUBLISHED, suscripcion permanece Aprobada, sin LegalAcceptance (CA-014-8 caso 1)"
      cumple: true
      evidencia: "unitario: 'CA-014-8, caso 1 de 2 — plan Archivado'; e2e: 'CA-014-8 (caso 1 de 2)' con verificacion de subscription.status, activatedAt y ausencia de LegalAcceptance"
    - id: "CAT-12"
      descripcion: "Test unitario CRITICO de accept-consent: plan PUBLISHED persistido con endDate vencida, sin write-through -> 409 PLAN_NOT_PUBLISHED (CA-014-8 caso 2)"
      cumple: true
      evidencia: "unitario: 'CA-014-8, CASO CRITICO 2 de 2'; e2e: manipula endDate directamente via Prisma tras publicar/aprobar SIN volver a leer el plan como coach, y verifica ademas que plan.status sigue PUBLISHED (nadie disparo el write-through)"
    - id: "CAT-13"
      descripcion: "Test que verifica que POST /subscriptions con plan PUBLISHED persistido pero endDate vencida tambien responde 409 PLAN_NOT_PUBLISHED"
      cumple: true
      evidencia: "subscriptions.service.spec.ts > create() > 'lanza PLAN_NOT_PUBLISHED (CASO CRITICO)...' — mismo helper isPlanCurrentlyPublished() que acceptConsent(), confirmando que no diverge entre los dos call-sites"
    - id: "CAT-14"
      descripcion: "Test que verifica que el email/log de subscription.requested/approved/rejected no incluye datos de salud ni el body completo del request"
      cumple: true
      evidencia: "3 listener specs verifican que loggerMock.error/warn SOLO contienen subscriptionId, nunca nombre del atleta ni correo; Subscription no tiene ningun campo de salud por diseño de schema, asi que no hay superficie posible para esa fuga"

  vulnerabilidades: []

  hallazgos_no_bloqueantes:
    - severidad: "BAJA"
      descripcion: >
        El export de OpenAPI emite un aviso propio (no de Spectral): el tag
        'subscriptions' no tiene descripcion en TAG_DESCRIPTIONS de
        scripts/export-openapi.mjs, a diferencia de 'plans'/'exercises'/etc.
      ubicacion: "scripts/export-openapi.mjs (TAG_DESCRIPTIONS)"
      recomendacion: "Agregar una entrada para 'subscriptions' en TAG_DESCRIPTIONS — cosmetico, no bloquea ningun gate (Spectral no lo evalua)."
    - severidad: "BAJA"
      descripcion: >
        Hallazgo de proceso, no de codigo: plans.service.spec.ts tenia 3
        tests que dependian implicitamente del comportamiento del stub
        (hasSubscribers() fijo en false) sin mockear prisma.subscription.count
        — al pasar a la implementacion real (EPICA-04), esos 3 tests
        rompieron por un TypeError, no por un assert de negocio. Indica que
        el Desarrollador actualizo plans.service.ts sin correr test:cov antes
        de entregar, o sin notar el fallo.
      ubicacion: "src/modules/plans/plans.service.spec.ts (corregido por QA)"
      recomendacion: "Confirmar con el Desarrollador que corrio pnpm run test:cov antes de reportar el checkpoint como listo, para que este tipo de rotura silenciosa se detecte antes de llegar a QA."

  escaneo_automatico:
    ejecutado: true
    ejecutado_por: "orquestador"
    motivo_no_ejecucion: >
      El agente QA NO pudo ejecutarlo: no tiene disponible el tool para
      invocar el slash command /security-review dentro de esta sesion (solo
      cuenta con Read/Write/Bash/SendMessage) — /security-review es un
      comando manejado por el harness interactivo, no un binario invocable
      via Bash. El QA lo declaro como ejecutado: false y lo escalo en vez de
      darlo por aprobado, que es el manejo correcto. En su lugar corrio el
      checklist manual de la seccion 5 de rulesArquitectura completo
      (guards, logs, ownership, DTOs de respuesta, comunicacion entre
      modulos, import de Prisma, acceso directo a Supabase) — sin hallazgos.
      RESUELTO por el orquestador, que si puede invocarlo: ver
      `detalle_ejecucion_orquestador`.
    detalle_ejecucion_orquestador: >
      Ejecutado por el orquestador el 2026-08-20. El harness de
      /security-review diffea unicamente lo commiteado y todo EPICA-04 esta
      sin commitear, asi que el alcance se apunto a mano a los archivos del
      working tree. Resultado: SIN hallazgos HIGH ni MEDIUM. Verificado uno
      por uno: los 6 handlers llevan @Roles (el rol va por metodo, D-1) bajo
      @UseGuards(JwtAuthGuard, RolesGuard) de clase; create() toma el
      athleteId del token y nunca del body; findMine filtra por athleteId
      (:162,164); findPending por plan.coachId (:217); approve/reject pasan
      por findOwnedByCoachOrFail (:491); acceptConsent por
      findOwnSubscriptionOrFail (:519). Sin mass assignment:
      CreateSubscriptionDto solo acepta planId y AcceptConsentDto solo
      documentVersion, con whitelist + forbidNonWhitelisted en el
      ValidationPipe global (main.ts:81-82). El LegalAcceptance toma userId
      del token e ip/userAgent del request, nunca del body, y se escribe en
      la misma $transaction que el cambio a ACTIVE (:419-434). Sin
      $queryRaw/$executeRaw en el codigo nuevo. SubscriptionResponseDto
      expone 8 campos, ninguno interno (reviewedBy queda fuera). Los logs de
      los 3 listeners llevan solo subscriptionId; EmailService loggea
      recipientDomain, nunca la direccion completa.
    observacion_no_bloqueante: >
      documentVersion llega del cliente y se persiste como evidencia de un
      consentimiento juridicamente vinculante sin contrastarse contra un
      catalogo server-side de versiones validas. NO es un defecto de
      EPICA-04: es el patron ya establecido en EPICA-01 por la decision D-8
      (auth.service.ts:80,91,186,197 hace lo mismo con
      personalDataDocumentVersion y termsDocumentVersion). Es sistemico y
      preexistente; corregirlo solo en subscriptions dejaria la
      inconsistencia al reves. Corresponde evaluarlo como decision
      transversal, fuera del alcance de esta epica.
    hallazgos: []
    resumen:
      total: 0
      high: 0
      medium: 0
      low: 0
      descartados: 0

  checklist_manual_seguridad:
    - item: "Endpoints sin JwtAuthGuard"
      resultado: "OK — @UseGuards(JwtAuthGuard, RolesGuard) a nivel de controller, los 6 endpoints protegidos"
    - item: "Logs con passwords/tokens/datos de salud"
      resultado: "OK — los 3 listeners y EmailService solo loggean subscriptionId o dominio del correo, verificado con tests dedicados"
    - item: "Queries Prisma sin filtro de ownership"
      resultado: "OK — findOwnedByCoachOrFail/findOwnSubscriptionOrFail verifican coachId/athleteId antes de mutar, con RESOURCE_OWNERSHIP_DENIED si no coincide"
    - item: "originalError expuesto al cliente"
      resultado: "OK — no se toco TechnicalException; el patron existente (loggea pero no expone) se reutiliza sin cambios"
    - item: "DTOs de respuesta exponen archivedAt/passwords/tokens/datos de salud"
      resultado: "OK — SubscriptionResponseDto excluye explicitamente reviewedBy; SubscriptionPendingSummaryResponseDto solo expone athleteName (sin email/telefono/identificacion); Subscription no tiene campos de salud"
    - item: "Aceptaciones legales mutables (UPDATE/DELETE)"
      resultado: "OK — SubscriptionsController no expone ningun endpoint que modifique o borre un LegalAcceptance"
    - item: "Service importa otro service de otro modulo"
      resultado: "OK — subscriptions.service.ts solo importa PrismaService (compartido, @Global) y EventEmitter2"
    - item: "Controller con try/catch"
      resultado: "OK — SubscriptionsController es thin, sin try/catch"
    - item: "Controller accede a PrismaService"
      resultado: "OK — SubscriptionsController no inyecta PrismaService"
    - item: "Service lanza HttpException nativa"
      resultado: "OK — unicamente BusinessException/TechnicalException"
    - item: "Import de Prisma fuera de generated/prisma"
      resultado: "OK — `from '../../../generated/prisma/index.js'` en subscriptions.service.ts"
    - item: "Import de @supabase/supabase-js en el backend"
      resultado: "OK — grep sin resultados en src/ ni package.json"
    - item: "Tests e2e llamando a *.supabase.co directamente"
      resultado: "OK — subscriptions.e2e-spec.ts solo llama a /api/... via supertest(http)"

  alcance_diferido:
    - id: "CA-014-3"
      descripcion: >
        "El atleta no puede acceder a las sesiones del plan sin aceptar el
        consentimiento" — DIFERIDO a EPICA-05 por decision D-9 del plan de
        implementacion: no existe ningun endpoint de sesiones en esta epica
        al cual adjuntar la verificacion. No es un gap de esta epica, es
        alcance explicitamente trasladado. BusinessError.CONSENT_REQUIRED
        queda reservado para ese uso futuro.
    - id: "subscription.activated"
      descripcion: >
        Evento emitido sin listener en esta epica, a proposito (decision
        D-7) — punto de integracion declarado para EPICA-05 (deep-copy /
        habilitacion de sesiones). No es un defecto.

  validacion_openapi:
    ejecutado: true
    motivo_no_ejecucion: ""
    errores: 0
    warnings: 0
    detalle: []

  errores_criticos: []

  estado: "APROBADO"
  motivo_rechazo: ""
