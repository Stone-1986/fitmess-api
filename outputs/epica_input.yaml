epica:
  id: "EPICA-04"
  titulo: "Inscripcion de Atletas a Planes"
  objetivo_de_negocio: >
    Gestionar el flujo completo de suscripcion de un atleta a un plan de entrenamiento
    publicado: la solicitud del atleta, la aprobacion o rechazo del entrenador, y la
    aceptacion del consentimiento informado deportivo, cumpliendo los requisitos legales
    de cada inscripcion de forma independiente por plan. Criterio de exito: ningun
    atleta puede iniciar sesiones de un plan sin haber completado las tres etapas del
    flujo (solicitud, aprobacion, consentimiento).
  contexto_de_aplicacion: >
    Plataforma de entrenamiento deportivo personalizado (fitmess-api). EPICA-01,
    EPICA-09, EPICA-02 y EPICA-03 ya estan implementadas en main: existen los roles
    ATHLETE, COACH y ADMIN en el enum UserRole; los guards JwtAuthGuard + RolesGuard
    viven en src/modules/common/; el modelo Plan (con su jerarquia Fase -> Semana ->
    Sesion -> SessionExercise) esta implementado con los cuatro estados de RN-27
    (Borrador, Publicado, Finalizado, Archivado); y el modelo LegalAcceptance
    (append-only, con documentType, documentVersion, ip, userAgent y momento de
    aceptacion) ya registra la aceptacion de documentos legales del atleta en su
    registro inicial (EPICA-01, HU-003).

    El schema de Prisma ya anticipa esta epica en dos puntos concretos, verificados
    contra prisma/schema.prisma:

    1. El enum SubscriptionStatus (PENDING, APPROVED, REJECTED, ACTIVE) ya existe,
    definido junto a PlanStatus desde el diseno base, aunque el modelo Subscription (la
    tabla en si, con sus relaciones a User y Plan) todavia no existe: crearlo es
    responsabilidad de esta epica. Sus cuatro valores encajan exactamente con las tres
    HUs de esta epica: PENDING es el resultado de la solicitud del atleta (HU-012),
    APPROVED/REJECTED son la decision del entrenador (HU-013), y ACTIVE es el resultado
    de que el atleta acepte el consentimiento informado deportivo (HU-014). El
    comentario del modelo Plan en el schema lo confirma explicitamente: "EPICA-04/05
    referenciaran desde Subscription/SessionResult".

    2. El enum DocumentType ya incluye el valor SPORT_CONSENT (junto a HABEAS_DATA,
    TERMS_OF_SERVICE y HEALTH_DATA_CONSENT, usados en EPICA-01), y LegalAcceptance ya
    tiene un campo planId opcional sin uso hasta ahora. Esto indica que el
    consentimiento informado deportivo de HU-014 se registra con el mismo mecanismo de
    trazabilidad legal que el habeas data del registro inicial: un registro append-only
    con documentType = SPORT_CONSENT y planId apuntando al plan especifico, uno por cada
    par (atleta, plan), lo que cumple RN-20 (el consentimiento se acepta de forma
    independiente en cada inscripcion).

    Esta epica tambien resuelve el punto de integracion que EPICA-03 dejo
    deliberadamente abierto: el metodo privado hasSubscribers(planId) en
    src/modules/plans/plans.service.ts hoy siempre retorna false porque no existia
    tabla de suscripciones. El comentario del propio metodo indica que EPICA-04 debe
    reemplazar unicamente su cuerpo por una consulta real contra Subscription, sin
    tocar el resto de unpublish(). Mientras eso no ocurra, CA-009-7 de EPICA-03
    (bloqueo de despublicacion de un plan con atletas suscritos) no es verificable
    end-to-end, solo por test unitario — ese gap fue documentado y aceptado en EPICA-03
    con la condicion explicita de resolverse aqui.
  restricciones_conocidas:
    - "Solo el rol ATHLETE puede solicitar inscripcion a un plan y aceptar el consentimiento informado correspondiente (RN-18)"
    - "Solo el rol COACH propietario del plan puede aprobar o rechazar una solicitud de inscripcion a ESE plan (RN-18); ni ADMIN ni otro entrenador tienen esa facultad"
    - "Un atleta solo puede solicitar inscripcion a planes en estado Publicado (RN-27, heredado de EPICA-03); planes en Borrador, Finalizado o Archivado no aceptan nuevas solicitudes"
    - "El consentimiento informado deportivo se solicita de forma independiente en cada inscripcion: un registro de aceptacion por cada par (atleta, plan), nunca reutilizado entre planes distintos aunque sea el mismo atleta (RN-20)"
    - "El consentimiento debe incluir explicitamente que las recomendaciones de la IA no sustituyen asesoria medica profesional (CA-014-5)"
    - "Ningun atleta puede iniciar sesiones de un plan sin haber completado el flujo completo: solicitud, aprobacion del entrenador y aceptacion del consentimiento informado (criterio de exito de la epica)"
    - "Las suscripciones no se eliminan bajo ninguna circunstancia, incluidas las Rechazadas: se conservan como parte del historial, extendiendo a suscripciones el mismo criterio de inmutabilidad historica que RN-13 ya aplica a planes y resultados"
  supuestos:
    - "[CONFIRMADO por el humano — 2026-08-20] Una suscripcion existente en estado Pendiente, Aprobada o Activa para el mismo par (atleta, plan) bloquea una nueva solicitud de inscripcion a ese plan (CA-012-2). Si la suscripcion previa quedo Rechazada, el atleta SI puede volver a solicitar inscripcion al mismo plan, creando una nueva suscripcion (CA-012-3). CONSECUENCIA PARA EL DBA: el par (atleta, plan) puede repetirse legitimamente en la tabla, por lo que un @@unique([athleteId, planId]) simple es INCORRECTO — la unicidad debe ser parcial (solo sobre los estados que bloquean: Pendiente, Aprobada, Activa) o no existir, resolviendose la exclusividad en el service"
    - "[CONFIRMADO por el humano — 2026-08-20] Para efectos de hasSubscribers(planId) (el gap dejado por EPICA-03, CA-009-7), 'atleta suscrito' significa una suscripcion en estado Aprobada o Activa. Una suscripcion en Pendiente NO cuenta como 'suscrito', porque el entrenador todavia podria rechazarla en el mismo momento en que intenta despublicar el plan"
    - "[CONFIRMADO por el humano — 2026-08-20] El consentimiento informado deportivo es un documento unico y versionado a nivel de plataforma (mismo patron que habeas data y terminos de EPICA-01), no un texto redactado individualmente por cada entrenador para su plan. RN-20 exige una ACEPTACION independiente por cada plan (un registro por cada par atleta-plan), no un CONTENIDO distinto por plan. La personalizacion del texto por entrenador queda FUERA del alcance de esta epica"
    - "[CONFIRMADO por el humano — 2026-08-20] No existe una accion explicita de 'rechazar' o 'declinar' el consentimiento informado. El atleta solo tiene dos posibilidades frente al consentimiento: aceptarlo o dejarlo pendiente indefinidamente, sin poder iniciar sesiones mientras tanto. NO se modela un estado adicional de 'consentimiento rechazado' ni se agrega ningun valor al enum SubscriptionStatus, que se mantiene con los cuatro valores ya definidos en el schema"
    - "[PENDIENTE — decision del Arquitecto/DBA] LegalAcceptance.planId existe hoy como columna suelta (String? sin relacion a Plan, prisma/schema.prisma:116). Al usarla para el consentimiento de HU-014 debe decidirse si se le agrega la FK a Plan o se deja como esta; sin FK, un planId invalido entra sin error"
    - "[PENDIENTE — decision del Arquitecto] CA-014-3 ('el atleta no puede acceder a las sesiones del plan sin aceptar el consentimiento') describe un comportamiento sobre endpoints de sesiones que son alcance de EPICA-05 y todavia no existen. Debe decidirse si se reformula como regla que EPICA-05 esta obligada a respetar, o si queda como gap declarado y verificable solo por test unitario — mismo patron que hasSubscribers en EPICA-03"
  glosario:
    suscripcion: "Relacion entre un atleta y un plan de entrenamiento especifico, con estado propio (Pendiente, Aprobada, Rechazada, Activa) que refleja en que punto del flujo de inscripcion se encuentra. Es la entidad que resuelve la relacion N:N de RN-17 entre atletas y entrenadores"
    solicitud_de_inscripcion: "Accion inicial del atleta que crea una suscripcion en estado Pendiente para un plan Publicado especifico"
    consentimiento_informado_deportivo: "Documento legal versionado que el atleta debe aceptar explicitamente por cada plan al que fue aprobado, dejando constancia de que comprende los riesgos del entrenamiento y de que las recomendaciones de la IA no sustituyen asesoria medica profesional. Es independiente del habeas data aceptado en el registro inicial (EPICA-01, HU-003)"
    suscripcion_activa: "Estado final del flujo de inscripcion: el entrenador aprobo la solicitud Y el atleta acepto el consentimiento informado. Solo una suscripcion Activa habilita al atleta a iniciar las sesiones de ese plan (implementacion de ese inicio es alcance de EPICA-05)"
  dependencias:
    - desde: "HU-012"
      hacia: "HU-003"
      descripcion: "Solo un atleta que completo su registro inicial (EPICA-01) puede solicitar inscripcion a un plan"
    - desde: "HU-012"
      hacia: "HU-011"
      descripcion: "El atleta debe poder ver el detalle de un plan en estado Publicado (EPICA-03) antes de poder solicitar su inscripcion"
    - desde: "HU-013"
      hacia: "HU-012"
      descripcion: "No puede aprobarse ni rechazarse una solicitud de inscripcion que el atleta no haya creado primero"
    - desde: "HU-014"
      hacia: "HU-013"
      descripcion: "El consentimiento informado solo se solicita despues de que el entrenador aprobo la suscripcion (estado Aprobada); sin aprobacion previa no hay nada que aceptar"
  historias_de_usuario:
    - id: "HU-012"
      titulo: "Solicitud de inscripcion a un plan de entrenamiento"
      como: "atleta"
      quiero: "solicitar mi inscripcion a un plan de entrenamiento publicado"
      para: "iniciar el proceso de incorporacion a ese plan"
      criterios_de_aceptacion:
        - "CA-012-1: Dado que un atleta autenticado esta viendo el detalle de un plan en estado Publicado y no tiene ninguna suscripcion Pendiente, Aprobada ni Activa a ese plan, Cuando solicita su inscripcion, Entonces la solicitud queda registrada como una suscripcion en estado Pendiente, Y el entrenador propietario del plan recibe una notificacion de nueva solicitud de inscripcion"
        - "CA-012-2: Dado que el atleta ya tiene una suscripcion en estado Pendiente, Aprobada o Activa para un plan especifico, Cuando intenta solicitar inscripcion nuevamente a ese mismo plan, Entonces ve un mensaje indicando que ya tiene una solicitud en curso o ya esta inscrito en ese plan, Y la nueva solicitud no se registra"
        - "CA-012-3: Dado que el atleta tiene una suscripcion Rechazada previa a un plan, Cuando solicita inscripcion nuevamente a ese mismo plan, Entonces se registra una nueva suscripcion en estado Pendiente, igual que si fuera la primera solicitud"
        - "CA-012-4: Dado que el atleta intenta inscribirse a un plan que no esta en estado Publicado (Borrador, Finalizado o Archivado), Cuando realiza la solicitud, Entonces ve un mensaje indicando que el plan ya no acepta nuevas inscripciones, Y la solicitud no se registra"
        - "CA-012-5: Dado que un usuario con rol COACH o ADMIN intenta solicitar inscripcion a un plan, Cuando envia la peticion, Entonces la operacion se rechaza por falta de permisos, ya que solo un atleta puede solicitar su propia inscripcion"
        - "CA-012-6: Dado que un usuario sin autenticar intenta solicitar inscripcion a un plan, Cuando envia la peticion, Entonces la operacion se rechaza por falta de credenciales"
      reglas_de_negocio:
        - "RN-17: Relacion N:N entre atletas y entrenadores mediante suscripcion a planes"
        - "RN-18: El entrenador publica planes; el atleta se suscribe; el entrenador aprueba la inscripcion"
        - "RN-27 (heredada de EPICA-03): Solo los planes en estado Publicado aceptan nuevas solicitudes de inscripcion"
      notas:
        - "El estado inicial de toda suscripcion es Pendiente (enum SubscriptionStatus ya definido en el schema: Pendiente, Aprobada, Rechazada, Activa, verificado en prisma/schema.prisma). Esta HU solo produce ese primer estado; HU-013 y HU-014 producen los siguientes"
        - "[CONFIRMADO por el humano — 2026-08-20] Bloqueo de reintento mientras exista una suscripcion Pendiente/Aprobada/Activa (CA-012-2), y permiso de reintento tras un Rechazo (CA-012-3). Ver la seccion de supuestos de la epica para la consecuencia sobre la unicidad de la tabla"
    - id: "HU-013"
      titulo: "Aprobacion o rechazo de inscripcion de atleta a un plan"
      como: "entrenador"
      quiero: "revisar las solicitudes de inscripcion pendientes a mis planes y aprobarlas o rechazarlas"
      para: "controlar quienes forman parte de mi grupo de atletas"
      criterios_de_aceptacion:
        - "CA-013-1: Dado que existe una suscripcion en estado Pendiente de un atleta a un plan propio del entrenador, Cuando el entrenador aprueba la solicitud, Entonces la suscripcion cambia a estado Aprobada, Y el atleta recibe una notificacion indicando que su solicitud fue aprobada y que debe aceptar el consentimiento informado del plan para poder iniciar sus sesiones"
        - "CA-013-2: Dado que existe una suscripcion en estado Pendiente de un atleta a un plan propio del entrenador, Cuando el entrenador la rechaza, Entonces la suscripcion cambia a estado Rechazada, Y el atleta recibe una notificacion indicando que su solicitud fue rechazada, Y puede volver a solicitar inscripcion a ese u otros planes"
        - "CA-013-3: Dado que el entrenador accede al panel de gestion de sus atletas, Cuando consulta las solicitudes pendientes, Entonces ve el listado de suscripciones en estado Pendiente para sus planes, con el nombre del atleta y el plan al que solicito inscribirse"
        - "CA-013-4: Dado que un entrenador intenta aprobar o rechazar una suscripcion de un plan que no le pertenece, Cuando envia la peticion, Entonces la operacion se rechaza porque solo el entrenador propietario del plan puede decidir sobre sus solicitudes de inscripcion"
        - "CA-013-5: Dado que un usuario con rol ATHLETE o ADMIN intenta aprobar o rechazar una solicitud de inscripcion, Cuando envia la peticion, Entonces la operacion se rechaza por falta de permisos"
        - "CA-013-6: Dado que una suscripcion ya fue aprobada o rechazada anteriormente, Cuando el entrenador intenta aprobarla o rechazarla de nuevo, Entonces ve un mensaje indicando que esa solicitud ya fue resuelta, Y el estado de la suscripcion no cambia"
        - "CA-013-7: Dado que un usuario sin autenticar intenta aprobar o rechazar una solicitud de inscripcion, Cuando envia la peticion, Entonces la operacion se rechaza por falta de credenciales"
      reglas_de_negocio:
        - "RN-18: El entrenador debe aceptar la inscripcion del atleta al plan antes de que quede confirmada"
        - "RN-20: Una vez aprobada la solicitud, el atleta debe aceptar el consentimiento informado especifico de ese plan (ver HU-014); la aprobacion del entrenador por si sola no habilita el inicio de sesiones"
      notas:
        - "El estado Aprobada es intermedio: habilita el flujo de HU-014, pero no equivale por si solo a que el atleta pueda iniciar sesiones del plan (eso requiere ademas el estado Activa, resultado de aceptar el consentimiento). Por eso SubscriptionStatus define cuatro valores y no solo tres"
        - "[CONFIRMADO por el humano — 2026-08-20] Esta HU resuelve el punto de integracion que EPICA-03 dejo abierto: el metodo hasSubscribers(planId) (hoy un stub que siempre retorna false en plans.service.ts) debe consultar si existe al menos una suscripcion en estado Aprobada o Activa para el plan. Una suscripcion en Pendiente NO cuenta como 'suscrito' para ese proposito. Con esta resolucion, CA-009-7 de EPICA-03 (bloqueo de despublicacion de un plan con atletas suscritos) deja de ser un gap y pasa a ser verificable end-to-end"
        - "A diferencia del documento fuente original, CA-013-1 ya no incluye la presentacion del consentimiento informado como parte de este mismo criterio: esa verificacion es responsabilidad exclusiva de HU-014, que la cubre con sus propios criterios de aceptacion. Aqui solo se garantiza que la notificacion al atleta menciona el paso pendiente"
    - id: "HU-014"
      titulo: "Aceptacion del consentimiento informado deportivo al inscribirse a un plan"
      como: "atleta"
      quiero: "revisar y aceptar el consentimiento informado deportivo del plan al que fui aprobado"
      para: "dejar constancia de que comprendo los riesgos y condiciones del entrenamiento, y poder iniciar mis sesiones"
      criterios_de_aceptacion:
        - "CA-014-1: Dado que el entrenador aprobo la suscripcion del atleta a un plan (estado Aprobada), Cuando el atleta accede a la plataforma, Entonces ve el consentimiento informado deportivo pendiente de aceptacion para ese plan"
        - "CA-014-2: Dado que el atleta esta visualizando el consentimiento informado de un plan cuya suscripcion propia esta en estado Aprobada, Cuando lo acepta explicitamente, Entonces la suscripcion cambia a estado Activa, Y queda habilitado para iniciar las sesiones de ese plan, Y el sistema registra la aceptacion con el momento exacto, la version del documento y el plan al que corresponde"
        - "CA-014-3: Dado que la suscripcion del atleta a un plan esta en estado Aprobada pero aun no acepto el consentimiento informado, Cuando intenta acceder a las sesiones de ese plan, Entonces ve el consentimiento pendiente y no puede continuar hasta aceptarlo"
        - "CA-014-4: Dado que un atleta tiene suscripciones Aprobadas o Activas en planes de diferentes entrenadores, Cuando revisa sus consentimientos, Entonces ve un consentimiento independiente por cada plan, aunque el contenido del documento sea el mismo"
        - "CA-014-5: Dado que la plataforma usa IA para generar recomendaciones sobre el entrenamiento, Cuando el atleta visualiza el consentimiento informado, Entonces ve incluida la advertencia de que las recomendaciones de la IA no sustituyen asesoria medica profesional"
        - "CA-014-6: Dado que un atleta intenta aceptar el consentimiento informado de una suscripcion que no es propia (de otro atleta), Cuando envia la peticion, Entonces la operacion se rechaza porque solo el titular de la suscripcion puede aceptar su propio consentimiento"
        - "CA-014-7: Dado que un usuario sin autenticar intenta aceptar un consentimiento informado, Cuando envia la peticion, Entonces la operacion se rechaza por falta de credenciales"
      reglas_de_negocio:
        - "RN-20: El consentimiento informado se solicita en cada inscripcion a un plan, de forma independiente"
        - "Cada aceptacion se registra con el momento exacto, la version del documento y el identificador del atleta, mismo mecanismo de trazabilidad legal usado en EPICA-01 para el habeas data (HU-003)"
        - "El disclaimer de IA es obligatorio en el contenido del consentimiento (CA-014-5)"
      notas:
        - "El consentimiento informado deportivo se registra con el mismo mecanismo de trazabilidad legal usado en el registro inicial del atleta (EPICA-01, HU-003): un registro append-only por aceptacion, con el tipo de documento, su version y el plan al que corresponde. Es un registro independiente por cada par (atleta, plan), aunque el contenido del documento sea el mismo salvo que cambie de version — verificado contra el schema: LegalAcceptance ya tiene un campo planId opcional y DocumentType ya incluye SPORT_CONSENT"
        - "[CONFIRMADO por el humano — 2026-08-20] No existe una accion explicita de 'rechazar' o 'declinar' el consentimiento informado: el atleta solo puede aceptarlo o dejarlo pendiente indefinidamente, sin poder iniciar sesiones mientras tanto. No se modela un estado adicional de consentimiento rechazado ni se agrega ningun valor al enum SubscriptionStatus"
        - "El inicio efectivo de las sesiones del plan una vez la suscripcion queda Activa es alcance de EPICA-05, no de esta HU: aqui solo se garantiza que la suscripcion transiciona a Activa y que sin esa transicion el atleta no puede avanzar"
