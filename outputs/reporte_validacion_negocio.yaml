validacion_producto:
  epica_id: "EPICA-02"
  fecha: "2026-08-05"
  analista: "Analista de Producto — fitmess-api"

  resumen_ejecutivo: >
    La epica EPICA-02 "Catalogo Global de Ejercicios" define tres historias de usuario que
    cubren el ciclo de vida del contenido del catalogo: creacion (HU-005), versionado por
    modificacion (HU-006) e inhabilitacion (HU-007). El objetivo de negocio es claro: sin
    biblioteca de ejercicios no hay insumo para construir planes en EPICA-03. La cadena de
    dependencias HU-006 -> HU-005 y HU-007 -> HU-005 es correcta y no presenta contradicciones.

    Las tres decisiones originales del humano del 2026-08-05 siguen incorporadas de forma
    consistente: (1) los campos exactos del ejercicio (name, description, muscleGroup); (2) la
    inhabilitacion sin bloqueo por uso (EXERCISE_IN_USE efectivamente no se referencia en ningun
    criterio, verificado contra business-error.enum.ts); (3) la epica se implementa completa
    aceptando que CA-006-1 y CA-006-3 no son verificables end-to-end hasta EPICA-03.

    Desde la version anterior de este reporte el humano tomo dos decisiones adicionales, ambas
    ya incorporadas en `epica_input.yaml` y validadas aqui: agregar CA-006-6 (bloquea el PATCH
    sobre un ejercicio inhabilitado) y, tras la interaccion que esto genero con CA-005-2 y con la
    ausencia de reactivacion, precisar CA-005-2 (unicidad de nombre solo entre ejercicios ACTIVOS,
    case-insensitive, con trim) y agregar CA-005-6 (el nombre de un ejercicio inhabilitado queda
    libre para un ejercicio nuevo). Esta segunda decision resuelve la condicion no bloqueante que
    yo mismo habia marcado sobre el caracter terminal de la inhabilitacion. Tambien revise la
    consecuencia directa de permitir que un ejercicio activo y uno inhabilitado compartan nombre
    (dos filas con el mismo `name` en una consulta que incluya inhabilitados): no es un problema
    funcional — ver argumento en HU-005.

    Validacion legal: esta epica gestiona contenido de catalogo (ejercicios), no datos
    personales ni datos sensibles de salud de ningun individuo. Ley 1581/2012 (consentimiento
    y datos personales) y Ley 527/1999 (validez de documentos digitales) NO aplican a ninguna
    de las tres HU — exigir aviso de privacidad, consentimiento explicito o registro en
    legal_acceptances aqui seria sobre-ingenieria sin sustento legal, porque no hay un titular
    de datos personales involucrado en la creacion/edicion/inhabilitacion de un ejercicio.
    Ley 1273/2009 (seguridad de la informacion) SI aplica siempre. La parte de control de
    acceso esta cubierta: las cinco HU tienen criterios explicitos de autenticacion (401) y
    autorizacion por rol (403) para ATHLETE. La parte de trazabilidad de auditoria NO esta
    cubierta hoy: verifique contra el codigo (`src/modules/common/interceptors/` solo contiene
    `response.interceptor.ts`, y `grep -rn "auditLog" src` no devuelve escrituras) que no existe
    ningun interceptor que capture las mutaciones en la tabla `audit_logs`. Es un hallazgo
    preexistente y transversal a todo el sistema, ya registrado como hallazgo abierto #1 en
    `outputs/execution-log.md` (severidad Media, 2026-08-05), no algo que esta epica introduzca.
    Ver condicion no bloqueante al respecto mas abajo.

    Quedan dos condiciones no bloqueantes abiertas, ninguna de naturaleza legal que impida
    avanzar: HU-006 requiere que el reporte de QA documente explicitamente el gap E2E de
    CA-006-1/CA-006-3, condicion que la propia HU ya exige en sus notas y que aqui se ratifica
    como condicion de aprobacion; y las tres HU heredan la ausencia de un log de auditoria real
    para sus mutaciones, gap preexistente que no corresponde resolver dentro del alcance de esta
    epica. La condicion sobre precision de CA-005-2 y la condicion sobre el caracter terminal de
    la inhabilitacion, ambas senaladas en la version anterior de este reporte, quedan RESUELTAS
    por las decisiones del humano incorporadas hoy en `epica_input.yaml` — ver detalle en HU-005.

  historias_de_usuario:

    - id: "HU-005"
      titulo: "Creacion de ejercicio en la biblioteca global"
      decision: "APROBADA"
      observaciones: >
        Los seis criterios de aceptacion son claros, atomicos y verificables. CA-005-1 fija
        correctamente el estado inicial (isActive = true, versionNumber = 1) y la nota de la
        HU exige crear Exercise + ExerciseVersion en una sola operacion atomica, lo cual es
        consistente con el principio de que "un Exercise sin ninguna ExerciseVersion es un
        estado invalido del dominio". CA-005-3 (visibilidad inmediata sin aprobacion) y
        CA-005-4/CA-005-5 (control de acceso por rol y autenticacion) son correctos y
        consistentes con RN-04 y RN-22.

        RESUELTA la condicion no bloqueante de la version anterior de este reporte: CA-005-2 ya
        precisa que la comparacion es "sin distinguir mayusculas de minusculas y recortando los
        espacios al inicio y al final" contra ejercicios ACTIVOS. Cubre exactamente el caso que
        senale ("Sentadilla" vs "sentadilla " con espacio final ya no pueden coexistir). Doy por
        cerrada esta condicion.

        CA-005-6 (agregada el 2026-08-05) es clara y verificable: si existe un ejercicio
        inhabilitado con un nombre X, crear un ejercicio nuevo con nombre X debe proceder con
        exito. Valido que CA-005-2 y CA-005-6 son complementarias y no contradictorias: CA-005-2
        acota la unicidad a activos, CA-005-6 confirma explicitamente que un nombre inhabilitado
        queda libre. Juntas resuelven la interaccion que yo habia senalado como condicion en la
        version anterior de este reporte (ver HU-006 y HU-007): con esta decision, un entrenador
        que detecte una errata en un ejercicio ya inhabilitado puede crear de inmediato un
        ejercicio nuevo y corregido con el mismo nombre — el bloqueo de edicion de CA-006-6 deja
        de ser un callejon sin salida a nivel de negocio, aunque el registro original en si mismo
        siga congelado (eso es coherente con RN-06 y es la intencion declarada: contenido
        retirado no se resucita, se reemplaza).

        Consecuencia revisada de CA-005-6: un ejercicio activo y uno inhabilitado pueden terminar
        compartiendo el mismo `name` (el original inhabilitado y su reemplazo activo). Evaluo si
        esto es un problema funcional y concluyo que NO, por tres razones. Primera: no hay
        ambiguedad de datos — un plan referencia un `exerciseVersionId` concreto, nunca un nombre,
        asi que dos ejercicios con el mismo nombre nunca se confunden a nivel de persistencia.
        Segunda: CA-007-3 ya exige que un ejercicio inhabilitado se muestre "junto con... su
        estado inactivo" cuando se consulta directamente; ese mismo principio cubre por extension
        cualquier listado que decida incluir inhabilitados (si el Arquitecto agrega un parametro
        tipo `includeInactive`), porque cada fila ya debe traer su estado — no hace falta una CA
        nueva para que la ambiguedad visual se resuelva, ya esta gobernada por un criterio
        existente. Tercera: es el comportamiento esperado de un catalogo con soft-delete/versionado
        (retirar y reemplazar bajo el mismo nombre es una operacion normal en este tipo de
        sistemas), no un defecto de diseno. No declaro condicion por este punto; queda cerrado.

        Investigacion de industria: los datasets de ejercicios de referencia (wger, exercemus,
        API Ninjas) usan nombres unicos por ejercicio como clave funcional de identificacion, lo
        que valida CA-005-2 como practica correcta. Acotar la unicidad a activos (en vez de a
        todo el historico) tambien es coherente con el patron RN-06 de inhabilitacion sin borrado:
        un dataset de referencia no necesita reservar el nombre de contenido retirado.

        No quedan condiciones abiertas propias de esta HU.

      guardarrails_aplicables:
        - ley: "Ley 1581/2012 + Circular SIC No. 2/2024 — Consentimiento y datos personales"
          aplica: false
          cumple: true
          accion_requerida: >
            No aplica. El ejercicio (name, description, muscleGroup) es contenido de catalogo,
            no un dato personal de un individuo identificado ni identificable. No hay titular
            de datos involucrado en la creacion de un ejercicio. Exigir aviso de privacidad o
            consentimiento aqui seria sobre-ingenieria sin base legal.

        - ley: "Ley 1273/2009 — Seguridad de la informacion"
          aplica: true
          cumple: false
          accion_requerida: >
            Parcialmente cubierto. CA-005-4 y CA-005-5 exigen 403/401 para ATHLETE y usuarios no
            autenticados respectivamente — eso si esta resuelto. Lo que NO esta cubierto es la
            trazabilidad de auditoria: no existe un interceptor global que registre en
            `audit_logs` quien creo el ejercicio, cuando y desde donde. Verificado contra el
            codigo: no hay ningun `AuditInterceptor` en `src/modules/common/interceptors/` ni
            escrituras a `auditLog` en `src/`. Es el hallazgo abierto #1 de
            `outputs/execution-log.md`, preexistente a esta epica y transversal a todo el
            sistema. No propongo que HU-005 lo resuelva — construir un interceptor global de
            auditoria es una tarea de infraestructura cross-cutting fuera del alcance de una HU
            de catalogo — pero no puede darse por cumplido.

        - ley: "Ley 527/1999 — Validez de documentos digitales"
          aplica: false
          cumple: true
          accion_requerida: >
            No aplica. No hay firma de contrato, transaccion economica ni documento con valor
            legal involucrado en crear un ejercicio de catalogo.

      fuentes_consultadas:
        - url: "https://github.com/exercemus/exercises"
          resumen: >
            Dataset de ejercicios open source curado desde exercemus, wger.de y exercises.json.
            Usa el nombre del ejercicio como identificador funcional unico dentro de la
            biblioteca, lo que valida la restriccion de unicidad de nombre de CA-005-2.
        - url: "https://hivo.co/blog/creating-a-fitness-taxonomy-template-for-your-needs"
          resumen: >
            Las taxonomias de fitness organizan grupos musculares y equipamiento en categorias
            jerarquicas. Confirma que muscleGroup como texto libre (decision ya tomada por el
            humano) es una simplificacion deliberada frente al estandar de industria (que suele
            usar taxonomia estructurada), aceptable dado que ninguna HU de esta epica requiere
            filtrado o agregacion por grupo muscular.

    - id: "HU-006"
      titulo: "Modificacion de un ejercicio existente genera nueva version"
      decision: "APROBADA_CON_CONDICIONES"
      observaciones: >
        Los seis criterios son claros. CA-006-2 (historial de versiones con numero y fecha)
        y CA-006-4/CA-006-5 (no encontrado, control de acceso) son directamente verificables.
        RN-05 y RN-07 son consistentes entre si y con HU-007.

        CA-006-6 es clara y, a diferencia de CA-006-1 y CA-006-3, SI es completamente verificable
        end-to-end en esta epica: no depende de la consulta de uso en planes (que no existe
        todavia) sino del campo isActive, que ya existe desde HU-007. No contradice RN-05, RN-06
        ni RN-07: RN-06 exige que el ejercicio inhabilitado no se elimine, y se cumple (sigue
        existiendo y es legible por CA-007-3); RN-05/RN-07 rigen el comportamiento de un ejercicio
        activo usado en planes, y CA-006-6 simplemente antepone una verificacion de isActive antes
        de que esa logica se evalue. El orden logico para el service queda sin solapamientos:
        (1) existe el ejercicio (CA-006-4), (2) esta activo (CA-006-6), (3) esta en uso o no
        (CA-006-1/CA-006-3). Usa EXERCISE_INACTIVE (422), consistente con CA-007-4.

        CA-006-1 y CA-006-3 dependen de una consulta ("¿este ejercicio ya fue usado en un
        plan?") que no tiene tabla contra la cual resolverse en esta epica, porque el modelo
        de planes es EPICA-03. La epica ya reconoce esto de forma explicita en sus notas y
        propone una mitigacion funcionalmente razonable: aislar la verificacion detras de un
        unico metodo del service que hoy siempre devuelve false, cubriendo ambas ramas (usado
        / no usado) con tests unitarios que mockean ese metodo. Esto es aceptable como
        implementacion completa de la epica bajo la decision del humano del 2026-08-05, siempre
        que el gap quede visible y no se presente como cobertura end-to-end real.

        CONDICION NO BLOQUEANTE (trazabilidad): ratifico como condicion de aprobacion lo que
        la propia HU ya exige en sus notas: el reporte de QA debe declarar explicitamente que
        CA-006-1 y CA-006-3 estan verificados solo a nivel unitario (mock) y no de forma
        end-to-end, y que su cobertura e2e real llega con EPICA-03. Esta condicion no bloquea
        la implementacion; bloquea que el gap se presente en el reporte de QA como si fuera
        una cobertura completa.

        RESUELTA la condicion no bloqueante de la version anterior de este reporte sobre el
        caracter terminal de la inhabilitacion: yo habia senalado que CA-006-6, combinado con
        CA-005-2 (que no distinguia activos de inhabilitados) y la ausencia de reactivacion,
        dejaba un ejercicio inhabilitado sin ninguna via de correccion — ni editarlo ni
        reemplazarlo con el mismo nombre. El humano resolvio esto el 2026-08-05 acotando CA-005-2
        a ejercicios ACTIVOS y agregando CA-005-6, que libera explicitamente el nombre de un
        ejercicio inhabilitado para un ejercicio nuevo. Con esto, el registro inhabilitado en si
        mismo sigue sin poder editarse (coherente con CA-006-6 y con RN-06), pero el bloqueo ya
        no es un callejon sin salida a nivel de negocio: existe una via de correccion (crear un
        ejercicio nuevo con el mismo nombre). Validado en detalle en HU-005. No queda condicion
        abierta por este punto.

      guardarrails_aplicables:
        - ley: "Ley 1581/2012 + Circular SIC No. 2/2024 — Consentimiento y datos personales"
          aplica: false
          cumple: true
          accion_requerida: >
            No aplica. Modificar el contenido de un ejercicio (name, description, muscleGroup)
            no involucra datos personales de ningun usuario.

        - ley: "Ley 1273/2009 — Seguridad de la informacion"
          aplica: true
          cumple: false
          accion_requerida: >
            Parcialmente cubierto. CA-006-5 exige 403 para ATHLETE — resuelto. La modificacion
            de un ejercicio (creacion de nueva version o edicion in-place) NO queda registrada
            en `audit_logs` porque, verificado contra el codigo, ningun `AuditInterceptor`
            existe ni escribe ahi (mismo hallazgo abierto #1 de `outputs/execution-log.md`,
            preexistente y transversal). No corresponde a esta HU resolverlo.

        - ley: "Ley 527/1999 — Validez de documentos digitales"
          aplica: false
          cumple: true
          accion_requerida: >
            No aplica. No hay contrato ni transaccion economica en juego al versionar contenido
            de catalogo.

      fuentes_consultadas: []

    - id: "HU-007"
      titulo: "Inhabilitacion de un ejercicio en la biblioteca"
      decision: "APROBADA"
      observaciones: >
        Los cinco criterios son claros, verificables y coherentes entre si. CA-007-1 refleja
        con precision la decision del humano del 2026-08-05: la inhabilitacion procede siempre,
        independientemente del uso, y EXERCISE_IN_USE efectivamente no aparece en ningun
        criterio de esta HU (se verifico contra el catalogo de errores real en
        business-error.enum.ts). CA-007-2 y CA-007-3 distinguen correctamente el listado
        (oculta inhabilitados) de la consulta directa por id (los muestra con su estado), lo
        que es necesario para que un plan historico pueda seguir mostrando un ejercicio que ya
        no esta activo en el catalogo — consistente con RN-07 y con el glosario de la epica.
        CA-007-4 usa EXERCISE_INACTIVE correctamente para el caso de doble inhabilitacion, y
        esa entrada tambien se verifico existente en el catalogo.

        Historial de esta observacion sobre reactivacion: en la primera version de este reporte
        conclui que la ausencia de reactivacion no generaba vacio funcional. Al agregarse
        CA-006-6, retracte esa conclusion: sin edicion posible sobre un ejercicio inhabilitado y
        sin reactivacion, una errata quedaba sin remedio. El humano resolvio la interaccion el
        2026-08-05 (ver HU-005 y HU-006): CA-005-2 ahora se compara solo contra activos y CA-005-6
        libera el nombre de un ejercicio inhabilitado. Con esto, la ausencia de reactivacion vuelve
        a ser sostenible sin vacio funcional — no porque el ejercicio inhabilitado pueda corregirse
        (sigue sin poder), sino porque existe una via de reemplazo inmediata bajo el mismo nombre.
        Es una diferencia real frente a "reactivar": el reemplazo es una entidad nueva (id nuevo,
        versionNumber = 1), no una continuacion del historial de versiones del ejercicio original;
        un plan que referenciaba el ejercicio inhabilitado sigue apuntando a esa version original,
        no al reemplazo. Esto es coherente con RN-06/RN-07 y no requiere ninguna HU nueva.

        Consecuencia de CA-005-6 revisada aqui tambien porque toca CA-007-2/CA-007-3: un ejercicio
        activo y uno inhabilitado pueden compartir `name`. Evaluado en detalle en la entrada de
        HU-005 — no es un problema funcional. Para esta HU el punto relevante es que CA-007-3 ya
        exige mostrar el estado inactivo al consultar directamente, principio que cubre cualquier
        listado futuro que incluya inhabilitados. Cerrado, sin condicion nueva.

        No se identifican condiciones abiertas propias de esta HU. Comparte la condicion
        transversal sobre ausencia de log de auditoria (ver guardarrail Ley 1273/2009 abajo).

      guardarrails_aplicables:
        - ley: "Ley 1581/2012 + Circular SIC No. 2/2024 — Consentimiento y datos personales"
          aplica: false
          cumple: true
          accion_requerida: >
            No aplica. Inhabilitar un ejercicio de catalogo no involucra datos personales.

        - ley: "Ley 1273/2009 — Seguridad de la informacion"
          aplica: true
          cumple: false
          accion_requerida: >
            Parcialmente cubierto. CA-007-5 exige 403 para ATHLETE — resuelto. La inhabilitacion
            de un ejercicio (quien la ejecuto y cuando) NO queda registrada en `audit_logs`:
            verificado contra el codigo, no existe interceptor de auditoria (mismo hallazgo
            abierto #1 de `outputs/execution-log.md`). Especialmente relevante aqui porque
            inhabilitar es una accion con impacto operativo (retira el ejercicio del catalogo
            para planes nuevos) sin rastro de quien la tomo. No corresponde a esta HU resolver
            el interceptor global, pero el riesgo queda documentado.

        - ley: "Ley 527/1999 — Validez de documentos digitales"
          aplica: false
          cumple: true
          accion_requerida: >
            No aplica. No hay documento con valor legal ni transaccion economica involucrada.

      fuentes_consultadas: []

  conflictos_con_arquitecto: []

  escalamiento_requerido: false
  motivo_escalamiento: ""

  nota_sobre_comparacion_con_arquitecto: >
    Al momento de esta validacion, outputs/plan_de_implementacion.yaml corresponde todavia a
    EPICA-09 (la epica anterior) — el plan del Arquitecto para EPICA-02 no estaba disponible
    para comparar. No se detectan conflictos porque no hay artefacto contra el cual detectarlos
    todavia, no porque se haya verificado ausencia de conflicto. Si el plan del Arquitecto para
    EPICA-02 introduce, por ejemplo, un bloqueo por uso al inhabilitar, o campos adicionales al
    ejercicio mas alla de name/description/muscleGroup, eso seria un conflicto directo con esta
    validacion y debe escalarse al humano en cuanto se detecte.

  condiciones_no_bloqueantes_resumen:
    - hu: "HU-005"
      ley: "funcional"
      estado: "RESUELTA (2026-08-05)"
      condicion: >
        [Resuelta] Precisar en CA-005-2 que la deteccion de nombre duplicado es case-insensitive
        y con trim de espacios. El humano incorporo la precision directamente en el texto de
        CA-005-2 en epica_input.yaml. Se mantiene en el reporte por trazabilidad, no requiere
        accion adicional.

    - hu: "HU-006"
      ley: "funcional / trazabilidad de QA"
      estado: "ABIERTA"
      condicion: >
        El reporte de QA debe documentar explicitamente que CA-006-1 y CA-006-3 solo estan
        verificados a nivel unitario (mock del metodo de verificacion de uso) y no de forma
        end-to-end en esta epica, con su cobertura e2e real pendiente hasta EPICA-03. Esta
        condicion ya la exige la propia HU en sus notas; se ratifica aqui como condicion de
        aprobacion de negocio.

    - hu: "HU-006 y HU-007 (interaccion CA-006-6 x CA-005-2 x ausencia de reactivacion)"
      ley: "funcional"
      estado: "RESUELTA (2026-08-05)"
      condicion: >
        [Resuelta] Yo habia senalado que CA-006-6, combinado con la version original de CA-005-2
        (que no distinguia activos de inhabilitados) y la ausencia de reactivacion, dejaba un
        ejercicio inhabilitado sin ninguna via de correccion. El humano lo resolvio acotando
        CA-005-2 a ejercicios ACTIVOS y agregando CA-005-6 (libera el nombre de un ejercicio
        inhabilitado para uno nuevo). Se mantiene en el reporte por trazabilidad, no requiere
        accion adicional.

    - hu: "HU-005 y HU-007 (consecuencia de CA-005-6: nombre compartido entre activo e inhabilitado)"
      ley: "funcional"
      estado: "EVALUADA — NO ES UN PROBLEMA FUNCIONAL"
      condicion: >
        Revisado a pedido del equipo: con CA-005-6, un ejercicio activo y uno inhabilitado pueden
        terminar compartiendo el mismo `name`. No se declara como condicion porque: (1) no hay
        ambiguedad de datos, los planes referencian `exerciseVersionId`, nunca `name`; (2) CA-007-3
        ya exige mostrar el estado inactivo al consultar un ejercicio inhabilitado, principio que
        cubre por extension cualquier listado que en el futuro incluya inhabilitados — no requiere
        una CA nueva porque ya esta gobernado por un criterio existente; (3) es el comportamiento
        esperado de un catalogo con soft-delete (retirar y reemplazar bajo el mismo nombre), no un
        defecto. Se deja constancia de que se evaluo y se cerro, no que se paso por alto.

    - hu: "HU-005, HU-006, HU-007 (transversal)"
      ley: "Ley 1273/2009"
      estado: "ABIERTA"
      condicion: >
        Ninguna mutacion de esta epica (crear, editar, inhabilitar un ejercicio) queda registrada
        en `audit_logs`, porque el `AuditInterceptor` global nunca se implemento en el codebase
        (verificado: `src/modules/common/interceptors/` solo tiene `response.interceptor.ts`;
        `grep -rn "auditLog" src` no devuelve escrituras). Es el hallazgo abierto #1 de
        `outputs/execution-log.md` (severidad Media, 2026-08-05), preexistente desde EPICA-01 y
        transversal a todo el sistema, no algo que EPICA-02 introduzca ni deba resolver por si
        sola. No lo marco como bloqueante para esta epica porque construir el interceptor es una
        tarea de infraestructura cross-cutting, no una HU de catalogo de ejercicios — pero el
        reporte no puede afirmar que la trazabilidad de auditoria esta cubierta. Corresponde al
        humano decidir si resolver el hallazgo #1 se prioriza antes, junto con, o despues de
        EPICA-02.

  notas_finales: >
    Las decisiones del humano del 2026-08-05 (campos exactos del ejercicio, inhabilitacion sin
    bloqueo por uso, implementacion completa de la epica aceptando el gap E2E de HU-006, y las
    dos decisiones mas recientes: CA-006-6 y la pareja CA-005-2 acotada + CA-005-6) no se reabren
    en este reporte y se verificaron incorporadas de forma consistente en las tres HU. CA-006-6
    es clara, verificable end-to-end sin las limitaciones de CA-006-1/CA-006-3, y no contradice
    RN-05, RN-06 ni RN-07. Su efecto secundario sobre el caracter terminal de la inhabilitacion —
    que yo mismo habia marcado como condicion no bloqueante pendiente de aceptacion consciente —
    quedo resuelto por la decision del humano de acotar CA-005-2 a activos y agregar CA-005-6: un
    ejercicio inhabilitado sigue sin poder editarse, pero su nombre queda disponible de inmediato
    para un reemplazo corregido, lo que evita el vacio funcional que yo habia senalado. Tambien se
    evaluo la consecuencia directa de esa misma decision (un ejercicio activo y uno inhabilitado
    pueden compartir nombre) y se concluyo que no es un problema funcional: no genera ambiguedad
    de datos y ya esta cubierta por el principio de CA-007-3 de mostrar el estado del ejercicio.

    La epica no maneja datos personales ni datos sensibles de salud: es contenido de catalogo,
    por lo que Ley 1581/2012 y Ley 527/1999 no aplican a ninguna HU, y aplicarlas seria
    sobre-ingenieria. Ley 1273/2009 aplica siempre; su parte de control de acceso esta cubierta
    por los criterios 401/403 de cada HU, pero su parte de trazabilidad de auditoria NO esta
    cubierta porque el `AuditInterceptor` global nunca se construyo (hallazgo abierto #1,
    preexistente y transversal, no introducido por esta epica). Quedan dos condiciones abiertas
    (gap E2E de HU-006 y ausencia de log de auditoria transversal), dos condiciones resueltas por
    decisiones del humano ya incorporadas (precision de duplicados en HU-005, caracter terminal de
    la inhabilitacion en HU-006/HU-007), y un punto adicional evaluado y cerrado sin necesidad de
    condicion (nombre compartido entre activo e inhabilitado). Ninguna condicion abierta es
    bloqueante ni de naturaleza legal. El Documentador puede iniciar una vez el Arquitecto cierre
    su plan, sujeto a que no surjan conflictos con esta validacion (ver
    nota_sobre_comparacion_con_arquitecto).
