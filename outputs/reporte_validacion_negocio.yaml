validacion_producto:
  epica_id: "EPICA-04"
  fecha: "2026-08-20"
  historias_de_usuario:
    - id: "HU-012"
      decision: "APROBADA"
      observaciones: >
        Flujo de solicitud de inscripcion completo y verificable: cubre el camino feliz
        (CA-012-1), el bloqueo de duplicados mientras exista una suscripcion Pendiente,
        Aprobada o Activa (CA-012-2), el reintento permitido tras un Rechazo (CA-012-3),
        el filtro por estado Publicado del plan (CA-012-4), la restriccion de rol
        (CA-012-5) y la exigencia de autenticacion (CA-012-6). Los criterios son
        verificables uno a uno y no hay contradicciones con RN-17, RN-18 ni con RN-27
        heredada de EPICA-03. Los cuatro supuestos confirmados por el humano el
        2026-08-20 quedan reflejados correctamente en las CA y en las notas de la HU;
        no se reabren.

        Observacion no bloqueante (mejora de industria, fuera del alcance minimo de
        esta HU): plataformas comparables (TrainingPeaks) expiran automaticamente una
        solicitud de conexion coach-atleta no atendida (72 horas) para evitar que quede
        en Pendiente indefinidamente y bloquee reintentos via CA-012-2. Esta epica no
        define expiracion — es una decision de producto legitima para una iteracion
        futura, no un defecto de esta HU. No genero condicion por esto: la mitigacion
        natural ya existe (el atleta puede seguir viendo su solicitud Pendiente y el
        entrenador recibe notificacion en CA-012-1).
      guardarrails_aplicables:
        - ley: "Ley 1273/2009"
          aplica: true
          cumple: true
          accion_requerida: >
            Ninguna. CA-012-5 y CA-012-6 cubren control de acceso por rol y
            autenticacion. El registro de auditoria de recursos consultados ya es
            transversal (commit bfd541c, "registrar los recursos consultados en la
            auditoria") y aplica automaticamente sin requerir CA adicional en esta HU.
        - ley: "Ley 1581/2012 + Circular SIC 2024"
          aplica: true
          cumple: true
          accion_requerida: >
            Ninguna. Esta HU no recolecta datos personales nuevos: relaciona un
            atleta ya registrado (con su Habeas Data aceptado en EPICA-01/HU-003) con
            un plan Publicado. No se requiere un nuevo aviso de privacidad ni
            consentimiento adicional en esta etapa.
        - ley: "Ley 527/1999"
          aplica: true
          cumple: true
          accion_requerida: >
            Ninguna. La restriccion_conocida de la epica ("las suscripciones no se
            eliminan bajo ninguna circunstancia, incluidas las Rechazadas") extiende a
            esta HU el mismo criterio de inmutabilidad historica que RN-13 ya aplica a
            planes y resultados, dando integridad y disponibilidad al registro.
    - id: "HU-013"
      decision: "APROBADA"
      observaciones: >
        Cubre aprobacion (CA-013-1), rechazo (CA-013-2), listado de pendientes con
        contexto suficiente para decidir (CA-013-3), validacion de propiedad del plan
        (CA-013-4), restriccion de rol (CA-013-5), idempotencia frente a una decision ya
        tomada (CA-013-6) y autenticacion (CA-013-7). RN-18 y RN-20 quedan correctamente
        secuenciadas: la aprobacion del entrenador es necesaria pero no suficiente — el
        estado Aprobada es explicitamente intermedio hasta que HU-014 produzca Activa.
        La nota de la HU que resuelve el gap de hasSubscribers(planId) dejado por
        EPICA-03 (CA-009-7) esta correctamente delimitada: "suscrito" = Aprobada o
        Activa, Pendiente no cuenta, coherente con que el entrenador aun puede rechazar
        una Pendiente en el mismo momento en que intenta despublicar.

        Observacion no bloqueante, ligada a la pregunta que se eleva en HU-014: ni esta
        HU ni la definicion de archive()/la transicion automatica a Finalizado (por
        endDate) verifican estado de suscripciones antes de permitir el cambio de
        estado del plan — a diferencia de unpublish(), que si bloquea con
        PLAN_HAS_SUBSCRIBERS. Esto significa que un entrenador puede aprobar una
        solicitud (CA-013-1) sobre un plan que luego se archiva o finaliza antes de que
        el atleta alcance a aceptar el consentimiento de HU-014. Ver la pregunta
        formulada en HU-014, que es donde el efecto se materializa (una suscripcion
        podria llegar a Activa sobre un plan ya no Publicado).
      guardarrails_aplicables:
        - ley: "Ley 1273/2009"
          aplica: true
          cumple: true
          accion_requerida: >
            Ninguna. CA-013-4 (propiedad del plan), CA-013-5 (rol) y CA-013-7
            (autenticacion) cubren el acceso no autorizado. Auditoria heredada del
            interceptor transversal ya existente.
        - ley: "Ley 1581/2012 + Circular SIC 2024"
          aplica: true
          cumple: true
          accion_requerida: >
            Ninguna. El nombre del atleta que ve el entrenador en CA-013-3 es un dato
            ya compartido dentro de una relacion coach-atleta preexistente y consentida
            (RN-17, formalizada desde EPICA-01 via CoachRequest). No es una nueva
            recoleccion ni un nuevo tratamiento de datos personales.
        - ley: "Ley 527/1999"
          aplica: true
          cumple: true
          accion_requerida: >
            Ninguna. La decision del entrenador (aprobar/rechazar) queda registrada de
            forma inmutable como parte del historial de la suscripcion, igual criterio
            que HU-012.
    - id: "HU-014"
      decision: "APROBADA"
      observaciones: >
        Es la HU con mayor peso legal de la epica y esta bien resuelta en su nucleo: el
        consentimiento informado deportivo reutiliza exactamente el mecanismo de
        trazabilidad legal ya probado en EPICA-01 (LegalAcceptance append-only, con
        documentType = SPORT_CONSENT, documentVersion y momento de aceptacion), y las CA
        cubren el flujo completo — visibilidad del consentimiento pendiente tras la
        aprobacion (CA-014-1), la transicion a Activa con registro completo
        (CA-014-2), independencia por cada par atleta-plan (CA-014-4), el disclaimer
        obligatorio de IA (CA-014-5), la restriccion de titularidad (CA-014-6) y la
        exigencia de autenticacion (CA-014-7). El cuarto supuesto confirmado por el
        humano (no existe "rechazar" el consentimiento, solo aceptar o dejarlo
        pendiente indefinidamente) queda correctamente reflejado y no se reabre.

        CONDICION RESUELTA el 2026-08-20 por decision del humano — la HU pasa a
        APROBADA sin reservas. Se agrego CA-014-8 a HU-014 en epica_input.yaml:
        aceptar el consentimiento se rechaza si el plan ya no esta vigente, y la
        suscripcion permanece en Aprobada sin transicionar nunca a Activa. Sin estados
        nuevos en SubscriptionStatus. Ademas se decidio explicitamente que archive() NO
        recibe un gate de suscriptores: no es simetrico con unpublish(), porque
        unpublish() devuelve el plan a Borrador EDITABLE (mutar el contenido bajo
        atletas ya inscritos) mientras que archive() es terminal y no altera el
        contenido; queda como decision documentada, no como gap.

        Precision del orquestador sobre el analisis original, verificada contra el
        codigo: la transicion a Finalizado no es "un metodo que no verifica
        suscripciones" sino que NO ES UNA TRANSICION QUE NADIE INVOQUE —
        computeEffectiveStatus() (plans.service.ts:1027-1039) la deriva de
        endDate < now(), de modo que el plan se finaliza por el paso del tiempo y no
        existe punto de codigo donde insertar una verificacion. Por eso CA-014-8
        valida en el momento de ACEPTAR, el unico con un actor y una peticion reales.
        Corolario para la implementacion: la condicion de vigencia no puede ser
        `status !== PUBLISHED`, porque un plan con la columna en PUBLISHED y endDate
        pasada esta efectivamente Finalizado — justo el caso que motiva el CA.

        Alcance real del vacio, tambien verificado: el catalogo filtra
        `status=PUBLISHED AND endDate>=now()` (plans.service.ts:847 y :913), asi que un
        atleta no puede ver ni solicitar un plan no vigente. HU-012 nunca estuvo
        expuesta; el vacio afectaba solo a suscripciones ya creadas en Pendiente o
        Aprobada.

        Registro de la condicion original: la epica no definia que ocurre si
        el plan subyacente cambia de estado (a Finalizado por vencimiento de endDate, o
        a Archivado por el entrenador) entre el momento en que la suscripcion queda
        Aprobada (HU-013) y el momento en que el atleta acepta el consentimiento
        (HU-014). A diferencia de unpublish() (que si bloquea con PLAN_HAS_SUBSCRIBERS
        si hay suscriptores Aprobados/Activos, verificado en
        src/modules/plans/plans.service.ts:732-751), archive() y la transicion
        automatica a Finalizado (por endDate, plans.service.ts:1024-1039) no verifican
        suscripciones existentes. Esto abre la posibilidad de que una suscripcion
        llegue a estado Activa (CA-014-2) sobre un plan que ya no esta Publicado, lo
        cual no contradice literalmente ningun CA de esta HU (ninguno condiciona la
        aceptacion al estado del plan) pero si tensiona el criterio de exito declarado
        a nivel de epica ("ningun atleta puede iniciar sesiones de un plan sin haber
        completado las tres etapas del flujo") con el objetivo implicito de que esas
        tres etapas ocurran sobre un plan vigente. No es un vacio legal — es un vacio
        funcional que la epica no contemplo. Se eleva como pregunta abierta al
        Arquitecto/humano antes de cerrar esta HU sin condiciones; no bloquea el resto
        de la epica ni entra en conflicto con las decisiones ya tomadas por el
        Arquitecto. (Cerrada — ver el bloque CONDICION RESUELTA al inicio de esta
        observacion.)
      guardarrails_aplicables:
        - ley: "Ley 1273/2009"
          aplica: true
          cumple: true
          accion_requerida: >
            Ninguna. CA-014-6 (solo el titular de la suscripcion acepta su propio
            consentimiento) y CA-014-7 (autenticacion) cubren el acceso no autorizado.
        - ley: "Ley 1581/2012 + Circular SIC 2024"
          aplica: true
          cumple: true
          accion_requerida: >
            Ninguna. El consentimiento informado deportivo no es una nueva recoleccion
            de datos personales sino un registro de aceptacion sobre un documento
            versionado a nivel de plataforma (tercer supuesto confirmado por el
            humano). La finalidad (dejar constancia de comprension de riesgos del
            entrenamiento) esta declarada explicitamente en el "para" de la HU.
        - ley: "Ley 527/1999"
          aplica: true
          cumple: true
          accion_requerida: >
            Ninguna respecto del mecanismo: CA-014-2 exige registrar momento exacto,
            version del documento y plan — mismo patron append-only usado y validado en
            EPICA-01 para Habeas Data y Terminos, que garantiza autenticidad,
            integridad y disponibilidad del registro. Verificado contra el schema real
            (prisma/schema.prisma:109-123): LegalAcceptance ya tiene documentVersion,
            ip, userAgent y acceptedAt no nulables, y DocumentType ya incluye
            SPORT_CONSENT.
        - ley: "CA-014-5 — disclaimer de IA (buena practica de industria, no una ley especifica)"
          aplica: true
          cumple: true
          accion_requerida: >
            Ninguna. La investigacion de mercado confirma que el disclaimer de que las
            recomendaciones de IA no sustituyen asesoria medica profesional es
            practica estandar recomendada para apps de fitness/salud que usan IA
            (ver fuentes consultadas). CA-014-5 lo exige explicitamente como parte del
            contenido visible del consentimiento, no como texto oculto o en letra
            pequena — consistente con la mejor practica encontrada.
  fuentes_consultadas:
    - url: "https://www.trainingpeaks.com/pricing/for-coaches/"
      resumen: >
        Plataformas de coaching deportivo comparables (TrainingPeaks) modelan la
        conexion entrenador-atleta como una solicitud que el entrenador debe aceptar, y
        la expiran automaticamente (72 horas) si no se atiende. Confirma que el patron
        solicitud->aprobacion de HU-012/HU-013 es estandar de industria; la ausencia de
        expiracion en esta epica se documenta como observacion no bloqueante en HU-012.
    - url: "https://ensorahealth.com/blog/how-to-handle-informed-consent-for-ai/"
      resumen: >
        Guias de consentimiento informado para IA en salud recomiendan declarar
        explicitamente el alcance y las limitaciones de las recomendaciones generadas
        por IA como parte del consentimiento, no como aviso separado. Respalda CA-014-5
        (disclaimer de IA integrado al consentimiento informado deportivo, no aparte).
    - url: "https://aistandardofcare.com/industries/fitness-wellness/"
      resumen: >
        Estandares de la industria de fitness/wellness con IA recomiendan disclosures
        explicitos de limitaciones y evitar presentar la IA como sustituto de
        asesoria profesional — alineado con el tercer y quinto criterio de aceptacion
        de HU-014.
  conflictos_con_arquitecto: []
  # Estuvo en true por el vacio funcional de HU-014 (plan que deja de estar vigente
  # con una suscripcion Aprobada esperando consentimiento). Resuelto por el humano el
  # 2026-08-20 con CA-014-8; ver la observacion de HU-014. Ninguna HU queda con
  # condiciones abiertas.
  escalamiento_requerido: false
  motivo_escalamiento: >
    No es un conflicto con el Arquitecto (no hay contradiccion entre mi validacion y un
    plan tecnico ya emitido). Es una pregunta funcional abierta que no estaba entre los
    cuatro supuestos confirmados por el humano ni entre los dos puntos PENDIENTE
    marcados como decision del Arquitecto/DBA, y que condiciona la aprobacion plena de
    HU-014: ¿que debe ocurrir si el plan subyacente pasa a Finalizado (automatico, por
    vencimiento de endDate) o es Archivado (accion del entrenador) mientras una
    suscripcion esta en estado Aprobada esperando el consentimiento de HU-014, o
    inclusive despues de que el atleta ya lo acepto? Opciones a decidir: (a) bloquear la
    aceptacion del consentimiento si el plan ya no esta Publicado, agregando un CA
    nuevo a HU-014; (b) permitir la aceptacion igual y dejar que EPICA-05 decida si una
    suscripcion Activa sobre un plan no Publicado puede iniciar sesiones (mismo patron
    de gap declarado que hasSubscribers en EPICA-03); (c) alguna otra regla que el
    humano prefiera. Mientras no se resuelva, HU-014 queda APROBADA_CON_CONDICIONES, no
    RECHAZADA, porque el nucleo legal y funcional de la HU esta correcto y el gap es
    acotado a un edge case de transicion de estados, no al flujo principal.
