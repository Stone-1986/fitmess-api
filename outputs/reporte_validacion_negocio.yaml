validacion_producto:
  epica_id: "EPICA-05"
  fecha: "2026-08-21"
  historias_de_usuario:
    - id: "HU-023"
      decision: "APROBADA"
      observaciones: >
        Los 7 CA originales cubren el flujo completo de forma verificable: creacion
        automatica sin intervencion manual (CA-023-1), congelamiento de version de
        ejercicio con el mismo criterio que RN-07 ya aplica en la plantilla (CA-023-2),
        independencia entre instancias de distintos atletas (CA-023-4), aislamiento de
        lectura por titularidad (CA-023-5), el gate de suscripcion Activa heredado de
        EPICA-04/D-9 (CA-023-6) y autenticacion (CA-023-7). Verificado especificamente
        que CA-023-3 fija solo la CANTIDAD de fases/semanas/sesiones, no el contenido de
        cada sesion, y por eso no entra en conflicto con HU-018 (EPICA-06), donde el
        entrenador modifica el CONTENIDO de una semana antes de que inicie.

        CONDICION RESUELTA el 2026-08-21. `Read` de `outputs/epica_input.yaml` (linea
        95): el texto incorporado de CA-023-8 es IDENTICO, palabra por palabra, al que
        propuse. Sin desvirtuar. HU-023 pasa a APROBADA. Nota de limpieza no bloqueante:
        la NOTA de la HU (linea 105, "el sistema no debe crear una segunda instancia...")
        quedo duplicando en prosa lo que CA-023-8 ya dice como criterio formal; no
        contradice nada, pero puede eliminarse en el proximo barrido para no repetir la
        misma regla en dos formatos.

        NUEVO CA-023-9 (prescripcion en la copia profunda) — validado. Gherkin correcto
        (Dado/Cuando/Entonces/Y), verificable por QA (comparar los campos de prescripcion
        de la instancia recien creada contra los de la plantilla en el mismo instante) y
        consistente con el patron ya establecido por CA-023-1/CA-023-2: la instancia
        copia estructura Y contenido de la plantilla en el momento de la creacion. No
        contradice CA-023-3 (que solo protege CANTIDAD de fases/semanas/sesiones, nunca
        dijo que el contenido de cada ejercicio fuera inmutable) ni la restriccion
        conocida de la epica que deja el contenido mutable para EPICA-06 (RN-32) --
        CA-023-9 es exactamente el mecanismo que le da a RN-32 un valor previo que
        cambiar, sosteniendo en vez de socavar esa justificacion. Practica de industria
        confirmada (ver fuentes_consultadas): comparar "planificado vs. ejecutado" campo
        a campo (series, repeticiones, carga) es un patron estandar en plataformas de
        entrenamiento estructurado.

        HUECO no cubierto por CA-023-9, no bloqueante dado que el proyecto no tiene
        usuarios en produccion: la reapertura de EPICA-03 hara la prescripcion
        obligatoria para PUBLICAR de aqui en adelante, pero no dice que pasa con planes
        que YA estan en estado Publicado sin prescripcion (publicados bajo la regla
        vieja, antes de esta epica). Si un atleta se suscribe a uno de esos planes
        heredados, CA-023-9 copiaria una prescripcion vacia/nula a la instancia sin que
        ningun CA lo contemple, y CA-015-9 no tendria contra que comparar. No genero un
        CA nuevo para esto -- es una decision de migracion/backfill de datos, no una
        regla de negocio que se le pida al usuario -- pero lo dejo señalado para que el
        DBA/Arquitecto decida como tratar los planes ya Publicados al reabrir EPICA-03
        (backfill con valores por defecto, o revertirlos a Borrador).
      guardarrails_aplicables:
        - ley: "Ley 1273/2009"
          aplica: true
          cumple: true
          accion_requerida: >
            Ninguna. CA-023-5, CA-023-6, CA-023-7 y ahora CA-023-8 cubren acceso no
            autorizado e integridad de datos (no duplicacion).
        - ley: "Ley 1581/2012 + Circular SIC 2024"
          aplica: true
          cumple: true
          accion_requerida: >
            Ninguna, incluyendo CA-023-9: series, repeticiones, carga, duracion y
            distancia PRESCRITAS no son dato sensible de salud (a diferencia de dolor
            muscular/motivacion en HU-016) -- son la meta de entrenamiento que el
            entrenador ya definio en su plan, visible para el propio atleta.
        - ley: "Ley 527/1999"
          aplica: false
          cumple: "pendiente"
          accion_requerida: >
            No aplica: HU-023 no genera ni exige aceptacion de un documento legal.
    - id: "HU-015"
      decision: "APROBADA"
      observaciones: >
        Los 8 CA originales siguen verificables y coherentes: registro (CA-015-1),
        edicion libre mientras la semana este abierta sin limite de tiempo (CA-015-2,
        CA-015-3), congelamiento inmediato al cerrar por completitud (CA-015-4,
        CA-015-5), titularidad (CA-015-6), gate de suscripcion Activa (CA-015-7) y
        autenticacion (CA-015-8). La consecuencia combinada RN-08-derogada + PEN-01
        (semana que nunca cierra queda editable indefinidamente) sigue sin contradiccion
        en ningun CA, y el riesgo de reescribir historia ya vista por el entrenador sigue
        cubierto por el AuditInterceptor transversal, sin necesidad de un CA nuevo.

        NUEVO CA-015-9 (campos separados y comparables contra la prescripcion) --
        validado. Gherkin correcto, verificable por QA (existencia de columnas tipadas
        por ejercicio, no un Json opaco) y consistente con CA-015-1: especifica lo que
        antes decia "los resultados de cada ejercicio" de forma generica. No contradice
        ningun CA existente. Confirmo tambien que excluir RPE de estos campos, tal como
        decidio el humano, logra su proposito: ninguno de los 5 campos (series,
        repeticiones, carga, duracion, distancia) es dato sensible de salud bajo Ley
        1581/2012, asi que HU-015 sigue sin necesitar el tratamiento reforzado que si
        aplica a HU-016.

        Observacion menor no bloqueante, no introducida por CA-015-9 sino preexistente:
        ni el glosario ni ningun CA definen si "completar una sesion" (la condicion que
        dispara CA-017-1) exige que TODOS los campos comparables de TODOS los ejercicios
        de la sesion tengan valor, o si basta con que el atleta marque la sesion como
        registrada aunque deje algun ejercicio sin datos. Con columnas tipadas y
        comparables uno a uno esta ambiguedad se vuelve mas facil de probar por QA que
        antes (con Json opaco no habria como verificarla), pero sigue sin resolverse en
        el texto de las HU. No genero condicion porque no fue parte de lo que se me pidio
        validar en este hallazgo y no es un vacio nuevo -- lo señalo para que quien
        redacte el detalle tecnico de "sesion completada" lo tenga presente.
      guardarrails_aplicables:
        - ley: "Ley 1273/2009"
          aplica: true
          cumple: true
          accion_requerida: >
            Ninguna. CA-015-6, CA-015-7 y CA-015-8 cubren el acceso no autorizado.
        - ley: "Ley 1581/2012 + Circular SIC 2024"
          aplica: true
          cumple: true
          accion_requerida: >
            Ninguna. Confirmado con CA-015-9: los 5 campos de resultado no son dato
            sensible de salud. Se mantiene la observacion ya registrada antes: si en el
            futuro se agrega RPE por ejercicio, debe recibir el mismo tratamiento que
            dolor muscular/motivacion en HU-016.
        - ley: "Ley 527/1999"
          aplica: false
          cumple: "pendiente"
          accion_requerida: "No aplica."
    - id: "HU-016"
      decision: "APROBADA"
      observaciones: >
        Las dos condiciones que dejaba abiertas quedan RESUELTAS el 2026-08-21,
        verificadas con `Read` explicito de `outputs/epica_input.yaml` completo (171
        lineas) despues de la incorporacion. HU-016 pasa de APROBADA_CON_CONDICIONES a
        APROBADA, sin reservas.

        (1) CA-016-8 (consentimiento especifico de datos sensibles de salud, linea 144):
        texto identico al propuesto. Sigue siendo correcto bajo la rama (a) ya decidida
        (HEALTH_DATA_CONSENT se captura junto con SPORT_CONSENT en la misma transaccion
        de acceptConsent(), EPICA-04 reabierta): en el camino feliz su precondicion no se
        cumple porque el consentimiento ya llego antes por HU-014/HU-023, y el CA queda
        como invariante de integridad -- mismo rol que CA-023-6 -- no como mecanismo
        primario. Sigue en pie mi recomendacion, ya trasladada y anotada por el equipo,
        de un CA-014-9 en el artefacto de EPICA-04 para el mecanismo primario real; no
        bloquea esta HU.

        (2) CA-016-9 (rango 1-10, linea 145) y el supuesto de escala (linea 60):
        incorporados, validados como cualquier otro CA. Redaccion Gherkin correcta
        (Dado/Cuando/Entonces/Y). Verificable por QA: rango cerrado [1,10], entero, sobre
        dos campos concretos (SUP-05 sigue cerrado, sin tercer indicador). No contradice
        CA-016-1 (que sigue siendo el camino feliz; CA-016-9 es su contraparte de
        validacion, mismo patron que CA-015-1 con sus CAs de rechazo). El texto
        incorporado NO es identico al que propuse, y la diferencia es una mejora, no un
        desvio: yo habia escrito "no se guarda ningun valor para ese indicador" (dejando
        abierta la duda de si el otro indicador, el que si esta en rango, se guardaria
        suelto); el texto final dice "no se guarda ningun registro de sensaciones de esa
        semana" -- rechazo atomico de la operacion completa. Es la lectura correcta:
        CA-016-1 describe un unico acto de registro con AMBOS niveles a la vez, asi que
        la version incorporada evita el estado intermedio raro de una semana con un solo
        indicador guardado y el otro pendiente. La confirmo sin reservas.

        Nota de limpieza no bloqueante, sin resolver todavia: la NOTA "[PENDIENTE —
        confirmar con legal/producto]" de la linea 153 (sobre si RN-19 basta para la
        captura recurrente) sigue en el archivo tal cual estaba antes de que CA-016-8 y
        el supuesto de la linea 59 resolvieran exactamente esa pregunta. Es el mismo tipo
        de artefacto obsoleto que dejo la nota duplicada de HU-023 (linea 105): no
        contradice el CA vigente ni bloquea nada -- CA-016-8 manda -- pero alguien que
        lea solo esa nota sin ver el supuesto de la linea 59 podria creer que la pregunta
        legal sigue abierta. Recomiendo limpiarla en el mismo barrido que la nota de
        HU-023.

        Confirmado de nuevo, sin cambios: CA-016-6 (lectura restringida a atleta y
        entrenador del plan) sigue siendo exactamente el alcance que RI-03 y EPICA-07
        van a necesitar.
      guardarrails_aplicables:
        - ley: "Ley 1273/2009"
          aplica: true
          cumple: true
          accion_requerida: >
            Ninguna. CA-016-4, CA-016-5, CA-016-6 y CA-016-7 cubren el acceso no
            autorizado.
        - ley: "Ley 1581/2012 + Circular SIC 2024"
          aplica: true
          cumple: true
          accion_requerida: >
            Ninguna. CA-016-8 (consentimiento especifico) y CA-016-9 (rango valido de los
            dos indicadores) cierran las dos condiciones. Unica accion pendiente es de
            limpieza documental, no de cumplimiento: retirar la nota obsoleta de la linea
            153 (ver observaciones).
        - ley: "Ley 527/1999"
          aplica: true
          cumple: true
          accion_requerida: >
            Ninguna adicional sobre el mecanismo: la rama (a) reutiliza el mismo patron
            append-only ya validado (documentVersion, momento exacto, usuario
            autenticado) dentro de la misma transaccion que SPORT_CONSENT.
      fuentes_consultadas:
        - url: "https://help.trainingpeaks.com/hc/en-us/articles/115006049708-How-can-I-compare-my-completed-workout-to-my-planned-structured-workout"
          resumen: >
            TrainingPeaks compara "planificado vs. completado" campo a campo (sets,
            reps, carga, duracion, distancia), con codigo de color por cumplimiento.
            Confirma que el patron de CA-023-9/CA-015-9 (misma forma de datos en
            prescripcion y resultado, comparables uno a uno) es estandar de industria en
            plataformas de entrenamiento estructurado, no una decision aislada de este
            proyecto.
    - id: "HU-017"
      decision: "APROBADA"
      observaciones: >
        Sin cambios desde la revision anterior: los 5 CA son verificables y consistentes
        con RN-30 y con la resolucion explicita de PEN-01. Ningun CA nuevo de esta ronda
        (CA-023-8/9, CA-015-9, CA-016-8/9) la afecta.
      guardarrails_aplicables:
        - ley: "Ley 1273/2009"
          aplica: true
          cumple: true
          accion_requerida: "Ninguna. CA-017-4 y CA-017-5 cubren el acceso no autorizado."
        - ley: "Ley 1581/2012 + Circular SIC 2024"
          aplica: true
          cumple: true
          accion_requerida: "Ninguna. El estado de cierre no es en si mismo un dato sensible."
        - ley: "Ley 527/1999"
          aplica: false
          cumple: "pendiente"
          accion_requerida: "No aplica."
  conflictos_con_arquitecto: []
  escalamiento_requerido: false
  motivo_escalamiento: >
    Las cuatro HU de la epica quedan APROBADAS sin condiciones. Las dos condiciones de
    HU-016 (CA-016-8 consentimiento especifico, CA-016-9 rango 1-10) se verificaron
    incorporadas al `epica_input.yaml` con `Read` explicito del archivo completo, y la
    unica diferencia frente a lo que propuse (CA-016-9 con rechazo atomico de la semana
    en vez de solo el indicador invalido) es una mejora que confirmo, no un desvio. Sin
    conflicto con el Arquitecto y sin preguntas abiertas. Quedan dos items de limpieza
    documental no bloqueantes para el proximo barrido (notas obsoletas en HU-023 linea
    105 y HU-016 linea 153) y el hueco de migracion de planes ya Publicados sin
    prescripcion, ya trasladado al DBA/Arquitecto por el equipo -- ninguno condiciona la
    aprobacion de esta epica.
