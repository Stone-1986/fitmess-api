plan_de_implementacion:
  version: "1.0"
  epica_id: "EPICA-03"
  ciclo: 1

  modulos_afectados:
    - "plans (modulo nuevo — src/modules/plans/)"
    - "exercises (isUsedInPlan(exerciseId) en exercises.service.ts:345 pasa a consultar SessionExercise real — unico cambio, sin tocar el resto del archivo)"
    - "common (nuevo guard PlanPublishedGuard en common/guards/, siguiendo el inventario de Temporal Guards de design-patterns skill; el catalogo de BusinessError ya trae PLAN_INCOMPLETE, PLAN_HAS_SUBSCRIBERS, PLAN_IMMUTABLE, INVALID_STATE_TRANSITION, RESOURCE_OWNERSHIP_DENIED, EXERCISE_IN_USE, EXERCISE_INACTIVE, ENTITY_NOT_FOUND, DUPLICATE_ENTITY — todos reutilizables, 0 entries nuevas requeridas)"
    - "notifications (receptor futuro de plan.published/plan.archived/plan.finalized — NO se implementa listener en esta epica, ver decision D-11)"

  # ── RESUMEN (17 endpoints en 2 controllers) ──────────────────────────────
  #
  # PlansController (/plans) — rol COACH exclusivamente (RN-18, sin ADMIN):
  #   1.  POST   /plans                                          — crear plan (shell)
  #   2.  GET    /plans                                          — listar planes propios
  #   3.  GET    /plans/:id                                      — detalle con arbol completo
  #   4.  PATCH  /plans/:id                                      — editar datos generales
  #   5.  POST   /plans/:id/phases                                — agregar fase
  #   6.  DELETE /plans/:id/phases/:phaseId                       — quitar fase
  #   7.  POST   /plans/:id/phases/:phaseId/weeks                 — agregar semana
  #   8.  DELETE /plans/:id/weeks/:weekId                         — quitar semana
  #   9.  POST   /plans/:id/weeks/:weekId/sessions                — agregar sesion
  #   10. DELETE /plans/:id/sessions/:sessionId                   — quitar sesion
  #   11. POST   /plans/:id/sessions/:sessionId/exercises         — agregar ejercicio a sesion
  #   12. DELETE /plans/:id/sessions/:sessionId/exercises/:sessionExerciseId — quitar ejercicio
  #   13. POST   /plans/:id/publish                               — Borrador → Publicado
  #   14. POST   /plans/:id/unpublish                             — Publicado → Borrador
  #   15. POST   /plans/:id/archive                                — cualquiera (no Archivado) → Archivado
  #
  # PlansCatalogController (/catalog/plans) — cualquier usuario autenticado:
  #   16. GET    /catalog/plans                                   — listado de planes Publicados
  #   17. GET    /catalog/plans/:id                                — detalle + perfil publico del entrenador
  #
  # Nota de ruteo: se separa /catalog/plans de /plans/:id a proposito — evita
  # que NestJS confunda un segmento literal "catalog" con el parametro :id de
  # PlansController si ambos convivieran bajo /plans (ver decision D-9).

  endpoints:
    # ══════════════════════════════════════════════════════════════════════
    # HU-008 — Creacion de la plantilla base
    # ══════════════════════════════════════════════════════════════════════

    - hu_id: "HU-008"
      metodo: POST
      ruta: /plans
      proposito: >
        Crear el shell del plan (name obligatorio; description, startDate,
        endDate opcionales) en estado Borrador, sin ninguna fase todavia
        (CA-008-1 arranca aqui, CA-008-2 permite que el plan quede asi
        indefinidamente). RN-01 y RN-02 solo se verifican al publicar
        (HU-009), nunca al crear — ver decision D-3.
      request_body: CreatePlanDto
      response: PlanResponseDto (201)
      errores: [400, 401, 403]
      guards: [JwtAuthGuard, RolesGuard(COACH)]
      eventos: []
      dependencias: []

    - hu_id: "HU-008"
      metodo: GET
      ruta: /plans
      proposito: >
        Listar los planes propios del entrenador autenticado (todos los
        estados), paginado. Endpoint de soporte no atado a una CA especifica
        pero necesario para que el entrenador ubique el borrador que esta
        construyendo — ver decision D-8.
      response: PlanResponseDto[] + PaginationMeta (200)
      errores: [401, 403]
      guards: [JwtAuthGuard, RolesGuard(COACH)]
      eventos: []
      dependencias: [POST /plans]

    - hu_id: "HU-008"
      metodo: GET
      ruta: /plans/:id
      proposito: >
        Detalle del plan propio con el arbol completo embebido: fases →
        semanas → sesiones → ejercicios de sesion (con name/description/
        muscleGroup/versionNumber resueltos desde la ExerciseVersion
        referenciada). Un solo GET agregado en vez de un GET por nivel —
        ver decision D-8. CA-008-6 (ownership) via findOwnedOrFail en el
        service.
      response: PlanDetailResponseDto (200)
      errores: [401, 403, 404]
      guards: [JwtAuthGuard, RolesGuard(COACH)]
      eventos: []
      dependencias: [POST /plans]

    - hu_id: "HU-008"
      metodo: PATCH
      ruta: /plans/:id
      proposito: >
        Editar name/description en cualquier estado; startDate/endDate solo
        si el plan sigue en Borrador (RN-31 solo inmoviliza fechas y
        estructura al publicar — ver decision D-6). CA-008-6 (ownership)
        via findOwnedOrFail.
      request_body: UpdatePlanDto
      response: PlanResponseDto (200)
      errores: [400, 401, 403, 404, 409]
      guards: [JwtAuthGuard, RolesGuard(COACH)]
      eventos: []
      dependencias: [POST /plans]

    - hu_id: "HU-008"
      metodo: POST
      ruta: /plans/:id/phases
      proposito: >
        Agregar una fase al plan. order se calcula en el service (maximo
        order existente + 1) — el DTO no lo recibe (decision D-5). Guard
        PlanPublishedGuard rechaza si el plan no esta en Borrador (una fase
        nueva es estructura, inmutable tras publicar por RN-31).
      request_body: AddPhaseDto
      response: PhaseResponseDto (201)
      errores: [400, 401, 403, 404, 409]
      guards: [JwtAuthGuard, RolesGuard(COACH), PlanPublishedGuard]
      eventos: []
      dependencias: [POST /plans]

    - hu_id: "HU-008"
      metodo: DELETE
      ruta: /plans/:id/phases/:phaseId
      proposito: >
        Quitar una fase (y en cascada sus semanas/sesiones/ejercicios de
        sesion — hard-delete real, no soft-delete: solo procede en Borrador,
        donde nada ha sido usado todavia por un atleta — ver decision D-7).
      response: "{ data: null, message } (200)"
      errores: [401, 403, 404, 409]
      guards: [JwtAuthGuard, RolesGuard(COACH), PlanPublishedGuard]
      eventos: []
      dependencias: [POST /plans/:id/phases]

    - hu_id: "HU-008"
      metodo: POST
      ruta: /plans/:id/phases/:phaseId/weeks
      proposito: >
        Agregar una semana a una fase. Sin request body — weekNumber se
        calcula en el service como secuencial a lo largo de TODO el plan
        (no reinicia por fase), porque EPICA-05 necesita un numero de
        semana unico y comparable entre fases (WeekClosure, sensaciones
        semanales — ver decision D-4 y nota para el DBA en riesgos).
      request_body: "(ninguno)"
      response: WeekResponseDto (201)
      errores: [401, 403, 404, 409]
      guards: [JwtAuthGuard, RolesGuard(COACH), PlanPublishedGuard]
      eventos: []
      dependencias: [POST /plans/:id/phases]

    - hu_id: "HU-008"
      metodo: DELETE
      ruta: /plans/:id/weeks/:weekId
      proposito: >
        Quitar una semana (cascada a sus sesiones y ejercicios de sesion).
        Ruta plana — weekId ya identifica univocamente sin arrastrar
        phaseId (decision D-9).
      response: "{ data: null, message } (200)"
      errores: [401, 403, 404, 409]
      guards: [JwtAuthGuard, RolesGuard(COACH), PlanPublishedGuard]
      eventos: []
      dependencias: [POST /plans/:id/phases/:phaseId/weeks]

    - hu_id: "HU-008"
      metodo: POST
      ruta: /plans/:id/weeks/:weekId/sessions
      proposito: >
        Agregar una sesion a una semana. order calculado en el service
        (maximo order existente en la semana + 1).
      request_body: AddSessionDto
      response: SessionResponseDto (201)
      errores: [400, 401, 403, 404, 409]
      guards: [JwtAuthGuard, RolesGuard(COACH), PlanPublishedGuard]
      eventos: []
      dependencias: [POST /plans/:id/phases/:phaseId/weeks]

    - hu_id: "HU-008"
      metodo: DELETE
      ruta: /plans/:id/sessions/:sessionId
      proposito: Quitar una sesion (cascada a sus ejercicios de sesion). Ruta plana (decision D-9).
      response: "{ data: null, message } (200)"
      errores: [401, 403, 404, 409]
      guards: [JwtAuthGuard, RolesGuard(COACH), PlanPublishedGuard]
      eventos: []
      dependencias: [POST /plans/:id/weeks/:weekId/sessions]

    - hu_id: "HU-008"
      metodo: POST
      ruta: /plans/:id/sessions/:sessionId/exercises
      proposito: >
        Agregar un ejercicio de la biblioteca global a una sesion
        (CA-008-3). El service resuelve exerciseId → ExerciseVersion
        vigente (mayor versionNumber) en el momento de la llamada y
        persiste SessionExercise.exerciseVersionId — nunca un puntero al
        ejercicio (RN-07). Rechaza con ENTITY_NOT_FOUND si el ejercicio no
        existe (RN-04) y con EXERCISE_INACTIVE (422) si esta inhabilitado
        (restriccion heredada de CA-007-2 de EPICA-02). Lectura directa de
        Exercise/ExerciseVersion via PrismaService (compartido, @Global) —
        NO se importa ExercisesModule ni ExercisesService (decision D-2).
        Esta es la escritura que hace real isUsedInPlan() de EPICA-02.
      request_body: AddSessionExerciseDto
      response: SessionExerciseResponseDto (201)
      errores: [400, 401, 403, 404, 409, 422]
      guards: [JwtAuthGuard, RolesGuard(COACH), PlanPublishedGuard]
      eventos: []
      dependencias: [POST /plans/:id/weeks/:weekId/sessions]

    - hu_id: "HU-008"
      metodo: DELETE
      ruta: /plans/:id/sessions/:sessionId/exercises/:sessionExerciseId
      proposito: Quitar un ejercicio de una sesion.
      response: "{ data: null, message } (200)"
      errores: [401, 403, 404, 409]
      guards: [JwtAuthGuard, RolesGuard(COACH), PlanPublishedGuard]
      eventos: []
      dependencias: [POST /plans/:id/sessions/:sessionId/exercises]

    # ══════════════════════════════════════════════════════════════════════
    # HU-009 — Publicacion
    # ══════════════════════════════════════════════════════════════════════

    - hu_id: "HU-009"
      metodo: POST
      ruta: /plans/:id/publish
      proposito: >
        Borrador → Publicado. Rechaza con INVALID_STATE_TRANSITION (409) si
        el estado actual no es Borrador; con PLAN_INCOMPLETE (422) si no
        cumple RN-01 (name + startDate + endDate + al menos una fase con
        una semana con una sesion con un ejercicio — CA-009-2). El check de
        estado NO usa PlanPublishedGuard (ese guard existe para las rutas
        de estructura; aqui la transicion misma es el objeto de la
        verificacion — verificarla dos veces por el mismo mecanismo seria
        circular). findOwnedOrFail cubre CA-009-5.
      response: PlanResponseDto (200)
      errores: [401, 403, 404, 409, 422]
      guards: [JwtAuthGuard, RolesGuard(COACH)]
      eventos: [plan.published]
      dependencias: [POST /plans/:id/sessions/:sessionId/exercises]

    - hu_id: "HU-009"
      metodo: POST
      ruta: /plans/:id/unpublish
      proposito: >
        Publicado → Borrador. Rechaza con INVALID_STATE_TRANSITION (409) si
        el estado actual no es Publicado; con PLAN_HAS_SUBSCRIBERS (409) si
        hasSubscribers(planId) retorna true (CA-009-7). hasSubscribers es
        un stub que hoy siempre retorna false — mismo patron que
        isUsedInPlan de EPICA-02 (decision confirmada del humano). Gap
        declarado: la rama "con suscritos" NO es verificable e2e en esta
        epica, solo con test unitario mockeando el stub — debe constar
        asi en el reporte de QA, no omitirse.
      response: PlanResponseDto (200)
      errores: [401, 403, 404, 409]
      guards: [JwtAuthGuard, RolesGuard(COACH)]
      eventos: []
      dependencias: [POST /plans/:id/publish]

    # ══════════════════════════════════════════════════════════════════════
    # HU-010 — Finalizacion (automatica, sin endpoint) y archivo
    # ══════════════════════════════════════════════════════════════════════

    - hu_id: "HU-010"
      metodo: POST
      ruta: /plans/:id/archive
      proposito: >
        Borrador, Publicado o Finalizado → Archivado (CA-010-2). Rechaza
        con INVALID_STATE_TRANSITION (409) si ya esta Archivado (CA-010-3).
        No verifica hasSubscribers — RN-27/CA-010-2 no lo exigen para
        archivar, a diferencia de unpublish. Si el plan estaba Publicado y
        ya vencio (endDate pasada) pero la columna persistida aun dice
        PUBLISHED, igual se archiva sin problema: el chequeo es "!= ARCHIVED",
        no depende de distinguir Publicado de Finalizado (ver decision D-1).
        Emite plan.finalized ANTES de archivar solo si corresponde
        (ver logica de resolveEffectiveStatus en decision D-1).
      response: PlanResponseDto (200)
      errores: [401, 403, 404, 409]
      guards: [JwtAuthGuard, RolesGuard(COACH)]
      eventos: [plan.archived]
      dependencias: [POST /plans]

    # ══════════════════════════════════════════════════════════════════════
    # HU-011 — Catalogo (atleta)
    # ══════════════════════════════════════════════════════════════════════

    - hu_id: "HU-011"
      metodo: GET
      ruta: /catalog/plans
      proposito: >
        Listar planes en estado Publicado y NO vencidos (CA-011-1,
        CA-011-3). Filtro a nivel de query: status=PUBLISHED AND
        endDate >= now() — un plan Publicado ya vencido queda
        automaticamente excluido sin depender de que la columna persistida
        se haya actualizado a FINALIZED (ver decision D-1). Cada item
        incluye name, startDate, endDate y el perfil publico reducido del
        entrenador (id, name, avatarUrl).
      response: PlanCatalogSummaryResponseDto[] + PaginationMeta (200)
      errores: [401]
      guards: [JwtAuthGuard]
      eventos: []
      dependencias: [POST /plans/:id/publish]

    - hu_id: "HU-011"
      metodo: GET
      ruta: /catalog/plans/:id
      proposito: >
        Detalle de un plan Publicado y no vencido (CA-011-2): name,
        description, startDate, endDate, estructura de fases/semanas/
        sesiones con SOLO la cantidad de ejercicios por sesion (no el
        detalle de cada ejercicio — no hay CA que lo pida), mas el perfil
        publico completo del entrenador (CoachProfileResponseDto: id, name,
        avatarUrl, description, bannerUrl — los dos ultimos con fallback
        null si el entrenador no tiene CoachRequest aprobada, ver decision
        D-2b). Un plan que no esta Publicado-y-vigente responde
        ENTITY_NOT_FOUND (404), igual que si no existiera — el atleta no
        debe poder distinguir "no existe" de "no esta publicado".
      response: PlanCatalogDetailResponseDto (200)
      errores: [401, 404]
      guards: [JwtAuthGuard]
      eventos: []
      dependencias: [GET /catalog/plans]

  orden_de_implementacion:
    - POST /plans
    - GET /plans
    - GET /plans/:id
    - PATCH /plans/:id
    - POST /plans/:id/phases
    - DELETE /plans/:id/phases/:phaseId
    - POST /plans/:id/phases/:phaseId/weeks
    - DELETE /plans/:id/weeks/:weekId
    - POST /plans/:id/weeks/:weekId/sessions
    - DELETE /plans/:id/sessions/:sessionId
    - POST /plans/:id/sessions/:sessionId/exercises  # activa isUsedInPlan real en exercises
    - DELETE /plans/:id/sessions/:sessionId/exercises/:sessionExerciseId
    - POST /plans/:id/publish
    - POST /plans/:id/unpublish
    - POST /plans/:id/archive
    - GET /catalog/plans
    - GET /catalog/plans/:id

  decisiones_arquitectonicas:
    - decision: >
        D-1. Transicion a Finalizado: evaluacion perezosa en cada lectura,
        NO job programado. Un helper puro `computeEffectiveStatus(plan)`
        (mismo patron que `toResponseDto` de ExercisesService) se aplica en
        TODA respuesta que expone el status de un plan (findOne, findAll,
        catalogo): si status persistido es PUBLISHED y endDate < now(),
        retorna FINALIZED sin tocar la base. Ademas, en los puntos de
        lectura donde el propio coach consulta su plan (GET /plans/:id,
        GET /plans), se hace un write-through oportunista y no bloqueante
        (fire-and-forget, mismo patron que AuditMiddleware): si se detecta
        la transicion, se persiste PUBLISHED→FINALIZED en background Y se
        emite plan.finalized en ese momento — es el unico punto discreto
        donde ese evento existe para emitirse. El catalogo (HU-011) NUNCA
        depende de esa persistencia: filtra siempre por
        `status=PUBLISHED AND endDate>=now()` a nivel de query, asi que
        CA-010-1 ("cualquier consulta... debe mostrarlo Finalizado") se
        cumple por construccion en el momento cero, sin esperar ningun
        proceso en segundo plano.
      justificacion: >
        El proyecto no tiene @nestjs/schedule ni ningun cron hoy — agregarlo
        solo para este caso es la complejidad que las rules piden evitar
        (ver "Patrones descartados" del skill design-patterns, mismo
        argumento de escala MVP). Un cron con granularidad suficiente para
        cumplir el "a partir de la fecha de fin, CUALQUIER consulta" del
        CA de forma literal tendria que correr con una frecuencia molesta
        (minutos) para una garantia que la evaluacion perezosa da gratis e
        instantanea. El write-through es solo una optimizacion de
        auto-sanacion para que la columna persistida no quede indefinidamente
        desactualizada y para tener un punto de emision del evento — no es
        la fuente de verdad, que siempre es el valor computado.

    - decision: >
        D-2. isUsedInPlan(exerciseId) en exercises.service.ts se reemplaza
        UNICAMENTE en su cuerpo por una consulta real contra SessionExercise
        via PrismaService: `this.prisma.sessionExercise.count({ where: {
        exerciseVersion: { exerciseId } } }) > 0`. exercises no importa
        PlansModule ni ningun service de plans.
      justificacion: >
        rulesCodigo prohibe que un modulo importe SERVICES de otro modulo;
        no prohibe que dos services lean tablas persistidas a traves del
        mismo PrismaService (@Global, ya compartido por diseño). Es
        exactamente el patron que EPICA-02 dejo preparado en el comentario
        del propio metodo stub.

    - decision: >
        D-2b. plans lee User y CoachRequest directamente via PrismaService
        para construir el perfil publico del entrenador (id/name/avatarUrl
        de User; description/bannerUrl desde CoachRequest.planDescription/
        bannerUrl filtrando status=APPROVED). NO se importa AuthModule ni
        AuthService — mismo razonamiento que D-2. Si el coach no tiene una
        CoachRequest en APPROVED, description y bannerUrl quedan null en
        CoachProfileResponseDto (campos opcionales) — el plan sigue
        visible en el catalogo, el perfil solo aparece incompleto.
      justificacion: >
        Resuelve el efecto de borde senalado por el humano sin bloquear la
        visibilidad del plan por un dato de otro modulo que puede no
        existir. Alternativa descartada: exigir CoachRequest aprobada como
        precondicion para publicar — ninguna RN/CA de esta epica lo pide, y
        lo habria inventado el Arquitecto sin mandato de negocio.

    - decision: >
        D-3. CreatePlanDto solo exige `name`. description, startDate y
        endDate son opcionales al crear; RN-01 y RN-02 (incluida la fecha
        de fin obligatoria) se validan integramente en publish(), nunca en
        create() ni en las rutas de estructura.
      justificacion: >
        CA-008-2 tolera un plan guardado sin estructura; RN-02 dice
        literalmente "obligatoria para PUBLICAR", no para crear. Tratar
        ambos requisitos (fechas y estructura) con la misma regla —
        obligatorios solo al publicar— es mas consistente que exigir
        fechas de entrada pero tolerar estructura vacia.

    - decision: >
        D-4. weekNumber es secuencial a lo largo de TODO el plan (no
        reinicia por fase), calculado en el service como
        (count de semanas del plan) + 1 dentro de una transaccion.
      justificacion: >
        EPICA-05 (WeekClosure, sensaciones semanales de HU-016, RN-09,
        RN-30, RN-33) necesita un numero de semana comparable y unico en
        todo el plan, no relativo a la fase. Nota para el DBA: para que
        una constraint de unicidad (`@@unique([planId, weekNumber])`) sea
        expresable sin recorrer la relacion Phase, se recomienda
        denormalizar `planId` directamente en el modelo Week ademas de
        `phaseId` — decision que corresponde al DBA, no se fuerza aqui.

    - decision: >
        D-5. order (en Phase y Session) se calcula server-side como el
        maximo order existente en el scope padre + 1. Los DTOs de creacion
        (AddPhaseDto, AddSessionDto) no reciben order del cliente.
      justificacion: >
        Ninguna CA pide reordenar fases o sesiones; forzar al cliente a
        calcular y enviar un order correcto es superficie de error sin
        beneficio funcional en el alcance de esta epica.

    - decision: >
        D-6. PATCH /plans/:id permite modificar name/description en
        cualquier estado. startDate/endDate solo se aceptan si el plan
        esta en Borrador — si se envian y el plan no esta en Borrador,
        rechaza con PLAN_IMMUTABLE (409).
      justificacion: >
        RN-31/CA-009-4 inmovilizan explicitamente "la duracion total
        (fechas)" y "la estructura de fases y semanas" al publicar. Las
        notas de HU-009 dejan expresamente fuera de alcance si otros campos
        (como name/description) siguen editables — la lectura mas estrecha
        y menos inventada es no restringirlos, ya que ninguna RN los
        menciona como inmutables.

    - decision: >
        D-7. Phase/Week/Session/SessionExercise se eliminan con hard-delete
        real (no soft-delete, no archivedAt) — la eliminacion solo procede
        mientras el plan esta en Borrador (PlanPublishedGuard), momento en
        el que ningun atleta ha tenido contacto con esa estructura todavia.
      justificacion: >
        El patron Soft-Delete del skill design-patterns nombra Plan,
        Subscription y SessionResult, no las entidades estructurales
        intermedias del plan. Una vez publicado el plan, esta estructura
        es inmutable (RN-31) y por tanto nunca vuelve a eliminarse — no hay
        ningun escenario donde una fase/semana/sesion "usada" deba
        conservarse borrada logicamente.

    - decision: >
        D-7b. Plan NO usa el campo generico `archivedAt` que el skill
        design-patterns sugiere para el patron Soft-Delete. El estado
        ARCHIVED ya es uno de los cuatro valores de PlanStatus (RN-27:
        "Los estados del plan son exactamente cuatro... No existen
        sub-estados adicionales"). Agregar archivedAt duplicaria esa
        semantica con dos fuentes de verdad para "esta archivado".
      justificacion: >
        Cierre de una inconsistencia entre el ejemplo generico del skill
        (escrito antes de que se confirmara la jerarquia Fase/Semana) y la
        restriccion explicita y posterior de RN-27. Se documenta aqui para
        que el Documentador y el Desarrollador no hereden el ejemplo del
        skill literalmente para Plan. Recomendado como ajuste futuro del
        skill fuera de esta epica.

    - decision: >
        D-7c. No se crea ninguna tabla de historial tipo `PlanHistory`
        (el ejemplo generico de nestjs-conventions/module-patterns.md la
        menciona de paso). El rastro de mutaciones HTTP ya lo cubre
        AuditLog via AuditMiddleware (EPICA-02); ninguna CA de esta epica
        pide un historial de transiciones de plan distinto de eso.
      justificacion: Evitar sobre-ingenieria — no crear una tabla sin un requisito que la respalde.

    - decision: >
        D-8. GET /plans/:id devuelve el arbol completo embebido (fases →
        semanas → sesiones → ejercicios de sesion) en una sola respuesta,
        en vez de un GET por nivel (GET .../phases, GET .../weeks, etc).
        Las mutaciones (POST/DELETE), en cambio, son granulares por nivel.
      justificacion: >
        Separar lectura (agregada) de escritura (incremental) da lo mejor
        de ambos: una UI de constructor de planes puede pedir el arbol
        completo una vez para renderizar el editor, y enviar cada cambio
        como una operacion incremental y auditable — sin necesitar 4 GETs
        adicionales que ninguna CA pide.

    - decision: >
        D-9. Convencion de rutas: el `:id` del plan siempre esta presente
        (es la clave para ownership y para PlanPublishedGuard). Para crear
        un sub-recurso se usa la ruta con el padre inmediato
        (`/plans/:id/phases/:phaseId/weeks`); para leer/eliminar un
        sub-recurso ya creado se usa la ruta plana con su propio id
        (`/plans/:id/weeks/:weekId`), sin arrastrar toda la cadena de
        ancestros.
      justificacion: >
        phaseId/weekId/sessionId son UUID globales y univocos — repetir
        toda la cadena de ancestros en cada DELETE no agrega seguridad
        (la ownership se resuelve siempre contra planId) y si agrega rutas
        de 6 segmentos dificiles de mantener.

    - decision: >
        D-10. /catalog/plans y /catalog/plans/:id viven en un controller
        separado (PlansCatalogController) del mismo modulo `plans`, en vez
        de bajo /plans junto con las rutas del entrenador.
      justificacion: >
        Evita la ambiguedad de ruteo de NestJS entre un segmento literal
        ("catalog") y un parametro (":id") si convivieran en el mismo
        prefijo, y separa limpiamente las dos audiencias (COACH que
        construye, cualquier usuario autenticado que explora) con guards
        distintos por controller en vez de por endpoint.

    - decision: >
        D-11. plans emite plan.published y plan.archived (y plan.finalized
        desde el path de auto-sanacion de D-1) al EventEmitter2, cumpliendo
        el catalogo de eventos del skill design-patterns. NO se implementa
        ningun listener en notifications en esta epica.
      justificacion: >
        Ninguna CA de HU-008 a HU-011 pide el envio de una notificacion.
        Emitir el evento sin consumidor es el mismo patron ya aceptado en
        el proyecto para dejar un punto de integracion preparado (como
        hasSubscribers/isUsedInPlan) — construir el listener ahora seria
        anticipar alcance de una funcionalidad no pedida.

    - decision: >
        D-12. Las rutas de PlansController (mutacion) exigen exactamente
        `@Roles(UserRole.COACH)`, sin ADMIN — a diferencia de
        ExercisesController, que si incluye ADMIN.
      justificacion: >
        Restriccion explicita del epica_input: "el documento fuente no le
        da al rol ADMIN ninguna funcion sobre planes". Replicar el patron
        de exercises (COACH + ADMIN) por habito habria sido un error de
        alcance no pedido.

  criterios_de_aceptacion_tecnicos:
    - "Cobertura de dominio (PlansService) >= 80% lineas/funciones/statements, >= 75% branches — medido por archivo (perFile: true)"
    - "Cobertura de adaptadores (PlansController, PlansCatalogController) >= 70%"
    - "exercises.service.spec.ts agrega un test que verifica que isUsedInPlan() consulta SessionExercise (mock de Prisma) y retorna true/false segun corresponda — cierra el gap declarado de CA-006-1 de EPICA-02"
    - "Todos los endpoints documentan sus respuestas de error con @ApiProblemResponse"
    - "publish() lanza PLAN_INCOMPLETE listando explicitamente los requisitos faltantes (name, fechas, fase/semana/sesion/ejercicio) — no un mensaje generico"
    - "Test unitario que verifica que archivar un plan Publicado-y-vencido (endDate pasada, status persistido aun PUBLISHED) procede sin error — valida que D-1 no acopla archive() a una coercion previa a FINALIZED"
    - "Test unitario de unpublish() mockeando hasSubscribers() en true y en false — ambas ramas cubiertas (gap e2e declarado y aceptado hasta EPICA-04)"
    - "Test e2e del catalogo que crea un plan Publicado con endDate en el pasado y verifica que NO aparece en GET /catalog/plans (valida el filtro por query, no solo el campo computado)"
    - "AddSessionExerciseDto rechaza con EXERCISE_INACTIVE (422) un ejercicio inhabilitado, y con ENTITY_NOT_FOUND (404) uno inexistente, sin crear el SessionExercise en ningun caso"

  riesgos_identificados:
    - >
        El skill design-patterns (SKILL.md §2 y behavior-patterns.md §1) y
        nestjs-conventions/module-patterns.md §6 fueron escritos ANTES de
        la decision confirmada de jerarquia Fase/Semana (2026-08-20): sus
        ejemplos muestran Plan.sessions directo (sin Phase/Week como
        entidades), un campo `archivedAt` en Plan y una tabla `planHistory`
        que este plan descarta explicitamente (D-1, D-7b, D-7c). El
        Desarrollador debe seguir ESTE plan, no los fragmentos de codigo
        de esos skills al pie de la letra. Se recomienda que, tras el
        CHECKPOINT 1, alguien actualice esos ejemplos para que EPICA-04/05
        no hereden el mismo desfase — fuera del alcance de este plan.
    - >
        La consulta de GET /plans/:id (arbol completo) hace un JOIN
        profundo de 4 niveles (Phase→Week→Session→SessionExercise, mas
        ExerciseVersion). Con `include` anidado de Prisma es una sola
        consulta, pero conviene que el Desarrollador mida el plan de
        ejecucion si el numero de fases/semanas/sesiones crece — no
        esperado como problema a la escala MVP (~23 usuarios) del
        proyecto, se documenta para no sorprender en EPICA-05.
    - >
        Ninguna HU/CA de esta epica define parametros de ejecucion del
        ejercicio dentro de una sesion del plan (series, repeticiones,
        descanso). SessionExercise queda deliberadamente minimo: id,
        sessionId, exerciseVersionId, order, createdAt. Si el negocio los
        requiere, es una decision de producto pendiente para una HU o
        epica futura — no se asume ni se inventa aqui.
    - >
        El write-through oportunista de D-1 (persistir FINALIZED al
        detectarlo en una lectura del propio coach) puede ejecutar una
        escritura de mas si dos requests concurrentes leen el mismo plan
        vencido antes de que la primera escritura complete. Es idempotente
        (la segunda escritura pone el mismo valor) y no bloqueante — no
        requiere lock ni transaccion adicional, pero se documenta para que
        QA no lo reporte como bug.
    - >
        La denormalizacion de planId en el modelo Week (recomendada en D-4
        para permitir `@@unique([planId, weekNumber])`) es una decision
        que corresponde al DBA en el siguiente paso del flujo, no a este
        plan — se deja registrada aqui para que no se pierda.
    - >
        CA-009-7 (rechazo de unpublish por suscriptores) no es verificable
        end-to-end en esta epica porque hasSubscribers() es un stub fijo
        en false — mismo gap ya aceptado por el humano para EPICA-04.
        Recordatorio explicito para que el QA lo declare en su reporte, no
        lo omita (mismo tratamiento que CA-006-1 de EPICA-02).
