    - "Test unitario (D-15) de plans.service.ts: publish() rechaza con PLAN_INCOMPLETE cuando un SessionExercise tiene sets sin reps (o viceversa) Y ni durationSeconds ni distanceMeters — caso de prescripcion NO significativa por ninguno de los dos conjuntos"
    - "Test unitario (D-15) de plans.service.ts: publish() ACEPTA un plan con un SessionExercise de regimen de fuerza (sets+reps, sin loadKg) y otro de regimen de resistencia (solo distanceMeters, sin durationSeconds) en la MISMA sesion — demuestra que la regla no exige los 5 campos ni el par completo de cada regimen"
    - "Test e2e (D-15) de PATCH /plans/:id/sessions/:sessionId/exercises/:sessionExerciseId: happy path (edita prescripcion parcial), 400 (validacion), 401 (sin autenticar), 409 (plan ya no en Borrador via PlanPublishedGuard)"
    - "Test/verificacion manual del DBA (D-15, punto 10): tras aplicar la migracion 1, ningun plan queda en status PUBLISHED con al menos un SessionExercise sin prescripcion significativa — query de verificacion post-migracion, no un test automatizado (es una migracion de datos, no codigo de aplicacion)"

  riesgos_identificados:
    - >
        El listener de subscription.activated puede fallar silenciosamente
        (try/catch obligatorio por rules) dejando a un atleta Activo sin
        instancia hasta que alguien (el o su entrenador) vuelva a consultarla
        — el self-heal de D-3 corrige el dato en cuanto eso pasa, pero si
        NADIE vuelve a consultar la instancia, el hueco persiste
        indefinidamente sin alertar a nadie. Aceptado explicitamente a
        escala MVP (~23 usuarios); si se observa en produccion, la siguiente
        iteracion razonable es un job de reconciliacion, NO agregado en este
        ciclo por ser infraestructura no solicitada por ninguna HU.
    - >
        La copia profunda (createInstanceFromSubscription) ejecuta un
        `$transaction` interactivo con un `create` por cada fase, semana,
        sesion y ejercicio de sesion (secuencial, no `createMany` por
        nivel). A la escala MVP y con la estructura minima que RN-01 exige
        (una fase, una semana, una sesion, un ejercicio) esto es
        instantaneo; si los planes reales crecen a docenas de sesiones, el
        numero de round-trips dentro de una sola transaccion podria volverse
        una fuente de locks prolongados. Optimizar a `createMany` por nivel
        exige generar los UUID de cada fila en el cliente ANTES del insert
        (Prisma no retorna ids de `createMany` en Postgres) — cambio de
        implementacion razonable si el rendimiento real lo justifica, no
        antes (evitar sobre-ingenieria para un tamaño de plan que hoy no
        existe).
    - >
        El skill design-patterns queda con DOS discrepancias nuevas
        introducidas por este plan, ademas de la ya documentada por
        EPICA-04 (Subscription Lifecycle de 5 estados): (1) §5 documenta un
        modelo `WeekClosure` separado que este plan NO usa (D-5); (2) §3/§4
        documentan `ResourcePolicyGuard`/`WeekFrozenGuard`/etc. como clases
        `CanActivate`, mientras que esta epica (siguiendo el patron
        REALMENTE implementado por EPICA-03/04) hace las verificaciones
        inline en el service (D-11). Ambas quedan fuera del alcance de este
        plan, recomendadas para `actualizar-docs` tras el CHECKPOINT.
    - >
        HU-023 CA-023-1 promete que el atleta "puede consultar su instancia
        inmediatamente despues" de la activacion. El self-heal de D-3
        garantiza esto FUNCIONALMENTE (nunca ve un error por instancia
        faltante mientras su suscripcion siga Activa) pero no es
        estrictamente "automatico sin que nadie note el retraso": si el
        listener aun no corrio, el PRIMER GET del atleta paga el costo
        completo de la copia profunda de forma sincrona (latencia mayor en
        ese request especifico, no en los siguientes). Aceptado como
        consecuencia directa de rechazar infraestructura de colas — el QA
        debe verificar que ese primer GET responde dentro de un tiempo
        razonable con el tamaño de plan minimo de RN-01, no que sea
        instantaneo bajo cualquier tamaño.
    - >
        ESTA EPICA REABRE DOS EPICAS CERRADAS Y TAGGEADAS EN EL MISMO CICLO
        — EPICA-03 (D-15, prescripcion) y EPICA-04 (D-14, consentimiento de
        salud). Precision sobre el alcance real de cada reapertura (el
        primer borrador de este riesgo, redactado por el team lead,
        hablaba de "dos migraciones" — verificado contra el diseño de
        ambas decisiones, es MAS PRECISO decir lo siguiente): EPICA-03
        exige UNA migracion real (5 columnas nullable en SessionExercise
        MAS un backfill de datos que revierte planes Publicados
        incompletos a Borrador, D-15 punto 10) y un cambio ADITIVO de
        contrato (campos nuevos, nada se renombra). EPICA-04 exige CERO
        migraciones (DocumentType.HEALTH_DATA_CONSENT ya existe en el enum
        desde EPICA-01, D-14) pero SI un cambio DE RUPTURA de contrato
        (AcceptConsentDto renombra `documentVersion` a
        `sportConsentDocumentVersion`). Ambas exigen su propio checkpoint y
        tag nuevos, y su propio export de OpenAPI — el Documentador debe
        producir CONTRATOS SEPARADOS para `plans`/`subscriptions` (contratos
        ya existentes, modificados) y para `execution` (contrato nuevo), y
        el humano debe aprobar los tres explicitamente en el CHECKPOINT,
        no asumir que aprobar el plan de EPICA-05 aprueba implicitamente
        los cambios en los otros dos modulos.
    - >
        PLAN_INCOMPLETE (422) ahora cubre DOS motivos de negocio distintos
        con el MISMO codigo de error (D-15): estructura incompleta
        (RN-01 original) y prescripcion no significativa (RN-01 extendida).
        No es un bug — es el mismo criterio ya usado en el catalogo para
        ENTITY_NOT_FOUND (un codigo, `detail`/`context` distinto por
        ocurrencia) — pero el QA debe verificar EXPLICITAMENTE los dos
        casos por separado en sus tests e2e de `publish()`, no asumir que
        un solo test de PLAN_INCOMPLETE cubre ambos.
    - >
        Unidad de `loadKg`/`distanceMeters` (D-6): ningun RN ni CA
        especifica la unidad de medida de la carga ni de la distancia —
        este plan asume kilogramos y metros por convencion (sistema
        metrico, contexto colombiano del proyecto), no por una regla
        confirmada explicitamente. Riesgo bajo (es una convencion, no una
        ambiguedad de negocio real — nadie en Colombia va a prescribir
        carga en libras), documentado por completitud; si se detecta
        necesidad de soportar unidades alternativas en el futuro, es un
        cambio de DTO (agregar un campo de unidad), no de estructura.
    - >
        Patron de proceso observado dos veces en esta misma epica (nota
        explicita del team lead, 2026-08-21): una decision del humano
        comunicada por mensaje (la escala 1-10 de sensaciones) no llego al
        artefacto (`outputs/epica_input.yaml`) hasta que el Analista la
        detecto al revisar el input — el mismo patron que perdio
        HEALTH_DATA_CONSENT entre EPICA-01 y EPICA-04 (D-14). No es un
        riesgo tecnico de este plan, pero se documenta aqui porque afecta
        directamente la fiabilidad de las enmiendas: este Arquitecto debe
        trabajar SIEMPRE contra `outputs/epica_input.yaml` releido, nunca
        contra el historial de mensajes del team lead como fuente de
        verdad — ya aplicado en esta v1.4 (epica_input releido completo
        antes de enmendar).
