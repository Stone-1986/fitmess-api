plan_de_implementacion:
  version: "1.0"
  epica_id: "EPICA-04"
  ciclo: 1

  modulos_afectados:
    - "subscriptions (modulo nuevo — src/modules/subscriptions/)"
    - "plans (hasSubscribers(planId) en plans.service.ts:1080 pasa a consultar Subscription real — unico cambio de cuerpo, sin tocar el resto de unpublish(); cierra el gap declarado de CA-009-7 de EPICA-03)"
    - "notifications (3 listeners nuevos: subscription.requested → coach, subscription.approved → atleta, subscription.rejected → atleta; 3 metodos nuevos en EmailService)"
    - "common (el catalogo de BusinessError ya trae SUBSCRIPTION_ALREADY_EXISTS y CONSENT_REQUIRED reservados desde su creacion — se usan tal cual; se agrega UNA entry nueva, PLAN_NOT_PUBLISHED, ver decision D-6, reutilizada ahora en DOS endpoints — ver decision D-10)"

  # ── RESUMEN (6 endpoints, 1 controller nuevo) ────────────────────────────
  #
  # SubscriptionsController (/subscriptions) — roles mixtos por endpoint
  # (a diferencia de PlansController/ExercisesController, que fijan el rol
  # a nivel de controller — ver decision D-1):
  #   1. POST /subscriptions                    — ATHLETE — solicitar inscripcion (HU-012)
  #   2. GET  /subscriptions                     — ATHLETE — listar mis suscripciones (HU-014)
  #   3. GET  /subscriptions/pending              — COACH   — panel de solicitudes pendientes (HU-013)
  #   4. POST /subscriptions/:id/approve          — COACH   — aprobar solicitud (HU-013)
  #   5. POST /subscriptions/:id/reject           — COACH   — rechazar solicitud (HU-013)
  #   6. POST /subscriptions/:id/accept-consent   — ATHLETE — aceptar consentimiento (HU-014, incluye CA-014-8)
  #
  # Cambio interno sin endpoint propio:
  #   - plans.service.ts: hasSubscribers(planId) deja de ser stub.

  endpoints:
    # ══════════════════════════════════════════════════════════════════════
    # HU-012 — Solicitud de inscripcion
    # ══════════════════════════════════════════════════════════════════════

    - hu_id: "HU-012"
      metodo: POST
      ruta: /subscriptions
      proposito: >
        Crear una suscripcion en estado Pendiente para el par (atleta
        autenticado, planId del body) — CA-012-1. Precondiciones
        verificadas en el service, en este orden: (1) el plan existe y su
        estado EFECTIVO (mismo `computeEffectiveStatus` de EPICA-03,
        reutilizado via PrismaService, NO importado de PlansService — ver
        decision D-2) es PUBLISHED, si no rechaza con PLAN_NOT_PUBLISHED
        (409, CA-012-4); (2) no existe ya una suscripcion propia a ese plan
        en estado Pendiente, Aprobada o Activa, si existe rechaza con
        SUBSCRIPTION_ALREADY_EXISTS (409, CA-012-2) — una suscripcion
        Rechazada previa NO bloquea (CA-012-3, nueva fila). El pre-check en
        service se complementa con el indice UNICO PARCIAL de base de datos
        (ver decision D-3) que cierra la ventana de carrera entre el
        SELECT y el INSERT. Emite subscription.requested. El check (1) usa
        el mismo helper privado `isPlanCurrentlyPublished()` que reutiliza
        POST /subscriptions/:id/accept-consent para CA-014-8 — ver D-10.
      request_body: CreateSubscriptionDto
      response: SubscriptionResponseDto (201)
      errores: [400, 401, 403, 404, 409]
      guards: [JwtAuthGuard, RolesGuard(ATHLETE)]
      eventos: [subscription.requested]
      dependencias: []

    - hu_id: "HU-014"
      metodo: GET
      ruta: /subscriptions
      proposito: >
        Listar TODAS las suscripciones propias del atleta autenticado, en
        cualquier estado, paginado — mismo criterio D-8 de EPICA-03 (GET
        /plans lista todos los estados sin filtro server-side; el filtrado
        por "requiere consentimiento" se hace en el cliente sobre
        status=Aprobada). Cubre CA-014-1 (ver el consentimiento pendiente)
        y CA-014-4 (un item independiente por cada plan, incluso de
        entrenadores distintos). No incluye contenido del documento de
        consentimiento — ver decision D-8.
      response: SubscriptionResponseDto[] + PaginationMeta (200)
      errores: [401, 403]
      guards: [JwtAuthGuard, RolesGuard(ATHLETE)]
      eventos: []
      dependencias: [POST /subscriptions]

    # ══════════════════════════════════════════════════════════════════════
    # HU-013 — Aprobacion / rechazo
    # ══════════════════════════════════════════════════════════════════════

    - hu_id: "HU-013"
      metodo: GET
      ruta: /subscriptions/pending
      proposito: >
        Panel de solicitudes pendientes del entrenador autenticado
        (CA-013-3): lista, paginada, las suscripciones en estado Pendiente
        de TODOS los planes propios del coach, filtrando por relacion
        (`where: { status: PENDING, plan: { coachId } }`, cubierto por el
        indice ya existente `Plan.@@index([coachId])` de EPICA-03 — sin
        indice adicional). Cada item incluye el nombre del atleta y el
        nombre del plan (join de solo lectura via PrismaService, NO
        importa AuthModule/PlansModule — mismo criterio D-2 de EPICA-03
        para lecturas cross-dominio). Ruta separada de GET /subscriptions
        (no un query param `?role=coach` sobre el mismo endpoint) porque la
        forma de la respuesta es distinta (resumen enriquecido vs
        SubscriptionResponseDto propio del atleta) — cada GET del proyecto
        retorna un unico tipo de respuesta fijo, sin ramificar por rol
        dentro del mismo handler (ver decision D-1).
      response: SubscriptionPendingSummaryResponseDto[] + PaginationMeta (200)
      errores: [401, 403]
      guards: [JwtAuthGuard, RolesGuard(COACH)]
      eventos: []
      dependencias: [POST /subscriptions]

    - hu_id: "HU-013"
      metodo: POST
      ruta: /subscriptions/:id/approve
      proposito: >
        Pendiente → Aprobada (CA-013-1). findOwnedByCoachOrFail carga la
        suscripcion con su plan y verifica plan.coachId === coach
        autenticado, si no rechaza con RESOURCE_OWNERSHIP_DENIED (403,
        CA-013-4). Si status !== PENDING rechaza con
        INVALID_STATE_TRANSITION (409, CA-013-6 — "ya fue resuelta", mismo
        codigo que usa el ciclo de vida de Plan en EPICA-03). Persiste
        reviewedAt=now() y reviewedBy=coachId. Emite subscription.approved
        — el listener de notifications avisa al atleta que debe aceptar el
        consentimiento (texto del CA-013-1); el listener de deep-copy hacia
        execution (catalogado en design-patterns skill §7) es alcance de
        EPICA-05, NO se implementa aqui. approve() NO verifica vigencia del
        plan (a diferencia de accept-consent, D-10): CA-013-1 no lo exige,
        y un plan que vence entre la aprobacion y el intento de aceptar el
        consentimiento es precisamente el escenario que CA-014-8 cubre en
        el otro extremo del flujo.
      response: SubscriptionResponseDto (200)
      errores: [401, 403, 404, 409]
      guards: [JwtAuthGuard, RolesGuard(COACH)]
      eventos: [subscription.approved]
      dependencias: [POST /subscriptions]

    - hu_id: "HU-013"
      metodo: POST
      ruta: /subscriptions/:id/reject
      proposito: >
        Pendiente → Rechazada (CA-013-2). Mismo mecanismo de ownership y de
        estado que approve (findOwnedByCoachOrFail, INVALID_STATE_TRANSITION
        si status !== PENDING). Sin motivo de rechazo en el body — a
        diferencia de CoachRequest (EPICA-01), ninguna CA de esta epica pide
        capturar una razon (ver decision D-4). Persiste reviewedAt/
        reviewedBy. La suscripcion Rechazada NUNCA se elimina (restriccion
        de la epica) y queda disponible para que el atleta vuelva a
        solicitar el mismo plan (CA-012-3). Emite subscription.rejected.
      response: SubscriptionResponseDto (200)
      errores: [401, 403, 404, 409]
      guards: [JwtAuthGuard, RolesGuard(COACH)]
      eventos: [subscription.rejected]
      dependencias: [POST /subscriptions]

    # ══════════════════════════════════════════════════════════════════════
    # HU-014 — Consentimiento informado deportivo
    # ══════════════════════════════════════════════════════════════════════

    - hu_id: "HU-014"
      metodo: POST
      ruta: /subscriptions/:id/accept-consent
      proposito: >
        Aprobada → Activa (CA-014-2). findOwnSubscriptionOrFail verifica
        que la suscripcion pertenece al atleta autenticado, si no rechaza
        con RESOURCE_OWNERSHIP_DENIED (403, CA-014-6). Si status !==
        APPROVED rechaza con INVALID_STATE_TRANSITION (409) — mismo
        tratamiento defensivo que CA-013-6, sin CA propia que lo exija mas
        alla de proteger la maquina de estados. Si status === APPROVED
        pero el plan referenciado ya NO esta vigente (CA-014-8: el
        entrenador lo archivo, o su fecha de fin ya paso y su estado
        EFECTIVO es Finalizado), rechaza con PLAN_NOT_PUBLISHED (409) SIN
        escribir nada — la suscripcion permanece en Aprobada, ninguna
        $transaction se abre. Este segundo check reutiliza el MISMO helper
        privado `isPlanCurrentlyPublished()` de SubscriptionsService que ya
        usa POST /subscriptions (ver D-2 y D-10) — NO puede leer la columna
        `plan.status` cruda: un plan con status persistido PUBLISHED cuya
        endDate ya paso esta efectivamente Finalizado
        (`computeEffectiveStatus` de plans.service.ts:1027), y el
        write-through que actualiza esa columna en la base de datos solo
        corre cuando el propio COACH lee su plan — exactamente el caso que
        CA-014-8 exige cubrir y que un chequeo ingenuo `plan.status !==
        PUBLISHED` dejaria pasar. Solo si AMBOS checks de estado pasan
        (subscripcion Aprobada Y plan vigente) procede la $transaction
        atomica (mismo patron que AuthService.registerAthlete de EPICA-01):
        crea LegalAcceptance(documentType=SPORT_CONSENT,
        planId=subscription.planId, userId=atleta, documentVersion del
        body, ip, userAgent) + Subscription.update(status=ACTIVE,
        activatedAt=now()). Emite subscription.activated (evento nuevo —
        ver decision D-7): sin listener en esta epica, queda disponible
        como punto de integracion para EPICA-05 (deep-copy de instancia /
        habilitacion de sesiones). El CONTENIDO del documento (texto,
        disclaimer de IA de CA-014-5) es responsabilidad del frontend con
        contenido versionado estatico — mismo precedente que habeas
        data/terminos de HU-003, ver decision D-8. Un planId huerfano ya no
        es posible: LegalAcceptance.planId pasa a tener FK real a Plan
        (decision D-5). No se agrega ningun estado nuevo a
        SubscriptionStatus para el caso CA-014-8 — la suscripcion queda en
        Aprobada como via muerta (decision confirmada por el humano, ver
        D-10).
      request_body: AcceptConsentDto
      response: SubscriptionResponseDto (200)
      errores: [400, 401, 403, 404, 409]
      guards: [JwtAuthGuard, RolesGuard(ATHLETE)]
      eventos: [subscription.activated]
      dependencias: [POST /subscriptions/:id/approve]

  orden_de_implementacion:
    - "Prisma: modelo Subscription + indice unico parcial + FK de LegalAcceptance.planId a Plan (DBA, ver decisiones D-3 y D-5 — bloquea todo lo siguiente)"
    - "plans.service.ts: hasSubscribers(planId) — reemplazo de cuerpo (solo depende del modelo Subscription, no de ningun endpoint de este modulo)"
    - POST /subscriptions
    - GET /subscriptions
    - GET /subscriptions/pending
    - POST /subscriptions/:id/approve
    - POST /subscriptions/:id/reject
    - POST /subscriptions/:id/accept-consent

  decisiones_arquitectonicas:
    - decision: >
        D-1. subscriptions es un modulo/controller separado de plans, con
        UN SOLO controller (SubscriptionsController, ruta base
        /subscriptions) cuyos 6 endpoints fijan el rol requerido POR
        METODO (@Roles a nivel de handler, no de clase) en vez de fijarlo a
        nivel de controller como hacen PlansController (COACH) y
        ExercisesController (COACH+ADMIN).
      justificacion: >
        Es el primer modulo de la epica donde el mismo recurso (Subscription)
        tiene operaciones exclusivas de ATHLETE (solicitar, listar propias,
        aceptar consentimiento) y otras exclusivas de COACH (listar
        pendientes, aprobar, rechazar) — fijar un rol a nivel de controller
        como en los modulos anteriores bloquearia la mitad de las rutas.
        RolesGuard ya soporta esto sin cambios: usa
        `reflector.getAllAndOverride(ROLES_KEY, [handler, class])`, que
        resuelve el metadato mas especifico (el del metodo) cuando existe.
        No requiere separar en dos controllers (uno por rol) porque, a
        diferencia de PlansController/PlansCatalogController en EPICA-03
        (decision D-10, separados por ambiguedad de RUTAS entre "catalog" y
        ":id"), aqui no hay colision de segmentos: /subscriptions,
        /subscriptions/pending y /subscriptions/:id/[accion] no compiten
        entre si.

    - decision: >
        D-2. subscriptions lee Plan/User/CoachRequest directamente via
        PrismaService (compartido, @Global) para: (a) verificar el estado
        efectivo del plan al solicitar inscripcion y al aceptar el
        consentimiento (CA-012-4 y CA-014-8, ver D-10), replicando la misma
        logica `computeEffectiveStatus` de PlansService (PUBLISHED con
        endDate vencida se trata como no-publicable); y (b) resolver
        athleteName/planName en el panel de pendientes (HU-013). NO importa
        PlansModule, PlansService, AuthModule ni AuthService. DENTRO de
        subscriptions.service.ts, esa logica de estado efectivo vive en UN
        SOLO metodo privado (`isPlanCurrentlyPublished(plan)`), invocado
        tanto por create() como por acceptConsent() — evita duplicarla dos
        veces dentro del mismo archivo; lo que SI se duplica, a proposito,
        es entre este metodo y `computeEffectiveStatus` de PlansService
        (dos modulos distintos).
      justificacion: >
        Mismo precedente ya aceptado en EPICA-03 (D-2, D-2b): rulesCodigo
        prohibe importar SERVICES de otro modulo, no prohibe que dos
        services lean las mismas tablas a traves del PrismaService
        compartido. La duplicacion CROSS-MODULO de la logica de estado
        efectivo se mantiene intencional (no se extrae a un helper
        compartido en `common`): es una funcion pura de pocas lineas, y
        extraerla para dos consumidores en dos modulos distintos seria
        sobre-ingenieria frente al costo real de mantenerla sincronizada
        manualmente (bajo — el criterio de RN-27/D-1 de EPICA-03 es
        estable). Si una tercera epica la necesita, ese es el momento de
        mover la logica a `common/utils`. La duplicacion INTERNA dentro de
        subscriptions.service.ts, en cambio, no tiene la misma
        justificacion — ahi un solo metodo privado reutilizado es simplemente
        no repetir codigo dentro del mismo archivo, sin relacion con la
        regla de modulos.

    - decision: >
        D-3 (resuelve el PENDIENTE del Arquitecto sobre unicidad).
        Subscription NO lleva `@@unique([athleteId, planId])`. La
        exclusividad de CA-012-2/CA-012-3 se implementa con un INDICE UNICO
        PARCIAL de PostgreSQL:
        `CREATE UNIQUE INDEX subscriptions_athlete_plan_active_key ON
        subscriptions (athlete_id, plan_id) WHERE status IN ('PENDING',
        'APPROVED', 'ACTIVE');` — agregado a mano por el humano en la
        migracion, exactamente el mismo workflow ya documentado y probado
        en este schema para `exercises_name_lower_active_key` (EPICA-02):
        `prisma migrate dev --create-only`, editar el .sql generado,
        aplicar. El pre-check en SubscriptionsService.create() (buscar una
        suscripcion propia en esos tres estados antes del INSERT) sigue
        siendo necesario para devolver SUBSCRIPTION_ALREADY_EXISTS con un
        mensaje claro en el caso comun; el indice parcial es la salvaguarda
        de base de datos contra la ventana de carrera entre ese SELECT y el
        INSERT (dos solicitudes concurrentes del mismo atleta al mismo
        plan). Una fila Rechazada NUNCA colisiona con el indice —
        exactamente lo que CA-012-3 exige.
      justificacion: >
        El supuesto confirmado por el humano es explicito: un
        `@@unique([athleteId, planId])` simple es incorrecto porque el par
        puede repetirse legitimamente tras un rechazo. La alternativa de
        "no declarar ninguna unicidad en base de datos, resolver todo en el
        service" fue descartada: dejaria una ventana de carrera real (dos
        POST /subscriptions concurrentes del mismo atleta al mismo plan
        crearian dos filas Pendientes) sin ninguna proteccion mas alla de
        la disciplina del service — un nivel de garantia inferior al que
        EPICA-02 ya establecio como el estandar del proyecto para este
        mismo tipo de problema (unicidad condicionada a un subconjunto de
        estados). No se propone una libreria ni un patron nuevo: es el
        mismo patron, reutilizado.

    - decision: >
        D-4. POST /subscriptions/:id/reject no recibe ningun campo en el
        body (sin `rejectionReason`).
      justificacion: >
        A diferencia de CoachRequest.rejectionReason (EPICA-01), ninguna
        CA de HU-013 pide capturar ni mostrar un motivo de rechazo —
        agregarlo seria inventar alcance no pedido por el documento fuente.
        Si el negocio lo requiere en el futuro, es un campo opcional que se
        agrega sin romper el contrato (no bloquea evolucion).

    - decision: >
        D-5 (resuelve el PENDIENTE del Arquitecto/DBA sobre
        LegalAcceptance.planId). Se agrega la relacion real:
        `plan Plan? @relation(fields: [planId], references: [id], onDelete:
        Restrict)` en LegalAcceptance, y el lado inverso
        `legalAcceptances LegalAcceptance[]` en Plan. El campo sigue siendo
        opcional (`planId String?`) porque HABEAS_DATA y TERMS_OF_SERVICE
        de EPICA-01 se registran sin plan asociado — solo SPORT_CONSENT lo
        usa. onDelete: Restrict, no Cascade ni SetNull: un registro legal
        append-only jamas debe poder quedar huerfano de forma silenciosa
        (mismo criterio que Plan.coach ya usa frente a User, y que RN-13
        exige para todo registro con valor de trazabilidad legal — Ley
        527/1999). En la practica esto es una salvaguarda que hoy nunca se
        activa: no existe ningun endpoint que borre un Plan.
      justificacion: >
        El propio epica_input lo senala: "sin FK, un planId invalido entra
        sin error". Con la relacion declarada, Prisma/Postgres rechaza en
        el INSERT cualquier planId que no exista como Plan real —
        cerrando el hueco a nivel de base de datos en vez de confiar
        unicamente en que el service siempre pase un planId valido (que
        hoy es cierto porque el unico llamador es
        accept-consent(subscription.planId), pero la garantia de esquema
        es mas fuerte que la disciplina del codigo).

    - decision: >
        D-6. Se agrega UNA entry nueva a BusinessError (seccion "Planes",
        junto a PLAN_INCOMPLETE/PLAN_HAS_SUBSCRIBERS/PLAN_IMMUTABLE):
        `PLAN_NOT_PUBLISHED` — httpStatus 409 CONFLICT, title "El plan no
        esta vigente" (titulo generico y estable, reutilizable en distintos
        contextos — ver D-10). El "detail" (especifico por ocurrencia, no
        el titulo) varia segun quien lo lanza: POST /subscriptions dice
        "no acepta nuevas inscripciones en su estado actual" (CA-012-4);
        POST /subscriptions/:id/accept-consent dice que el plan "ya no esta
        vigente" y que la suscripcion permanece en Aprobada (CA-014-8).
        SUBSCRIPTION_ALREADY_EXISTS y CONSENT_REQUIRED, ya reservados en el
        catalogo desde su creacion, se usan sin modificacion (el primero en
        HU-012 CA-012-2; CONSENT_REQUIRED queda reservado para EPICA-05,
        ver decision D-9).
      justificacion: >
        409 y no 422: el propio comentario del catalogo fija el criterio
        ("409 para CONFLICTOS DE ESTADO del recurso") y PlanStatus es
        exactamente eso, una maquina de estados explicita (a diferencia de
        Exercise.isActive, que es un flag simple y por eso EXERCISE_INACTIVE
        usa 422) — INVALID_STATE_TRANSITION/PLAN_IMMUTABLE/
        PLAN_HAS_SUBSCRIBERS, los tres errores de estado de Plan que ya
        existen, usan 409 por el mismo motivo. Se rechazo reutilizar
        INVALID_STATE_TRANSITION: ese codigo describe una transicion
        fallida DEL PROPIO recurso mutado por el endpoint (el plan, en
        publish/unpublish de EPICA-03); aqui el recurso mutado es la
        Subscription, y el plan es solo una precondicion referenciada — la
        misma distincion que ya separa EXERCISE_INACTIVE de
        INVALID_STATE_TRANSITION en el catalogo actual. El titulo se
        generaliza (en vez de fijarlo a "no acepta nuevas inscripciones")
        porque, tras agregarse CA-014-8, el mismo error describe DOS
        situaciones de negocio distintas (bloquear una inscripcion nueva;
        bloquear la activacion de una ya aprobada) que comparten la MISMA
        causa raiz (el plan dejo de estar efectivamente Publicado) — mismo
        criterio que ya usa el catalogo para ENTITY_NOT_FOUND, reutilizado
        con un "detail" distinto por cada entidad/contexto sin crear un
        codigo nuevo por cada uno.

    - decision: >
        D-7. Se agregan DOS eventos nuevos al catalogo del skill
        design-patterns (§7), que hoy solo documenta `subscription.
        requested`, `subscription.approved` y `subscription.cancelled`:
        `subscription.rejected` (emisor subscriptions, listener
        notifications → CA-013-2) y `subscription.activated` (emisor
        subscriptions, sin listener en esta epica — punto de integracion
        para EPICA-05). `subscription.cancelled` no se usa: ninguna HU de
        esta epica modela una cancelacion posterior a Activa.
      justificacion: >
        CA-013-2 exige notificar el rechazo al atleta, igual que CA-013-1
        exige notificarle la aprobacion — omitir subscription.rejected
        habria dejado la mitad del flujo de HU-013 sin evento pese a tener
        el mismo requisito de notificacion que la mitad ya cubierta.
        subscription.activated se emite por el mismo criterio ya aceptado
        en D-11 de EPICA-03 (dejar un punto de integracion emitido sin
        forzar su consumidor): es la transicion que de verdad habilita al
        atleta a iniciar sesiones (RN-20), un hito mas preciso para que
        EPICA-05 dispare su deep-copy que `subscription.approved` (que el
        skill design-patterns cataloga hoy como el trigger de "execution
        (deep copy)", pero en Aprobada el atleta TODAVIA no puede iniciar
        nada sin el consentimiento — y con CA-014-8, ni siquiera esta
        garantizado que llegue a poder hacerlo). Se documenta como
        discrepancia a corregir en el skill (fuera del alcance de este
        plan, ver riesgos).

    - decision: >
        D-8. El CONTENIDO del documento de consentimiento informado
        deportivo (el texto que el atleta lee, incluido el disclaimer de
        IA de CA-014-5) NO se sirve desde ningun endpoint de este modulo.
        El backend solo persiste la ACEPTACION (documentType, documentVersion,
        planId, ip, userAgent, acceptedAt) via LegalAcceptance — el mismo
        alcance que ya tiene HABEAS_DATA/TERMS_OF_SERVICE en HU-003: el
        frontend posee y versiona el texto (contenido estatico), y el
        atleta envia la version que esta aceptando en el momento de llamar
        al endpoint.
      justificacion: >
        EPICA-01 (HU-003) establecio este limite de alcance para habeas
        data y terminos, y ningun CA de esta epica pide lo contrario para
        el consentimiento deportivo — es el mismo mecanismo de
        trazabilidad legal, aplicado al mismo patron de responsabilidad.
        Crear un endpoint `GET /legal-documents/sport-consent` seria
        alcance no pedido e inconsistente con lo ya construido para los
        otros dos documentos.

    - decision: >
        D-9 (resuelve el PENDIENTE del Arquitecto sobre CA-014-3). CA-014-3
        ("el atleta no puede acceder a las sesiones del plan sin aceptar el
        consentimiento") se REFORMULA como regla de negocio obligatoria
        para EPICA-05, NO se implementa como endpoint ni como stub en esta
        epica. A diferencia de hasSubscribers (que EPICA-03 dejo como un
        metodo privado real, con un llamador real en unpublish(), solo con
        el cuerpo incompleto), CA-014-3 no tiene ningun endpoint propio de
        EPICA-04 al que adjuntarse: las "sesiones del plan" que menciona
        son endpoints de EPICA-05 que todavia no existen. Fabricar un
        metodo sin llamador seria codigo muerto, no un gap declarado
        equivalente. En su lugar: (a) `BusinessError.CONSENT_REQUIRED`
        (422, ya reservado en el catalogo) queda formalmente asignado a
        este uso futuro; (b) EPICA-05 debe verificar, en el/los endpoint(s)
        que den acceso a sesiones de un plan, que exista una Subscription
        del atleta para ese plan con status=ACTIVE, y rechazar con
        CONSENT_REQUIRED si no la hay.
      justificacion: >
        El propio PENDIENTE lo planteaba como disyuntiva entre reformular
        o dejar un gap tipo hasSubscribers — se elige reformular porque la
        analogia con hasSubscribers no aplica tecnicamente (ese si tenia
        un endpoint y un llamador reales en esta misma epica). Dejar
        constancia explicita en este plan, con el codigo de error ya
        decidido, evita que EPICA-05 tenga que redescubrir la regla o
        inventar un error nuevo para el mismo caso.

    - decision: >
        D-10 (enmienda — CA-014-8, agregado por el Analista de Producto y
        confirmado por el humano tras el cierre inicial de este plan).
        POST /subscriptions/:id/accept-consent agrega un SEGUNDO chequeo de
        precondicion, ademas de status===APPROVED: el plan referenciado
        debe estar EFECTIVAMENTE vigente en el momento de aceptar, es
        decir `plan.status === PUBLISHED AND (plan.endDate === null OR
        plan.endDate >= now())` — la MISMA condicion, calculada por el
        MISMO helper privado `isPlanCurrentlyPublished()`, que ya usa POST
        /subscriptions para CA-012-4 (ver D-2). Si el plan esta Archivado,
        o su status persistido sigue en PUBLISHED pero su endDate ya paso
        (efectivamente Finalizado por `computeEffectiveStatus` de
        plans.service.ts:1027, sin que el write-through oportunista de
        `applyEffectiveStatusWriteThrough` haya corrido todavia — eso solo
        pasa cuando el COACH, no el atleta, lee su plan), rechaza con
        PLAN_NOT_PUBLISHED (409, D-6) y la suscripcion permanece en
        Aprobada SIN transicionar nunca a Activa: no se abre ninguna
        $transaction, no se escribe LegalAcceptance, no se emite
        subscription.activated. No se agrega ningun valor nuevo a
        SubscriptionStatus para representar este bloqueo (decision
        confirmada por el humano) — Aprobada es, a proposito, una via
        muerta valida del enum de 4 estados. Dos decisiones cerradas por el
        humano que este plan NO reabre: archive() sigue sin gate de
        suscriptores (asimetrico con unpublish() a proposito: unpublish
        devuelve el plan a Borrador editable bajo atletas inscritos,
        archive es terminal); y CA-014-3/D-9 sigue intacta, sin relacion
        con este cambio (CA-014-3 bloquea el ACCESO a sesiones en EPICA-05;
        CA-014-8 bloquea el ACTO de aceptar el consentimiento, en esta
        epica).
      justificacion: >
        La sutileza que motiva el CA es tecnica, no solo funcional: un
        chequeo ingenuo `plan.status !== PUBLISHED` sobre la columna cruda
        NO detecta el caso que el CA busca cubrir (un plan que vencio por
        el simple paso del tiempo, sin que nadie lo haya tocado desde que
        goteo su endDate) — exactamente el mismo problema de fuente de
        verdad que D-1 de EPICA-03 ya resolvio para el catalogo (HU-011),
        ahora replicado en subscriptions porque D-2 prohibe importar
        PlansService para reutilizar `computeEffectiveStatus` directamente.
        Reutilizar el error PLAN_NOT_PUBLISHED (en vez de crear uno nuevo
        tipo PLAN_EXPIRED) evita una entry redundante en el catalogo para
        la misma causa raiz (ver D-6 actualizada); reutilizar el mismo
        helper interno (en vez de reimplementar el calculo en
        acceptConsent()) evita que las dos verificaciones del mismo modulo
        diverjan con el tiempo.

  criterios_de_aceptacion_tecnicos:
    - "Cobertura de dominio (SubscriptionsService) >= 80% lineas/funciones/statements, >= 75% branches — medido por archivo (perFile: true)"
    - "Cobertura de adaptadores (SubscriptionsController) >= 70%"
    - "SubscriptionsService usa unicamente BusinessException/BusinessError y TechnicalException/TechnicalError — nunca excepciones HTTP nativas de NestJS"
    - "subscriptions NO importa PlansService, PlansModule, AuthService ni AuthModule — solo PrismaService (compartido) y EventEmitter2"
    - "Todos los endpoints documentan sus respuestas de error con @ApiProblemResponse"
    - "Test unitario que verifica que hasSubscribers(planId) en PlansService consulta Subscription con status IN [APPROVED, ACTIVE] y excluye PENDING — cierra el gap declarado de CA-009-7 de EPICA-03"
    - "Test e2e nuevo sobre unpublish(): publicar un plan, aprobar una suscripcion (status APPROVED) y verificar que POST /plans/:id/unpublish responde 409 PLAN_HAS_SUBSCRIBERS — CA-009-7 pasa de gap declarado a verificable end-to-end"
    - "Test unitario/e2e que verifica que una suscripcion Rechazada NO bloquea una nueva solicitud al mismo plan (CA-012-3), y que una Pendiente/Aprobada/Activa SI la bloquea (CA-012-2)"
    - "Test unitario de accept-consent que verifica la $transaction atomica: si el update de Subscription falla, el create de LegalAcceptance tambien se revierte (o viceversa) — ninguna escritura parcial"
    - "Test e2e que verifica que POST /subscriptions con un planId de un plan en Borrador responde 409 PLAN_NOT_PUBLISHED, sin crear ninguna fila"
    - "Test unitario/e2e de accept-consent con una suscripcion Aprobada cuyo plan esta Archivado (status persistido ARCHIVED): responde 409 PLAN_NOT_PUBLISHED; la suscripcion permanece en Aprobada; no se crea LegalAcceptance (CA-014-8, caso 1 de 2)"
    - "Test unitario CRITICO de accept-consent (CA-014-8, caso 2 de 2 — el que un chequeo ingenuo dejaria pasar): plan con status PERSISTIDO todavia en PUBLISHED pero endDate en el pasado, SIN que ningun GET de coach haya disparado el write-through de applyEffectiveStatusWriteThrough. Debe responder 409 PLAN_NOT_PUBLISHED igual que el caso Archivado — demuestra que isPlanCurrentlyPublished() evalua el estado EFECTIVO (status + endDate), nunca la columna status en crudo"
    - "Test unitario que verifica que POST /subscriptions con un plan PUBLISHED persistido pero con endDate vencida (mismo caso critico que el anterior) tambien responde 409 PLAN_NOT_PUBLISHED — confirma que isPlanCurrentlyPublished() se aplica igual en create() y en acceptConsent(), sin divergencia entre los dos call-sites"
    - "Test que verifica que el email de notificacion de subscription.requested/approved/rejected no incluye datos sensibles de salud ni el body completo del request en el log del listener (Ley 1273/2009)"

  riesgos_identificados:
    - >
        El indice unico parcial de D-3 depende de un paso manual del humano
        en la migracion (editar el .sql generado por `prisma migrate dev
        --create-only`), igual que el de Exercise.name en EPICA-02. Si se
        omite, el pre-check del service sigue funcionando para el caso
        comun pero la ventana de carrera entre dos solicitudes concurrentes
        del mismo atleta al mismo plan queda abierta — el QA no puede
        detectar esto con un test secuencial, debe verificarse revisando
        el archivo de migracion generado, no solo el comportamiento
        funcional.
    - >
        El skill design-patterns (SKILL.md §2) documenta un Subscription
        Lifecycle de CINCO estados (PENDING → APPROVED → CONSENT_PENDING →
        ACTIVE, mas REJECTED), con un estado intermedio `CONSENT_PENDING`
        que NO existe en el enum `SubscriptionStatus` del schema real
        (PENDING/APPROVED/REJECTED/ACTIVE, cuatro valores) ni en la
        decision confirmada por el humano (2026-08-20: "no se agrega
        ningun valor al enum"). Este plan sigue el schema real y la
        decision confirmada, NO el diagrama del skill — el diagrama queda
        desactualizado y debe corregirse (fuera del alcance de este plan,
        recomendado para `actualizar-docs` tras el CHECKPOINT).
    - >
        subscription.activated (D-7) se emite sin listener en esta epica.
        Si EPICA-05 finalmente decide disparar su deep-copy desde
        subscription.approved en vez de subscription.activated (revirtiendo
        la recomendacion de D-7), un atleta Aprobado-pero-sin-consentimiento
        tendria una instancia de ejecucion creada sin poder usarla todavia
        — no es un bug de esta epica, pero es una decision que EPICA-05
        debe tomar con conocimiento de esta secuencia, no heredar el
        listener del catalogo del skill sin revisarla.
    - >
        CA-014-3 (decision D-9) no es verificable end-to-end en esta epica
        porque no existe ningun endpoint de sesiones contra el cual
        probarlo — a diferencia de CA-009-7 (que esta epica SI cierra), este
        gap se traslada integramente a EPICA-05. El QA debe declararlo
        explicitamente en su reporte como alcance diferido, no como
        pendiente de esta epica.
    - >
        CA-014-8 (D-10) es EXACTAMENTE el tipo de caso que un desarrollo
        apurado implementa mal sin que ningun test lo note: un chequeo
        `plan.status !== PUBLISHED` compila, pasa lint, y pasa un test que
        solo prueba el plan Archivado — pero deja pasar el caso del plan
        vencido-por-tiempo mientras nadie (ningun coach) haya vuelto a leer
        ese plan desde que goteo su endDate, que es precisamente el
        escenario que motivo el CA. El QA debe verificar EXPLICITAMENTE
        que existan los DOS casos de test listados en
        criterios_de_aceptacion_tecnicos (Archivado y PUBLISHED-vencido-sin
        -write-through) — uno solo no es suficiente evidencia de que
        CA-014-8 esta bien resuelto.
    - >
        GET /subscriptions/pending resuelve athleteName/planName con un
        `include` sobre las relaciones `athlete` y `plan` en la misma
        query paginada. A la escala MVP (~23 usuarios) no representa un
        riesgo de rendimiento, pero si el numero de solicitudes pendientes
        por entrenador crece de forma importante, revisar si conviene un
        `select` explicito en vez de `include` completo del User (evitar
        traer passwordHash u otros campos sensibles innecesarios en el
        objeto intermedio, aunque el mapeo a
        SubscriptionPendingSummaryResponseDto los descarte antes de
        responder).
    - >
        Los tres listeners nuevos de notifications (subscription.requested/
        approved/rejected) envian correos con el nombre del atleta y/o del
        plan — datos personales, aunque no de salud. Revisar contra el
        skill legal-guardrails durante la implementacion que el contenido
        del correo y los logs del listener seleccionen solo IDs para
        logging (mismo patron que AdminInvitationCreatedListener, que
        loggea invitationId pero nunca email), nunca el nombre completo ni
        el email en el log de error.
