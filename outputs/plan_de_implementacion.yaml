plan_de_implementacion:
  version: "1.0"
  epica_id: "EPICA-09"
  ciclo: 1

  modulos_afectados:
    - auth (nuevos endpoints HU-002 y HU-003 + script seed HU-001)
    - notifications (tarea tecnica transversal — EmailService con Resend)

  # ── Nota sobre HU-001 ───────────────────────────────────────────────────────
  # HU-001 (seed) NO genera endpoints HTTP. Se implementa como script
  # prisma/seed.ts invocado con `prisma db seed`. No hay controller ni service
  # nuevo — el script instancia PrismaClient directamente (contexto standalone,
  # no NestJS runtime). Los criterios de aceptacion se validan manualmente.
  # El script se registra en package.json bajo prisma.seed.
  # ──────────────────────────────────────────────────────────────────────────────

  endpoints:

    # ── HU-002: Crear invitacion de administrador ──────────────────────────────
    - hu_id: "HU-002"
      metodo: POST
      ruta: /admin-invitations
      proposito: >
        Crea una AdminInvitation en base de datos con token unico (generado con
        randomBytes(32), almacenado hasheado con sha256) y expiracion configurable
        via ADMIN_INVITE_EXPIRATION_HOURS (default 48h). Verifica previamente que
        no exista un User con ese email y que no exista una invitacion activa
        (no expirada, no utilizada) para ese email. Emite admin.invitation.created
        con el token RAW para que el listener de notifications construya y envie
        el correo al invitado. Requiere rol ADMIN autenticado.
      request_body: CreateAdminInvitationDto
      response: AdminInvitationResponseDto (201)
      errores:
        - 400  # Validacion: email invalido o campo faltante
        - 401  # No autenticado — token JWT ausente o invalido
        - 403  # Rol insuficiente — no es ADMIN
        - 409  # Ya existe un User con ese email O ya existe AdminInvitation activa para ese email
      guards:
        - JwtAuthGuard
        - RolesGuard(ADMIN)
      eventos:
        - admin.invitation.created
      dependencias: []

    # ── HU-003: Consultar estado de invitacion por token ──────────────────────
    - hu_id: "HU-003"
      metodo: POST
      ruta: /admin-invitations/verify
      proposito: >
        Permite al frontend verificar si un token de invitacion es valido y vigente
        antes de mostrar el formulario de registro al invitado. El token se recibe
        en el body (no en URL) para evitar exposicion en access logs del servidor,
        historial del navegador y headers Referer — consistente con la decision
        arquitectonica de POST /auth/admin/register y con OWASP. El service hashea
        el token RAW con sha256 y busca por tokenHash. Endpoint publico — no requiere
        JWT. Retorna informacion basica de la invitacion (email del invitado, estado
        derivado) sin exponer el tokenHash ni datos del admin invitante. Patron
        consistente con OAuth 2.0 Token Introspection (RFC 7662).
      request_body: VerifyAdminInvitationDto
      response: AdminInvitationStatusResponseDto (200)
      errores:
        - 400  # Validacion: token faltante o formato invalido (ValidationPipe + VerifyAdminInvitationDto)
        - 404  # Token no encontrado (inexistente o adulterado — mismo error, anti-enumeracion)
        - 409  # Invitacion ya utilizada (tokenUsedAt != null)
        - 422  # Invitacion expirada (expiresAt < now())
      guards: []
      eventos: []
      dependencias:
        - POST /admin-invitations

    # ── HU-003: Registro de administrador via token de invitacion ─────────────
    - hu_id: "HU-003"
      metodo: POST
      ruta: /auth/admin/register
      proposito: >
        Endpoint publico (sin JWT). Crea User con role ADMIN usando un token de
        invitacion valido y vigente. En una $transaction atomica: valida el token
        (hash + expiracion + uso), crea User (ADMIN), registra
        LegalAcceptance(HABEAS_DATA) + LegalAcceptance(TERMS_OF_SERVICE), y marca
        la AdminInvitation como utilizada (tokenUsedAt = now()). Emite user.registered
        despues del commit. El admin creado inicia sesion con el flujo estandar
        POST /auth/login.
      request_body: RegisterAdminDto
      response: AdminRegistrationResponseDto (201)
      errores:
        - 400  # Validacion de campos personales (nombre, email, password, etc.) o legales
        - 404  # Token de invitacion no encontrado
        - 409  # Email o identificationNumber ya registrados en la plataforma (mensaje neutro)
        - 422  # Token expirado o ya utilizado
      guards: []
      eventos:
        - user.registered
      dependencias:
        - POST /admin-invitations
        - POST /admin-invitations/verify

  orden_de_implementacion:
    - "1. [TAREA TECNICA] Crear src/modules/notifications/ con EmailService (Resend) + NotificationsModule"
    - "2. [SCHEMA] Agregar modelo AdminInvitation a prisma/schema.prisma + migracion"
    - "3. [SEED HU-001] Crear prisma/seed.ts — logica idempotente del primer admin"
    - "4. [CATALOGO] Agregar admin.invitation.created al catalogo de eventos en design-patterns §7"
    - "5. POST /admin-invitations (HU-002)"
    - "6. POST /admin-invitations/verify (HU-003)"
    - "7. POST /auth/admin/register (HU-003)"

  decisiones_arquitectonicas:

    - decision: >
        Nuevo modelo AdminInvitation en Prisma:
        id (uuid @id @default(uuid())), email (String), tokenHash (String @unique),
        invitedBy (String @map("invited_by")), expiresAt (DateTime @map("expires_at")),
        tokenUsedAt (DateTime? @map("token_used_at")), createdAt (DateTime @default(now())
        @map("created_at")). Sin updatedAt por semantica append-only. Sin enum de estado
        persistido — el estado es derivado en el service: USED si tokenUsedAt != null,
        EXPIRED si expiresAt < now(), ACTIVE en caso contrario.
      justificacion: >
        La epica especifica en HU-002 notas: "Se necesita un nuevo modelo AdminInvitation".
        Estado derivado evita inconsistencias entre un campo de estado almacenado y las
        fechas reales. El tokenHash sigue el patron ya establecido por RefreshToken en el
        codebase. Sin enum de estado porque el estado no se persiste — se calcula.

    - decision: >
        Nuevo servicio AdminInvitationsService en src/modules/auth/admin-invitations.service.ts
        y nuevo controller AdminInvitationsController en
        src/modules/auth/admin-invitations.controller.ts. Ambos registrados en AuthModule
        existente (no se crea un modulo nuevo).
      justificacion: >
        La escala de la epica (1-3 admins, 2 endpoints HTTP) no justifica un modulo nuevo.
        AuthModule ya maneja el ciclo de vida de usuarios y contiene los guards, strategies
        y DTOs relevantes. Patron consistente con CoachRequestsController/CoachRequestsService
        que ya viven en AuthModule. Un modulo nuevo solo implicaria exports/imports sin valor.

    - decision: >
        La logica de validacion del token (hash + busqueda + verificacion de expiracion y uso)
        vive en AdminInvitationsService, no en AuthService. El metodo registerAdmin de
        AuthService recibe el email validado y el adminInvitationId para marcar la invitacion
        como usada dentro de la misma $transaction.
      justificacion: >
        Separacion de responsabilidades. AuthService ya tiene registerAthlete y registerCoach.
        Agregar la logica de tokens lo sobrecarga y acopla dos responsabilidades distintas.
        AdminInvitationsService encapsula la logica de tokens para poder reutilizarla desde
        POST /admin-invitations/verify sin duplicar codigo.

    - decision: >
        POST /admin-invitations/verify recibe el token en el body (VerifyAdminInvitationDto),
        no como path param. Devuelve 404 para tokens inexistentes Y para tokens cuyo hash no
        coincide (adulterados). El 422 aplica solo para token valido pero expirado. El 409
        aplica para token valido pero ya utilizado.
      justificacion: >
        Correccion de seguridad: el endpoint original era POST /admin-invitations/verify, pero
        el token en URL aparece en access logs del servidor, historial del navegador y headers
        Referer. Se aplica el mismo criterio de seguridad que POST /auth/admin/register
        (decision #5). El patron POST para verificacion de tokens es consistente con
        OAuth 2.0 Token Introspection (RFC 7662). Anti-enumeracion (Ley 1273/2009): el 404
        no revela si un token existio. El 422 y 409 son estados distintos que el frontend
        necesita para mensajes especificos al usuario.

    - decision: >
        POST /auth/admin/register recibe el invitationToken en el body (campo String en
        RegisterAdminDto), no como path param ni como header Authorization.
      justificacion: >
        Un token en path param aparece en logs de acceso del servidor (access logs de nginx,
        load balancers, etc.), exponiendo el token RAW. En body, el AuditInterceptor nunca
        loggea el body completo en produccion (rules: solo en debug en dev). Consistente con
        el patron de registro existente (todo via body).

    - decision: >
        admin.invitation.created es emitido por AdminInvitationsService. El listener
        AdminInvitationCreatedListener vive en src/modules/notifications/listeners/.
        El listener construye el enlace de registro con el token RAW del evento y llama
        a EmailService.sendAdminInvitation(). Los errores de envio se capturan en try/catch
        del listener y se loggean sin propagar. El token RAW nunca se loggea.
      justificacion: >
        Restriccion explicita de la epica: "Los errores de envio nunca interrumpen el flujo
        de negocio principal." El patron de listener con try/catch ya esta establecido en el
        codebase (nestjs-conventions §7). Comunicacion entre modulos exclusivamente via
        eventos (@nestjs/event-emitter) — las rules prohiben imports directos entre modulos
        de dominio.

    - decision: >
        El script prisma/seed.ts accede a PrismaClient directamente (standalone, sin
        levantar el runtime NestJS). Lee credenciales desde process.env. Si
        ADMIN_SEED_EMAIL o ADMIN_SEED_PASSWORD no estan definidas, el seed imprime
        un mensaje informativo y termina con exit(0) sin error. Si el email ya existe
        en User, el seed se omite (idempotencia). Si la password no cumple requisitos
        (minimo 8 chars, al menos una letra y un numero), termina con exit(1) y mensaje
        descriptivo. La password se hashea con bcrypt 10 rondas.
      justificacion: >
        El comando `prisma db seed` usa scripts standalone por convencion de Prisma.
        No tiene sentido levantar NestJS para un seed. La idempotencia protege contra
        ejecuciones repetidas en CI/CD. Variables de entorno alineadas con la restriccion
        de la epica: "credenciales del seed provienen exclusivamente de variables de
        entorno, nunca hardcodeadas."

    - decision: >
        Dos nuevos BusinessError se agregan al catalogo business-error.enum.ts:
        INVITATION_EXPIRED (422 UNPROCESSABLE_ENTITY, title: "La invitacion ha expirado")
        e INVITATION_ALREADY_USED (409 CONFLICT, title: "La invitacion ya fue utilizada").
      justificacion: >
        Las rules prohiben crear clases de excepcion por modulo — el catalogo centralizado
        en business-error.enum.ts es la unica fuente de verdad. Estos dos errores son
        semanticamente distintos de los existentes INVALID_STATE_TRANSITION y DUPLICATE_ENTITY.
        El frontend necesita distinguirlos para mostrar mensajes de accion especificos al usuario.

    - decision: >
        AdminRegistrationResponseDto es un nuevo DTO que incluye: id, name, email, role.
        No reutiliza AthleteRegistrationResponseDto aunque la estructura sea similar.
      justificacion: >
        Los DTOs de respuesta son contratos de API. Compartir un DTO entre contextos distintos
        acopla sus evoluciones futuras. El admin puede requerir campos distintos en iteraciones
        futuras sin afectar el contrato del registro de atleta.

    - decision: >
        RegisterAdminDto replica los campos de datos personales y legales de RegisterAthleteDto:
        name, email, password, phone, phoneCountryCode, identificationType,
        identificationNumber, acceptsTermsOfService, termsDocumentVersion,
        acceptsHabeasData, personalDataDocumentVersion. Agrega el campo
        invitationToken (String). dateOfBirth y avatarUrl son opcionales igual que en atleta.
      justificacion: >
        La restriccion de la epica: "El registro requiere los mismos datos personales que
        cualquier usuario de la plataforma" y "La creacion de cuentas admin tambien debe
        registrar aceptaciones legales" (Ley 1581/2012). La re-creacion del DTO (en lugar de
        herencia) evita acoplamiento y es explicita sobre el contrato del endpoint.

    - decision: >
        CreateAdminInvitationDto contiene solo el campo email (String, @IsEmail).
        AdminInvitationResponseDto contiene: id, email, expiresAt, createdAt.
        NO expone tokenHash ni invitedBy. AdminInvitationStatusResponseDto contiene:
        email, status (string derivado: ACTIVE | EXPIRED | USED), expiresAt.
      justificacion: >
        Rules: NUNCA exponer campos internos en DTOs de respuesta. tokenHash es un campo
        interno de seguridad. invitedBy es un UUID de admin que no tiene valor para el
        invitado. El status derivado permite al frontend tomar decisiones sin calcular fechas.

  criterios_de_aceptacion_tecnicos:
    - "Cobertura de dominio (AdminInvitationsService, metodo registerAdmin en AuthService) >= 80%"
    - "Cobertura de adaptadores (AdminInvitationsController, endpoint POST /auth/admin/register en AuthController) >= 70%"
    - "Todos los endpoints documentan errores con @ApiProblemResponse segun tabla de errores del plan"
    - "POST /auth/admin/register usa security: [] en @ApiOperation (endpoint publico — Spectral)"
    - "POST /admin-invitations/verify usa security: [] en @ApiOperation (endpoint publico — Spectral)"
    - "El token RAW nunca aparece en logs — tests verifican que el logger no recibe el token (Ley 1273/2009)"
    - "La password del admin nunca aparece en logs — tests verifican ausencia en llamadas al logger"
    - "La $transaction de POST /auth/admin/register cubre: User.create + LegalAcceptance.create (x2) + AdminInvitation.update(tokenUsedAt)"
    - "El seed prisma/seed.ts es idempotente: ejecutarlo dos veces con el mismo email no lanza error ni crea duplicados"
    - "El seed termina con exit(0) y mensaje informativo si ADMIN_SEED_EMAIL o ADMIN_SEED_PASSWORD no estan definidas"
    - "El seed termina con exit(1) y mensaje descriptivo si la password no cumple los requisitos de seguridad"
    - "Variables nuevas documentadas en .env.example: ADMIN_SEED_EMAIL, ADMIN_SEED_NAME, ADMIN_SEED_PASSWORD, ADMIN_INVITE_EXPIRATION_HOURS"
    - "BusinessError.INVITATION_EXPIRED e INVITATION_ALREADY_USED agregados a business-error.enum.ts"
    - "EmailService captura excepciones internamente — el listener nunca propaga errores al pipeline HTTP"
    - "El listener de admin.invitation.created NO loggea el token RAW del evento"
    - "pnpm run build pasa sin errores — gate duro"
    - "npx tsc --noEmit pasa sin errores — gate duro"

  riesgos_identificados:

    - riesgo: >
        El seed accede a PrismaClient standalone sin el adapter pg configurado en NestJS
        (prisma.config.ts usa @prisma/adapter-pg). La conexion directa de PrismaClient
        funciona con DATABASE_URL pero puede no usar pooling. En produccion con Supabase
        esto puede generar conexiones directas en exceso.
      mitigacion: >
        Usar la conexion directa de Prisma Client (sin adapter) solo en el seed — es una
        operacion de setup puntual, no recurrente. Documentar en comentario del script.
        No es un problema de correctitud, solo de performance en setup inicial.
      nivel: LOW

    - riesgo: >
        El EmailService usa Resend (dependencia de red externa). En tests unitarios del
        listener, si Resend no esta mockeado, los tests realizaran llamadas reales y
        fallaran en CI sin RESEND_API_KEY configurada.
      mitigacion: >
        Mockear el cliente Resend en todos los tests del listener y del EmailService.
        El contrato del listener (captura errores, no propaga) debe tener test explicito
        que verifique que un error de Resend no lanza excepcion al caller.
      nivel: LOW

    - riesgo: >
        Ley 1581/2012: la creacion del admin via POST /auth/admin/register recolecta
        datos personales. RegisterAdminDto debe incluir los checkboxes de aceptacion
        legal identicos a RegisterAthleteDto. Si el frontend no envIA estos campos,
        el registro falla con 400 por validacion. Riesgo de que el frontend asuma que
        el admin no necesita aceptaciones legales.
      mitigacion: >
        Documentar explicitamente en los decoradores @ApiProperty del RegisterAdminDto
        que los campos legales son obligatorios. Incluir en los criterios de aceptacion
        del Documentador que el contrato OpenAPI muestre estos campos como required.
        El $transaction rechaza si los campos legales no se registran.
      nivel: MEDIUM

    - riesgo: >
        La verificacion de invitacion activa en POST /admin-invitations requiere una
        query con condicion compuesta: email = X AND tokenUsedAt IS NULL AND expiresAt > now().
        Esta query no tiene indice compuesto en el schema propuesto. Con escala 1-3 admins
        el impacto es nulo, pero si se reutiliza el modelo para otros flujos de invitacion
        en el futuro, puede requerir indexacion.
      mitigacion: >
        Agregar @@index([email]) en AdminInvitation. Escala actual (1-3 admins) hace el
        riesgo irrelevante en produccion. Documentar para evaluacion futura.
      nivel: LOW

    - riesgo: >
        El modulo notifications no existe en el codebase. Crearlo como tarea tecnica
        previa introduce una dependencia de implementacion que bloquea HU-002. Si la
        tarea tecnica no esta completada, el listener de admin.invitation.created no existe
        y el correo de invitacion no se envia (la invitacion se crea en DB pero el invitado
        no recibe el enlace).
      mitigacion: >
        El orden de implementacion documenta explicitamente la tarea tecnica como paso 1.
        El Desarrollador debe completar EmailService + NotificationsModule antes de
        implementar POST /admin-invitations. El evento se emite independientemente del
        listener — si el listener no existe, el evento se emite sin efecto (no bloquea).
        Esto es un riesgo funcional (el invitado no recibe el correo), no tecnico.
      nivel: MEDIUM
