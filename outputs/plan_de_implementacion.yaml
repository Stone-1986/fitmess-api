plan_de_implementacion:
  version: "1.0"
  epica_id: "EPICA-02"
  ciclo: 1

  modulos_afectados:
    - exercises (modulo nuevo — no existe hoy en src/modules/)

  endpoints:

    # ── HU-005: Crear ejercicio en la biblioteca global ────────────────────────
    - hu_id: "HU-005"
      metodo: POST
      ruta: /exercises
      proposito: >
        Crea un Exercise y su primera ExerciseVersion (versionNumber = 1) en una
        sola $transaction atomica — un Exercise sin ninguna version es un estado
        invalido del dominio. Verifica previamente que no exista otro ejercicio
        ACTIVO con el mismo name (comparacion case-insensitive, con trim() antes
        de comparar y de persistir) y rechaza con DUPLICATE_ENTITY si lo hay
        (CA-005-2). Un name que solo existe en ejercicios inhabilitados NO
        bloquea la creacion — CA-005-6 confirma explicitamente que crear con el
        name de uno inhabilitado procede con exito. isActive queda en true por
        defecto (default del schema). Accesible para COACH y ADMIN (RN-22);
        ATHLETE no accede a la gestion del catalogo.
      request_body: CreateExerciseDto
      response: ExerciseResponseDto (201)
      errores:
        - 400  # Validacion: name/description/muscleGroup vacios o exceden longitud
        - 401  # No autenticado
        - 403  # Rol insuficiente — no es COACH ni ADMIN
        - 409  # DUPLICATE_ENTITY — ya existe un ejercicio ACTIVO con ese name (CA-005-2)
      guards:
        - JwtAuthGuard
        - RolesGuard(COACH, ADMIN)
      eventos: []
      dependencias: []

    # ── HU-005 (CA-005-3) + HU-007 (CA-007-2): Listado del catalogo ────────────
    - hu_id: "HU-005"
      metodo: GET
      ruta: /exercises
      proposito: >
        Lista el catalogo global de ejercicios con su version vigente embebida
        (name, description, muscleGroup, versionNumber de la ExerciseVersion de
        mayor versionNumber). Por defecto filtra isActive = true — los
        inhabilitados no aparecen (CA-007-2). Acepta includeInactive=true como
        query param para que un COACH/ADMIN audite el catalogo completo desde el
        listado ("por defecto" en CA-007-2 implica una via no-default; no hay
        endpoint de reactivacion, asi que esta es la unica forma de ver
        inhabilitados en bloque). Paginado con page/limit — la biblioteca es
        global y crece sin techo. Con includeInactive=true el listado puede
        mostrar dos filas con el mismo name (una activa, una inhabilitada) —
        ver riesgo LOW documentado sobre unicidad solo-entre-activos.
      request_body: null
      response: "{ data: ExerciseSummaryResponseDto[], meta: PaginationMeta } (200)"
      errores:
        - 400  # Validacion de query params (page/limit fuera de rango, tipo invalido)
        - 401  # No autenticado
        - 403  # Rol insuficiente — no es COACH ni ADMIN
      guards:
        - JwtAuthGuard
        - RolesGuard(COACH, ADMIN)
      eventos: []
      dependencias:
        - POST /exercises

    # ── HU-006 (CA-006-2) + HU-007 (CA-007-3): Detalle con historial ───────────
    - hu_id: "HU-006"
      metodo: GET
      ruta: /exercises/:id
      proposito: >
        Retorna el detalle de un ejercicio: sus datos vigentes (name, isActive,
        description/muscleGroup/versionNumber de la version de mayor
        versionNumber) mas el historial completo de versiones (versionNumber +
        createdAt de cada una — CA-006-2). No filtra por isActive: un ejercicio
        inhabilitado se lee igual, junto con su estado inactivo, para que un plan
        historico pueda mostrarlo indicando que ya no esta activo en la
        biblioteca (CA-007-3). El historial va embebido en este endpoint, no en
        uno propio: es un arreglo acotado (una entrada nueva solo se agrega
        cuando se edita un ejercicio ya usado en un plan) que no justifica
        paginacion ni ruta separada.
      request_body: null
      response: ExerciseDetailResponseDto (200)
      errores:
        - 401  # No autenticado
        - 403  # Rol insuficiente — no es COACH ni ADMIN
        - 404  # ENTITY_NOT_FOUND — el ejercicio no existe
      guards:
        - JwtAuthGuard
        - RolesGuard(COACH, ADMIN)
      eventos: []
      dependencias:
        - POST /exercises

    # ── HU-006: Modificar ejercicio (versiona segun uso) ───────────────────────
    - hu_id: "HU-006"
      metodo: PATCH
      ruta: /exercises/:id
      proposito: >
        Actualiza un ejercicio existente. Orden de validaciones en update(): (1)
        findOrFail — 404 si no existe (CA-006-4); (2) si isActive = false,
        rechaza inmediatamente con EXERCISE_INACTIVE sin crear version nueva ni
        alterar la vigente (CA-006-6) — esta verificacion va ANTES de
        isUsedInPlan() para no gastar esa consulta en un camino que de todos
        modos va a rechazar; (3) solo si el ejercicio esta activo, procede con
        la logica de actualizacion. name es identidad del catalogo y vive en
        Exercise (no versionado): si se envia, se actualiza directamente sobre
        Exercise, con el mismo chequeo de unicidad que la creacion — case-
        insensitive, con trim(), y comparando SOLO contra otros ejercicios
        ACTIVOS excluyendo el propio (como en create(), un name que solo existe
        en un ejercicio inhabilitado no bloquea el rename) — rechazando con
        DUPLICATE_ENTITY si colisiona. Como el paso (2) ya garantiza que solo
        ejercicios activos llegan aqui, el propio ejercicio editado siempre
        cuenta como activo en esa comparacion. description/muscleGroup son el
        contenido de entrenamiento (RN-05) y viven en ExerciseVersion: la
        decision entre editar en el lugar o crear una version nueva depende de
        isUsedInPlan(exerciseId) — metodo privado del service que HOY siempre
        retorna false (ver decision de aislamiento). Si el metodo retorna true:
        crea ExerciseVersion nueva con versionNumber = version_actual + 1
        (CA-006-1). Si retorna false: hace update() in-place sobre la
        ExerciseVersion vigente (CA-006-3).
      request_body: UpdateExerciseDto
      response: ExerciseResponseDto (200)
      errores:
        - 400  # Validacion: campos exceden longitud o formato invalido
        - 401  # No autenticado
        - 403  # Rol insuficiente — no es COACH ni ADMIN
        - 404  # ENTITY_NOT_FOUND (CA-006-4)
        - 409  # DUPLICATE_ENTITY — el nuevo name colisiona con otro ejercicio ACTIVO
        - 422  # EXERCISE_INACTIVE — el ejercicio ya esta inhabilitado (CA-006-6)
      guards:
        - JwtAuthGuard
        - RolesGuard(COACH, ADMIN)
      eventos: []
      dependencias:
        - POST /exercises

    # ── HU-007: Inhabilitar ejercicio ───────────────────────────────────────────
    - hu_id: "HU-007"
      metodo: DELETE
      ruta: /exercises/:id
      proposito: >
        Inhabilita un ejercicio (isActive = false). Sigue el patron de soft-delete
        del proyecto (DELETE → actualizacion de un flag, nunca borrado fisico),
        aunque el campo interno sea isActive y no archivedAt (convencion propia
        de ejercicios, ver skill design-patterns §5). La operacion SIEMPRE
        procede, este o no el ejercicio en uso — NUNCA se verifica ni se bloquea
        por EXERCISE_IN_USE (CA-007-1, decision del humano 2026-08-05). Las
        versiones y el ejercicio no se tocan; solo isActive cambia, por lo que
        los planes existentes conservan intacta la version que ya referenciaban
        (RN-07). Al pasar a isActive=false, el name del ejercicio queda
        disponible para que otro ejercicio nuevo o renombrado lo use (CA-005-6),
        porque la unicidad de name aplica solo entre activos. Si el ejercicio ya
        estaba inhabilitado, rechaza con EXERCISE_INACTIVE (CA-007-4).
      request_body: null
      response: "{ data: null, message: string } (200)"
      errores:
        - 401  # No autenticado
        - 403  # Rol insuficiente — no es COACH ni ADMIN
        - 404  # ENTITY_NOT_FOUND — el ejercicio no existe
        - 422  # EXERCISE_INACTIVE — el ejercicio ya estaba inhabilitado (CA-007-4)
      guards:
        - JwtAuthGuard
        - RolesGuard(COACH, ADMIN)
      eventos: []
      dependencias:
        - POST /exercises

  orden_de_implementacion:
    - "1. [SCHEMA] Agregar modelos Exercise y ExerciseVersion a prisma/schema.prisma (ver decision de schema) — el DBA finaliza tipos, nullability e indices en su fase"
    - "2. POST /exercises (HU-005, incluye unicidad solo-entre-activos CA-005-2/CA-005-6)"
    - "3. GET /exercises (HU-005 CA-005-3, HU-007 CA-007-2)"
    - "4. GET /exercises/:id (HU-006 CA-006-2, HU-007 CA-007-3)"
    - "5. PATCH /exercises/:id (HU-006, incluye bloqueo CA-006-6 y unicidad solo-entre-activos en el rename)"
    - "6. DELETE /exercises/:id (HU-007)"
    - "7. [E2E] test/exercises.e2e-spec.ts: los dos tests de comportamiento del indice parcial (unicidad y parcialidad) descritos en criterios_de_aceptacion_tecnicos"

  decisiones_arquitectonicas:

    - decision: >
        Schema de referencia para el DBA: Exercise (id, name String @unique
        consideracion-abajo, isActive Boolean @default(true), createdAt,
        updatedAt) y ExerciseVersion (id, exerciseId, versionNumber Int,
        description String, muscleGroup String, createdAt, @@unique([exerciseId,
        versionNumber])). Exactamente el modelo prescrito en design-patterns
        §1/data-patterns.md seccion 1, sin campos adicionales — name vive en
        Exercise (no versionado), description y muscleGroup viven en
        ExerciseVersion (versionado). Señalado para el DBA: description figura
        como String? (nullable) en el patron de referencia, pero CA-005-1 exige
        el campo en toda creacion — el DBA debe decidir si lo deja NOT NULL dado
        que el flujo de creacion siempre lo completa. La anotacion "name String
        @unique" del patron de referencia YA NO aplica literal: ver decision
        sobre unicidad solo-entre-activos, que requiere un indice parcial, no
        un @unique simple de Prisma.
      justificacion: >
        La epica es explicita: "El skill design-patterns prescribe... el modelo
        Exercise + ExerciseVersion... es el punto de partida esperado, no una
        sugerencia." No hay ninguna decision del humano que lo reabra en cuanto
        a los campos; si en cuanto a como se expresa la unicidad de name.

    - decision: >
        La unicidad de name aplica UNICAMENTE entre ejercicios ACTIVOS
        (isActive = true), no contra la biblioteca completa. La verificacion en
        create() y en el rename de update() filtra where: { name: { equals:
        nombreNormalizado, mode: 'insensitive' }, isActive: true } (mas
        exclusion del propio id en update()). Un name que solo existe en
        ejercicios inhabilitados NO bloquea la creacion ni el rename
        (CA-005-6). El valor de name se normaliza con trim() antes de comparar
        y antes de persistir, para que "Sentadilla " y "Sentadilla" no se
        traten como distintos.
      justificacion: >
        Hallazgo del Analista sobre la version anterior de este plan: con
        CA-006-6 bloqueando la edicion de un ejercicio inhabilitado, y sin
        reactivacion definida en esta epica, un name de un ejercicio
        inhabilitado quedaba reservado para siempre — un entrenador que
        inhabilitara "Sentadilla" por error perdia ese nombre de forma
        permanente y no podia recrearlo. Decision del humano: CA-005-2 se
        reescribio para exigir la comparacion solo contra activos, y CA-005-6
        (nuevo) confirma explicitamente que la creacion con el name de un
        inhabilitado procede con exito.

    - decision: >
        La verificacion "¿este ejercicio ya fue usado en un plan?" se aisla en
        un metodo privado ExercisesService.isUsedInPlan(exerciseId: string):
        Promise<boolean>, invocado unicamente desde update(). Hoy retorna
        siempre false — comentario en el codigo debe explicar que EPICA-03 debe
        reemplazar el cuerpo del metodo por una query real (ej.
        this.prisma.planExercise.count({ where: { exerciseVersion: { exerciseId }
        } }) > 0, o el nombre de tabla que defina el DBA de EPICA-03) sin tocar
        ninguna otra linea de update(). Las dos ramas (true/false) se cubren
        mockeando este metodo en tests unitarios de update(), no con fixtures
        de planes reales.
      justificacion: >
        Decision del humano del 2026-08-05: la epica se implementa completa
        aislando el punto de integracion futuro detras de un unico metodo. Evita
        que EPICA-03 tenga que tocar la logica de ramificacion de update(), solo
        el cuerpo de un metodo.

    - decision: >
        PATCH /exercises/:id rechaza con EXERCISE_INACTIVE (422) si el
        ejercicio tiene isActive = false, sin crear version nueva ni alterar la
        vigente (CA-006-6). Esta verificacion es el primer paso de update()
        despues de findOrFail() — se ejecuta ANTES de invocar isUsedInPlan(),
        para no pagar el costo de esa consulta (hoy trivial, pero sera una
        query real desde EPICA-03) en un camino que de todos modos termina en
        rechazo. Usa el mismo guard/patron ya establecido en deactivate() para
        CA-007-4, reutilizando la misma entrada del catalogo de errores.
      justificacion: >
        Decision del humano del 2026-08-05 (CA-006-6 agregado a la epica): un
        ejercicio retirado del catalogo no debe seguir mutandose. Como esta
        epica no define reactivacion, en la practica el ejercicio queda
        congelado tras inhabilitarse — coherente con RN-06. Cierra el riesgo
        MEDIUM que este plan tenia abierto en su version anterior. La perdida
        permanente del name que esto hubiera causado se resuelve por separado
        con la decision de unicidad solo-entre-activos.

    - decision: >
        La version vigente de un ejercicio se obtiene por versionNumber
        descendente (Prisma include: { versions: { orderBy: { versionNumber:
        'desc' }, take: 1 } }), tanto en el listado (GET /exercises) como en el
        detalle y en las respuestas de create/update/deactivate. NO se agrega un
        puntero denormalizado (ej. currentVersionId) en Exercise.
      justificacion: >
        El patron de referencia (ya corregido) elimina explicitamente la
        referencia a un campo currentVersionId inexistente. Mantener un puntero
        denormalizado exige una escritura adicional sincronizada en cada
        append() y un vector de inconsistencia si algun flujo futuro crea una
        version sin actualizar el puntero. El costo de la alternativa (JOIN con
        ORDER BY + LIMIT 1 por ejercicio) es trivial con el indice unico
        @@unique([exerciseId, versionNumber]) ya definido, e incluso en el
        listado paginado Prisma resuelve el include con take:1 en una sola
        consulta por relacion, no N+1. A la escala esperada (biblioteca global
        de una plataforma, no millones de filas) esto no es un cuello de
        botella; si el DBA mide lo contrario en produccion, es una decision de
        el, no de este plan.

    - decision: >
        GET /exercises no usa POST /search como coach-requests (que tiene
        filtros avanzados combinables). Usa GET con query params: page, limit
        (mismos defaults que el resto del proyecto: page=1, limit=20 min1
        max100) e includeInactive (boolean, default false). No se agrega
        filtro por texto libre (name) ni por muscleGroup: ninguna CA de esta
        epica lo pide, y agregarlo seria alcance no solicitado.
      justificacion: >
        La tabla de convenciones de naming del skill api-first define GET
        /[recursos] para "Listar" sin filtros complejos — el listado del
        catalogo es una consulta simple con paginacion, no una busqueda
        multi-criterio que amerite un body. includeInactive resuelve
        literalmente la palabra "por defecto" de CA-007-2: sin un modo
        no-default, esa frase de la HU no tendria contraparte, y como no existe
        reactivacion, esta es la unica via para que un COACH/ADMIN vea
        inhabilitados en bloque (no solo por id directo, que ya cubre
        CA-007-3).

    - decision: >
        El historial de versiones de CA-006-2 se expone embebido en
        ExerciseDetailResponseDto (GET /exercises/:id), no en un endpoint propio
        (ej. GET /exercises/:id/versions).
      justificacion: >
        El volumen de versiones por ejercicio es acotado por diseno: una entrada
        nueva solo se crea cuando se edita un ejercicio ya usado en un plan
        (evento infrecuente, no un log de auditoria de crecimiento continuo). No
        justifica paginacion propia ni una ruta de sub-recurso. El "supuesto" de
        la epica ya define el contenido exacto (versionNumber + fecha de
        creacion), consistente con un array embebido.

    - decision: >
        DELETE /exercises/:id inhabilita el ejercicio y retorna { data: null,
        message: string }, igual que el patron establecido para archive() de
        Plan en data-patterns.md seccion 2, aunque el campo interno sea
        isActive (Boolean) en vez de archivedAt (DateTime).
      justificacion: >
        El skill design-patterns es explicito en que isActive es la convencion
        de naming propia de ejercicios dentro del mismo patron de "no
        eliminar, solo marcar" (seccion 5: "Convencion: usar archivedAt...
        Para ejercicios, usar isActive"). La forma de respuesta se mantiene
        igual para no introducir un contrato distinto para el mismo tipo de
        operacion (retirar un recurso del catalogo activo sin borrarlo).

    - decision: >
        Los 5 endpoints usan uniformemente JwtAuthGuard + RolesGuard(COACH,
        ADMIN). Ningun endpoint de esta epica admite ATHLETE.
      justificacion: >
        La restriccion de la epica dice "El atleta no accede a la gestion del
        catalogo" para create/update/deactivate. Ninguna CA de HU-005/006/007
        ejercita el acceso de ATHLETE al listado o detalle tampoco (CA-005-3
        habla de "cualquier entrenador"). El acceso de ATHLETE al catalogo de
        ejercicios (vía planes) es contenido de EPICA-03, no de esta epica —
        abrir GET /exercises a ATHLETE aqui seria construir contra un
        requisito no especificado.

    - decision: >
        No se emite ningun evento (@nestjs/event-emitter) en esta epica.
      justificacion: >
        El catalogo de eventos (design-patterns §7) no tiene listeners
        definidos para acciones sobre ejercicios, y ninguna HU de esta epica
        pide notificar a otro modulo. Emitir un evento sin consumidor conocido
        seria especular sobre un contrato futuro. Si una iteracion posterior lo
        requiere (ej. notifications avisando a coaches de un nuevo ejercicio),
        se agrega sin romper los endpoints ya definidos.

    - decision: >
        No se agregan entradas nuevas al catalogo de BusinessError. Se
        reutilizan ENTITY_NOT_FOUND (404), DUPLICATE_ENTITY (409),
        EXERCISE_INACTIVE (422), todas ya existentes.
      justificacion: >
        La epica confirma que EXERCISE_INACTIVE y EXERCISE_IN_USE ya fueron
        agregadas de forma anticipada al catalogo. EXERCISE_IN_USE
        explicitamente NO se usa en esta epica (CA-007-1 y decision del humano
        2026-08-05 lo prohiben). No hay ningun error de esta epica que no
        encaje en una entrada existente.

    - decision: >
        La verificacion de name duplicado usa comparacion case-insensitive con
        trim() (Prisma where: { name: { equals: nombreNormalizado, mode:
        'insensitive' }, isActive: true }) tanto en create() como en el rename
        de update(). Ademas, el catch de la escritura debe capturar el codigo
        de error P2002 (violacion de constraint unico) de Prisma y traducirlo a
        BusinessException(BusinessError.DUPLICATE_ENTITY) como red de
        seguridad ante condiciones de carrera.
      justificacion: >
        El check-then-insert sin transaccion serializable tiene una ventana de
        carrera entre dos requests concurrentes con el mismo name. Capturar
        P2002 como fallback evita que una condicion de carrera se traduzca en
        un TechnicalException/500 en vez de un 409 de negocio claro. El
        indice que cierra la ventana de carrera a nivel de base de datos ya NO
        es un UNIQUE(lower(name)) simple: debe ser un indice UNICO PARCIAL —
        CREATE UNIQUE INDEX ... ON exercises (lower(name)) WHERE is_active =
        true — para que el constraint de base de datos refleje la misma regla
        de negocio de unicidad solo-entre-activos (CA-005-2/CA-005-6). Un
        UNIQUE simple rechazaria creaciones legitimas que la regla de negocio
        permite. Queda asignado al DBA (ver riesgos_identificados).

    - decision: >
        Dos tests e2e en test/exercises.e2e-spec.ts (DB real, test:e2e es gate
        duro) blindan el comportamiento del indice parcial en lugar de su
        implementacion: (1) UNICIDAD — insertar dos ejercicios ACTIVOS cuyos
        names difieren solo en mayusculas ('Sentadilla' y 'sentadilla')
        escribiendo directo a la base (raw SQL o Prisma sin pasar por el
        service, saltando el pre-check), esperando que el segundo INSERT sea
        rechazado por la base de datos; (2) PARCIALIDAD — insertar un
        ejercicio INHABILITADO y luego uno ACTIVO con el mismo name, por la
        misma via directa, esperando que el segundo INSERT proceda sin error
        (protege CA-005-6). Ambos limpian sus filas al terminar, como el resto
        de la suite e2e.
      justificacion: >
        Verificar el indice contra pg_indexes solo confirma que existe una fila
        con ese nombre de indice — pasaria igual si alguien lo reemplazara por
        un UNIQUE (name) normal con el mismo nombre, que es exactamente el
        error que rompe CA-005-6 en silencio. Los tests de comportamiento
        (insertar y observar si la base de datos rechaza o acepta) detectan esa
        regresion aunque cambie la implementacion del indice. Van en e2e con DB
        real porque un unitario con Prisma mockeado no puede ver un indice de
        Postgres; test:e2e es gate duro desde hoy. Escriben directo a la tabla
        (no via create()) porque el objetivo es probar la garantia de la base
        de datos, no la del service — esa ya esta cubierta por los tests de
        create(). Decision del humano en respuesta al hallazgo abierto #7 de
        outputs/execution-log.md: el DBA sostiene que el indice sobrevive a
        futuros `prisma migrate dev`, pero no esta comprobado en este proyecto,
        y si desapareciera en silencio nada se rompe hasta que existan dos
        ejercicios activos con el mismo nombre.

  criterios_de_aceptacion_tecnicos:
    - "Cobertura de dominio (ExercisesService) >= 80%"
    - "Cobertura de adaptadores (ExercisesController) >= 70%"
    - "isUsedInPlan() cubierto con ambas ramas (true/false) mockeadas en tests unitarios de update() — cubre CA-006-1 y CA-006-3 a nivel unitario"
    - "Todos los endpoints documentan sus errores con @ApiProblemResponse segun la tabla de este plan"
    - "La creacion de un ejercicio (Exercise + ExerciseVersion versionNumber=1) ocurre dentro de una sola $transaction — nunca queda un Exercise sin ninguna ExerciseVersion"
    - "El chequeo de name duplicado (create y rename) filtra isActive=true y normaliza con trim() antes de comparar — un name que solo existe en un ejercicio inhabilitado NO bloquea la creacion ni el rename (CA-005-6)"
    - "El rechazo por name duplicado usa BusinessError.DUPLICATE_ENTITY (409) tanto en create() como en el rename de update(), solo cuando el name colisiona con un ejercicio ACTIVO"
    - "El rechazo por doble inhabilitacion usa BusinessError.EXERCISE_INACTIVE (422), nunca EXERCISE_IN_USE"
    - "update() verifica isActive === false ANTES de invocar isUsedInPlan() y rechaza con EXERCISE_INACTIVE (422) sin crear version nueva ni alterar la vigente (CA-006-6) — test unitario debe verificar que isUsedInPlan() NO se invoca en este camino"
    - "GET /exercises filtra isActive=true por defecto y solo incluye inhabilitados si includeInactive=true"
    - "GET /exercises/:id retorna un ejercicio inhabilitado sin filtrarlo, con isActive=false visible en la respuesta (CA-007-3)"
    - "test/exercises.e2e-spec.ts — test de UNICIDAD del indice parcial: insertar dos ejercicios ACTIVOS con names que difieren solo en mayusculas ('Sentadilla'/'sentadilla') escribiendo directo a la base (no via service, saltando el pre-check); el segundo INSERT debe ser rechazado por la base de datos. Limpia sus filas al terminar."
    - "test/exercises.e2e-spec.ts — test de PARCIALIDAD del indice: insertar un ejercicio INHABILITADO y luego uno ACTIVO con el mismo name, escribiendo directo a la base; el segundo INSERT debe proceder sin error (protege CA-005-6). Limpia sus filas al terminar."
    - "pnpm run build pasa sin errores — gate duro"
    - "npx tsc --noEmit pasa sin errores — gate duro"

  riesgos_identificados:

    - riesgo: >
        CA-006-1 y CA-006-3 (la rama de version-nueva vs edicion-en-el-lugar de
        update()) no son verificables end-to-end en esta epica: no existe tabla
        de planes contra la cual isUsedInPlan() pueda resolverse todavia. Solo
        quedan cubiertas por tests unitarios que mockean el metodo.
      mitigacion: >
        Ya documentado explicitamente en la epica (notas de HU-006) como gap
        aceptado. El reporte de QA debe registrarlo como gap explicito, no
        omitirlo. La cobertura e2e real llega con EPICA-03 cuando conecte
        isUsedInPlan() a una query real.
      nivel: LOW

    - riesgo: >
        La unicidad case-insensitive de name (ahora acotada a activos, con
        trim()) se verifica en el service (check-then-insert + catch de P2002
        como red de seguridad), pero el indice a nivel de base de datos debe
        ser un UNIQUE PARCIAL, no un @unique simple de Prisma. Dos requests
        concurrentes con variantes de mayusculas/espacios del mismo name,
        ambos sobre ejercicios que quedarian activos, podrian pasar el check
        de aplicacion antes de que el indice de base de datos exista o si el
        indice no queda bien formado, generando un duplicado real entre dos
        ejercicios activos. Ademas, si el indice parcial se pierde en un
        futuro `prisma migrate dev` (el DBA sostiene que sobrevive, pero no
        esta comprobado en este proyecto) o se reemplaza por error por un
        UNIQUE simple, la garantia desaparece EN SILENCIO — nada se rompe hasta
        que aparezcan dos ejercicios activos con el mismo name. Hallazgo
        abierto #7 en outputs/execution-log.md.
      mitigacion: >
        Asignado al DBA: crear un indice unico PARCIAL por SQL crudo en la
        migracion de EPICA-02 — CREATE UNIQUE INDEX ... ON exercises
        (lower(name)) WHERE is_active = true. Un indice simple
        UNIQUE(lower(name)) ya NO aplica: la regla de negocio es unicidad solo
        entre activos (CA-005-2/CA-005-6), asi que el constraint de base de
        datos debe reflejar la misma condicion parcial que el check de
        aplicacion, o el constraint rechazaria creaciones legitimas que la
        regla de negocio permite (name repetido con un inhabilitado). Ademas,
        ya no descansa solo en esa instruccion de migracion: dos tests e2e en
        test/exercises.e2e-spec.ts (ver criterios_de_aceptacion_tecnicos y la
        decision arquitectonica correspondiente) prueban el COMPORTAMIENTO del
        indice contra la base de datos real — uno confirma que rechaza el
        duplicado case-insensitive entre activos, otro confirma que permite el
        duplicado cuando uno de los dos esta inhabilitado. Si el indice
        desaparece o se reemplaza por un UNIQUE simple, alguno de los dos falla
        en CI (test:e2e es gate duro) antes de llegar a produccion.
      nivel: LOW

    - riesgo: >
        design-patterns/data-patterns.md seccion 1 declara description como
        String? (nullable) en ExerciseVersion, pero CA-005-1 exige el campo en
        toda creacion (DTO lo marca @IsNotEmpty). Si el DBA copia el schema de
        referencia literal, el schema permitiria description NULL aunque
        ningun flujo de la API lo produzca, dejando una inconsistencia entre
        el contrato HTTP y el schema de base de datos.
      mitigacion: >
        Ya senalado en la decision de schema de este plan. El DBA decide si
        description pasa a String (NOT NULL) al disenar el schema final de
        EPICA-02 — no requiere cambios en el plan de endpoints ni en los DTOs,
        que ya tratan el campo como requerido.
      nivel: LOW

    - riesgo: >
        name no se versiona (vive en Exercise, no en ExerciseVersion). Un
        rename afecta retroactivamente como se ve el ejercicio en todos los
        planes historicos que lo referencian — no hay forma de recuperar el
        nombre exacto que un plan vio al construirse.
      mitigacion: >
        Revisado y aceptado por el humano el 2026-08-05: se mantiene name en
        Exercise (no versionado) tal como prescribe design-patterns §1. El
        caso comun es corregir una errata de tipeo, y ahi propagar el nombre
        corregido a planes historicos es el comportamiento deseado. Riesgo
        cerrado — no reabrir en revision de Lider Tecnico salvo que aparezca
        un requisito nuevo en EPICA-03 que exija el nombre historico exacto.
      nivel: LOW

    - riesgo: >
        Dos ejercicios pueden compartir el mismo name si uno esta inhabilitado
        — consecuencia directa de CA-005-2/CA-005-6 (unicidad solo entre
        activos). Los planes historicos que ya referencian al inhabilitado
        conservan su exerciseVersionId intacto, asi que no hay ambiguedad en
        los datos — pero un listado con includeInactive=true puede mostrar dos
        filas con el mismo name (una activa, una inhabilitada), lo cual puede
        sorprender a un cliente que asuma unicidad global del catalogo.
      mitigacion: >
        Documentado explicitamente en este plan para que EPICA-03 y el
        frontend no asuman unicidad global de name — solo es unico entre
        activos. El campo isActive ya viaja en ExerciseSummaryResponseDto y
        permite al cliente diferenciar ambas filas sin cambios de contrato
        adicionales si se necesita distinguirlas visualmente.
      nivel: LOW
