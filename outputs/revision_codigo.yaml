revision_codigo:
  fecha: "2026-03-08"
  ciclo: 2
  razonamiento: >
    QUE: Verificacion independiente del ciclo 2 — se leyeron directamente los archivos
    afectados para confirmar que las dos correcciones reportadas estan presentes en el
    codigo actual. POR QUE: El reporte anterior fue generado por el orquestador (no por
    el LT) tras aplicar las correcciones directamente. Esta revision cierra el ciclo con
    una lectura real del codigo. REFERENCIA: src/modules/auth/dto/login.dto.ts,
    src/modules/auth/guards/local-auth.guard.ts, revision_codigo.yaml ciclo 2 anterior.

  linting:
    eslint: "PASS"
    prettier: "PASS"
    errores: 0
    warnings: 32
    detalle_warnings: >
      Todos los 32 warnings son @typescript-eslint/no-unsafe-argument configurado como
      'warn' (no 'error') en eslint.config.mjs. Distribuidos en: guard specs (4),
      prisma-exception.filter.ts (1), test/auth.e2e-spec.ts (27). Ninguno en codigo
      de produccion critico. No bloquea.

  cobertura:
    dominio:
      auth_service: { stmts: 100, branch: 89.79, cumple: true }
      coach_requests_service: { stmts: 98.24, branch: 95.45, cumple: true }
      target: 80
      cumple: true
    adaptadores:
      auth_controller: { stmts: 100, cumple: true }
      coach_requests_controller: { stmts: 100, cumple: true }
      jwt_auth_guard: { stmts: 75, cumple: true }
      roles_guard: { stmts: 100, cumple: true }
      jwt_strategy: { stmts: 100, cumple: true }
      target: 70
      cumple: true
    tests: { total: 93, pass: 93, fail: 0, archivos: 7 }
    global_stmts: 96.44

  verificacion_correcciones_ciclo2:

    correccion_1:
      archivo: "src/modules/auth/dto/login.dto.ts"
      descripcion: "Agregado @MaxLength(72), format: 'email' en @ApiProperty de email, maxLength: 72 en @ApiProperty de password"
      estado: "CONFIRMADA"
      evidencia:
        - "Linea 14: format: 'email' presente en @ApiProperty del campo email"
        - "Linea 23: maxLength: 72 presente en @ApiProperty del campo password"
        - "Linea 27: @MaxLength(72, { message: 'La contrasena no puede superar 72 caracteres' }) presente"
      detalle: >
        Los tres elementos reportados como pendientes en el ciclo 2 estan presentes en el
        codigo actual. El decorador @MaxLength(72) esta en la linea 27 como validador de
        class-validator. La propiedad maxLength: 72 esta en @ApiProperty (linea 23) para
        documentacion Swagger. El format: 'email' esta en @ApiProperty del campo email
        (linea 14). Todos correctos.

    correccion_2:
      archivo: "src/modules/auth/guards/local-auth.guard.ts"
      descripcion: "Agregado handleRequest() con patron RFC 9457 consistente"
      estado: "CONFIRMADA"
      evidencia:
        - "Lineas 23-32: handleRequest<TUser>(err, user) presente e implementado"
        - "Linea 25: if (err instanceof BusinessException) throw err — relanza BusinessException existente"
        - "Lineas 26-29: throw new BusinessException(BusinessError.INVALID_CREDENTIALS, ...) para errores no-Business"
        - "El patron es consistente con JwtAuthGuard (jwt-auth.guard.ts lineas 18-26)"
      detalle: >
        handleRequest() esta implementado correctamente. Captura cualquier error no-BusinessException
        y lo envuelve en BusinessException con INVALID_CREDENTIALS, garantizando formato RFC 9457
        consistente en todos los escenarios de error de autenticacion local. El patron es identico
        al de JwtAuthGuard salvo por el re-lanzamiento de BusinessException existente (linea 25),
        que es correcto para preservar errores de dominio como ACCOUNT_TEMPORARILY_LOCKED.

  patrones:
    violaciones: []
    verificaciones:
      - nombre: "BusinessException+BusinessError en services"
        estado: "OK"
        evidencia: >
          auth.service.ts: BusinessException con DUPLICATE_ENTITY (linea 100),
          ACCOUNT_TEMPORARILY_LOCKED (linea 253), INVALID_CREDENTIALS (linea 290),
          COACH_NOT_APPROVED (linea 326). TechnicalException con DATABASE_ERROR (lineas 105, 210, 360).
          coach-requests.service.ts: BusinessException con ENTITY_NOT_FOUND (lineas 183, 353),
          INVALID_STATE_TRANSITION (lineas 225, 288). TechnicalException con DATABASE_ERROR (lineas 122, 249, 313).
          Ningun HttpException nativo de NestJS en ningun service.

      - nombre: "Controllers THIN sin try/catch ni PrismaService"
        estado: "OK"
        evidencia: >
          auth.controller.ts: 3 metodos, cada uno delega directamente al service y retorna.
          Sin try/catch. Sin PrismaService inyectado. Sin logica de negocio.
          coach-requests.controller.ts: 4 metodos, mismo patron. Sin try/catch.
          Sin PrismaService inyectado. Sin logica de negocio.

      - nombre: "Import Prisma desde generated/prisma"
        estado: "OK"
        evidencia: >
          auth.service.ts linea 12: from '../../../generated/prisma/index.js'.
          coach-requests.service.ts linea 4-7: from '../../../generated/prisma/index.js'.
          auth.controller.ts linea 20: from '../../../generated/prisma/index.js'.
          coach-requests.controller.ts linea 25: from '../../../generated/prisma/index.js'.
          register-athlete.dto.ts linea 15: from '../../../../generated/prisma/index.js'.
          register-coach.dto.ts linea 15: from '../../../../generated/prisma/index.js'.
          Sin imports desde '@prisma/client' en ningun archivo del modulo auth.

      - nombre: "Enums desde generated/prisma (no duplicados locales)"
        estado: "OK"
        evidencia: >
          UserRole, DocumentType, CoachRequestStatus, IdentificationType — todos importados
          desde generated/prisma. Ningun enum local duplicado detectado en el modulo auth.

      - nombre: "Comunicacion entre modulos via EventEmitter2"
        estado: "OK"
        evidencia: >
          auth.service.ts: eventEmitter.emit('user.registered', ...) y eventEmitter.emit('coach.request.created', ...).
          coach-requests.service.ts: eventEmitter.emit('coach.request.approved', ...) y
          eventEmitter.emit('coach.request.rejected', ...).
          Ningun service importado de otro modulo (excepto PrismaService de prisma/).

      - nombre: "Sin construccion manual de envelope"
        estado: "OK"
        evidencia: >
          Todos los controllers retornan directamente el resultado del service.
          El ResponseInterceptor construye el envelope { success, statusCode, data, timestamp }.

      - nombre: "Sin logs de passwords/tokens/datos sensibles"
        estado: "OK"
        evidencia: >
          AuthService no instancia Logger ni PinoLogger. Ningun metodo loggea password,
          accessToken, refreshToken ni tokenHash. LocalStrategy.validate() (via auth.service.ts)
          no loggea credenciales.

      - nombre: "Decoradores Swagger en endpoints"
        estado: "OK"
        evidencia: >
          auth.controller.ts: @ApiTags('auth'), @ApiOperation(security:[]), @ApiResponse,
          @ApiProblemResponse en los 3 endpoints. Errores documentados: 400, 409 (register),
          400, 401, 403, 429 (login).
          coach-requests.controller.ts: @ApiTags, @ApiBearerAuth(), @ApiOperation, @ApiResponse,
          @ApiProblemResponse en los 4 endpoints. Cobertura completa de errores del plan.

      - nombre: "ParseUUIDPipe en parametros :id"
        estado: "OK"
        evidencia: >
          coach-requests.controller.ts: findOne (linea 118), approve (linea 157), reject (linea 204)
          — todos usan @Param('id', ParseUUIDPipe).

      - nombre: "State machine CoachRequest"
        estado: "OK"
        evidencia: >
          approve(): verifica status !== PENDING y lanza INVALID_STATE_TRANSITION.
          reject(): verifica status !== PENDING y lanza INVALID_STATE_TRANSITION.
          Patron enum + metodo por transicion, sin librerias externas.

      - nombre: "Seguridad endpoints publicos"
        estado: "OK"
        evidencia: >
          auth.controller.ts: @ApiOperation({ security: [] }) en registerAthlete (linea 52),
          registerCoach (linea 93) y login (linea 141). Los tres endpoints publicos marcados correctamente.
          coach-requests.controller.ts: @ApiBearerAuth() a nivel de clase — correcto.

  consistencia_contrato: "PASS"
  divergencias_resueltas_ciclo1: 17
  divergencias_resueltas_ciclo2: 2
