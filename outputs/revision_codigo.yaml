  escaneo_automatico:
    revisado: true
    ejecutado: false
    motivo_no_ejecucion_valido: true
    motivo: >
      Sin commits git (todos los archivos untracked) — imposible ejecutar git diff para
      alimentar /security-review. Motivo valido.
    hallazgos_confirmados: 0
    hallazgos_descartados_validados: 2
    hallazgos_descartados_rechazados: 0
    notas: >
      Vulnerabilidad BAJA 1 (context.requestStatus en COACH_NOT_APPROVED):
      Descarte del QA validado. ProblemDetailFilter loggea el error internamente pero
      no serializa el campo 'context' en la respuesta al cliente. Riesgo residual
      aceptable — no bloquea.
      Vulnerabilidad BAJA 2 (LocalAuthGuard sin handleRequest()):
      RESUELTA en ciclo 2. handleRequest() confirmado presente en el codigo actual.

  validacion_openapi_spectral:
    revisado: true
    ejecutado: false
    motivo_no_ejecucion_valido: true
    motivo: >
      pnpm run openapi:validate requiere DATABASE_URL activa para arrancar la app y
      exportar el schema. Sin base de datos disponible en el entorno de revision,
      el export no puede completarse. El humano puede ejecutar: pnpm run openapi:validate
    errores_confirmados: 0
    warnings_documentados: 0
    notas: >
      Inspeccion manual confirma que todos los endpoints con JwtAuthGuard documentan
      @ApiProblemResponse(401). Los endpoints publicos tienen security: []. Las rutas
      siguen convencion lowercase/ingles. La validacion automatica con Spectral queda
