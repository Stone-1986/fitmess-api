revision_codigo:
  fecha: "2026-08-20"
  ciclo: 2
  epica_id: "EPICA-04"
  razonamiento: >
    QUÉ: verifiqué que la corrección del ciclo 1 (agregar
    @AuditResources('Subscription') a findPending) está aplicada donde
    corresponde y en ningún otro lugar, leyendo subscriptions.controller.ts
    directamente en vez de confiar en el resumen del orquestador, y leí el
    test e2e nuevo completo (líneas 579-604 de
    test/subscriptions.e2e-spec.ts) para confirmar que ejercita el camino
    real (HTTP -> interceptor -> middleware -> audit_logs), no un mock del
    interceptor. Recontrasté los 6 gates contra la salida cruda del
    orquestador. POR QUÉ: mi propio hallazgo del ciclo 1 exigía verificación
    de disco, no de reporte — el mismo criterio que le exigí implícitamente
    al Desarrollador aplica a mí mismo al cerrar el ciclo. REFERENCIA:
    subscriptions.controller.ts:29 (import), :182-189 (decorador en
    findPending, con comentario que cita el hallazgo del ciclo 1),
    ausencia confirmada en findMine (grep: una sola ocurrencia de
    @AuditResources en todo el archivo); test e2e :583-604.

  linting:
    eslint: "PASS"
    prettier: "PASS"
    errores: []
    nota: >
      299 warnings (+1 sobre el ciclo 1, coherente con el test nuevo),
      todos @typescript-eslint/no-unsafe-argument en archivos de test, regla
      en `warn`. El orquestador reporta que la primera pasada de gates falló
      en lint/format:check por un único error de `prettier/prettier` en
      test/subscriptions.e2e-spec.ts:593, y que aplicó `pnpm run format`
      directamente (Paso 4.5, categoría "Errores de Prettier / formato") en
      vez de devolverlo al Desarrollador, re-ejecutando los 6 gates después.
      Es la ruta correcta: la lista blanca de esa categoría cubre
      exactamente reformateo sin cambio de lógica, y lo confirmo — el test
      que leí (líneas 583-604) no tiene ninguna marca de un fix a medias, es
      una prueba completa y coherente con el resto del archivo.

  cobertura:
    dominio:
      porcentaje: 100
      target: 80
      cumple: true
    adaptadores:
      porcentaje: 100
      target: 70
      cumple: true
    nota: >
      Sin cambios respecto al ciclo 1: subscriptions.controller.ts y
      subscriptions.service.ts siguen en 100/100/100/100, 99.78% global,
      535/535 unitarios. La corrección no tocó ningún archivo de dominio ni
      de servicio — solo el controller (un decorador) y el e2e (un test) —
      así que no había superficie nueva que arriesgara el gate de cobertura.

  suite_e2e:
    estado: "PASS"
    pasaron: 200
    fallaron: 0
    nota: >
      199 -> 200: el +1 es exactamente el test de auditoría nuevo, ningún
      otro test se agregó ni se quitó. Leí el test completo: crea un plan
      publicado y una suscripción real (buildPublishedPlan +
      requestSubscription), llama GET /subscriptions/pending como el coach,
      confirma que el id de la suscripción viene en la respuesta, y luego
      espera la fila de auditoría por url+userId y afirma
      resourceType==='Subscription' y resourceIds===[los ids devueltos] —
      ejercita el camino real end-to-end (interceptor -> middleware ->
      persistencia), no un mock. Cierra el hallazgo del ciclo 1 con
      evidencia de comportamiento, no solo de presencia del decorador.

  patrones:
    violaciones: []
    nota: >
      El hallazgo del ciclo 1 (GET /subscriptions/pending sin
      @AuditResources) queda CERRADO: decorador presente en findPending
      (:189), ausente en findMine (correcto — ahí el atleta consulta sus
      propios datos, no los de un tercero, y no aplica el criterio del
      decorador). No reviso de nuevo el resto de subscriptions/notifications
      /plans.service.ts/business-error.enum.ts: ya aprobado en el ciclo 1 y
      el diff de este ciclo no los toca.

  consistencia_contrato: "OK"
  consistencia_contrato_detalle: >
    @AuditResources es metadata interna (SetMetadata), no genera ni altera
    ningún schema de OpenAPI ni código de respuesta — Spectral sigue en
    verde (0 errores) y no había razón para que cambiara. Sin impacto en el
    contrato, consistente con lo que instruí en el ciclo 1.

  validacion_openapi_spectral:
    revisado: true
    errores_confirmados: 0
    warnings_documentados: 1
    notas: >
      Mismo aviso cosmético del tag 'subscriptions' sin descripción en
      TAG_DESCRIPTIONS, ya evaluado y cerrado como no bloqueante en el ciclo
      1 (comportamiento esperado del mecanismo de reconcileTags). Sin
      cambios.

  escaneo_automatico:
    revisado: true
    hallazgos_confirmados: 0
    hallazgos_descartados_validados: 0
    hallazgos_descartados_rechazados: 0
    notas: >
      Sin cambios de superficie de seguridad respecto al ciclo 1 — el único
      diff es un decorador de metadata + un test. No amerita re-escaneo
      completo; el propio decorador reduce superficie de riesgo de
      cumplimiento (Ley 1581/2012), no la aumenta.

  decisiones_no_reabiertas:
    - "CA-014-3 / D-9 — diferido a EPICA-05."
    - "subscription.activated sin listener / D-7 — punto de integración de EPICA-05."
    - "archive() sin gate de suscriptores — asimetría deliberada con unpublish()."
    - "Duplicación cross-módulo de isPlanCurrentlyPublished() / D-2 — intencional."
    - "documentVersion sin validación server-side / D-8 — sistémico, preexistente de EPICA-01."

  instrucciones_desarrollador: []

  estado: "APROBADO"
  requiere_modificar_contrato: false
  requiere_modificar_plan: false
  motivo_rechazo: ""
