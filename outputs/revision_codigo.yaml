  escaneo_automatico:
    revisado: true
    hallazgos_confirmados: 1
    hallazgos_descartados_validados: 1
    hallazgos_descartados_rechazados: 0
    notas: >
      Hallazgo MEDIUM (token en URL de correo de invitacion, email.service.ts:53):
      Confirmado como MEDIUM. El token RAW se incluye en el enlace de registro como
      query parameter, lo que lo expone en: (a) logs del servidor de correo Resend,
      (b) historial del navegador del receptor, (c) headers Referer si el usuario
      navega desde esa URL a otro sitio. La mitigacion implementada es adecuada para
      este flujo: token de uso unico (tokenUsedAt = now() atomicamente en $transaction),
      expiracion de 48h configurable (ADMIN_INVITE_EXPIRATION_HOURS), HTTPS requerido
      en produccion. Este patron es inherente al flujo de invitacion por email (magic link)
      — la alternativa seria tokens de corta duracion (ej: 1h) o un segundo endpoint de
      intercambio, lo cual aumentaria complejidad sin eliminar el riesgo en logs de correo.
      El riesgo esta documentado en el plan (decisiones arquitectonicas #4 y #5).
      Clasifico como MEDIUM confirmado pero no bloqueante: riesgo operacional aceptado
      y documentado con mitigaciones adecuadas para el contexto (1-3 admins, MVP).
      Hallazgo LOW (rate limiting en POST /admin-invitations/verify): Descarte del QA
      validado. Token de 256 bits (randomBytes(32)) hace infactible la fuerza bruta
      computacionalmente (2^256 combinaciones). ThrottlerGuard global (100 req/min)
      es mitigacion suficiente para proteccion operacional adicional.

