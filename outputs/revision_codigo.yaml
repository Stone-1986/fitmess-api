  validacion_openapi_spectral:
    revisado: true
    errores_confirmados: 0
    warnings_documentados: 0
    notas: >
      "No results with a severity of 'error' found!" — coincide entre la
      salida del orquestador y el reporte del QA. El aviso de
      export-openapi.mjs sobre el tag 'instances' sin entrada en
      TAG_DESCRIPTIONS no es un error de Spectral ni de contrato — es
      deuda de scripts/, correctamente diferida al Desarrollador para la
      proxima iteracion, no bloqueante.

  juicio_hallazgo_qa_auto_reparacion_asincrona:
    veredicto: "VALIDADO — BAJA, no bloquea"
    analisis: >
      Verificado contra outputs/epica_input.yaml (CA-023-1 texto literal,
      linea 90): "el atleta puede consultar SU INSTANCIA inmediatamente
      despues" — se lee como el detalle (GET /instances/:planId), que SI
      auto-repara (D-3). CA-023-4 y CA-023-5 (independencia entre atletas,
      filtro de ownership en listado y detalle) no prometen inmediatez de
      aparicion en el LISTADO, solo que cada atleta vea unicamente lo
      suyo — findAll() cumple eso sin auto-reparacion. Si el listener
      (fire-and-forget) no ha terminado y el atleta entra por GET
      /instances (listado) o el coach por GET /.../athletes/:athleteId,
      ninguno ve un error ni datos ajenos: el atleta ve una lista sin ese
      item (o vacia), el coach ve 404 ENTITY_NOT_FOUND — ambos estados
      transitorios y honestos, no un fallo de ningun CA. Es exactamente el
      riesgo que D-3/riesgos_identificados ya documenta explicitamente
      ("si NADIE vuelve a consultar la instancia, el hueco persiste") y
      que la propia arquitectura eligio (reparar bajo demanda vs. cola de
      reintentos, prohibida por rules como Saga Pattern de facto). Ademas,
      en la practica del coach, D-9/D-17 describen una consulta que ocurre
      cuando el atleta YA esta entrenando, no en el instante de activacion
      — la ventana de milisegundos del listener rara vez coincide con esa
      consulta. Concuerdo con el QA: no requiere cambio de codigo, solo
      que quede documentado — lo cual ya esta en revision_codigo.yaml y en
      el propio plan.

  lineas_sin_cubrir_instances_service:
    linea_216:
      veredicto: "Aceptable — rama de guarda, no logica de negocio"
      detalle: >
        TechnicalException si planInstance.findUnique no puede releer la
        fila que la propia transaccion acaba de crear (findOwn). Requiere
        forzar una lectura fallida entre dos operaciones consecutivas de
        Prisma contra la misma conexion — no reproducible sin mockear el
        driver. Guardia defensiva legitima, mismo patron ya aceptado en
        otras epicas para condiciones de carrera imposibles de forzar.
    linea_812:
      veredicto: "Aceptable para el gate, pero la justificacion del QA es imprecisa"
      detalle: >
        Es `return Math.min(limit as number, 100)` dentro de
        normalizeLimit() — el camino que SI aplica el tope de 100 cuando
        se recibe un limit valido. El QA la describe como "cubierta
        indirectamente por otros tests de paginacion", pero
        instances.service.spec.ts SOLO llama findAll() sin argumentos
        (grep confirmado: 2 usos, ambos sin page/limit) — nunca se ejerce
        esta linea DENTRO de este archivo. Lo que SI es cierto es que el
        mismo patron literal (normalizePage/normalizeLimit) esta probado
        con 100% de cobertura en subscriptions.service.ts, que es codigo
        ya auditado en EPICA-04 — por eso el riesgo real es bajo, no
        porque el archivo actual la ejercite. No bloquea (89.33% branches
        sigue por encima del 75% requerido, perFile), pero anoto la
        imprecision para que no se repita como justificacion en el
        proximo ciclo: "cubierta indirectamente" deberia decir "mismo
        patron ya probado en otro archivo", que es una afirmacion mas
        debil y distinta.

  instrucciones_desarrollador: []

  estado: "APROBADO"
  requiere_modificar_contrato: false
  requiere_modificar_plan: false
