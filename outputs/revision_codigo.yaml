  fix_response_interceptor:
    verificado: true
    detalle: >
      Línea 42-50 reescrita: `data && typeof data === 'object' && 'data' in
      data ? data.data : data`. Verifiqué manualmente los 5 shapes posibles
      contra la expresión: objeto plano sin clave `data` → retorna el objeto
      completo (sin cambio); `{data: [...], meta}` → retorna el array (sin
      cambio); `{data: X, message}` con X no nulo → retorna X (sin cambio,
      ningún endpoint real usa este shape hoy); `{data: null, message}` →
      retorna null (ESTE es el fix); `null`/`undefined` directo → se
      preserva (ningún controller lo hace hoy, cubierto por completitud). Los
      6 casos de response.interceptor.spec.ts (3 preexistentes + 3 nuevos:
      null-explícito-con-message, null-directo, undefined-directo) están en
      verde. Alcance respetado: solo este archivo y su spec,
      src/modules/exercises/ intacto.
    regresion_epica_01_09: >
      Verificado independientemente del análisis del QA (regresion_response_interceptor
      en reporte_qa.yaml): grep de `data:`/`data?:` en todos los *.dto.ts de
      src/ — ningún DTO de respuesta declara un campo propio `data`. Grep de
      controllers que retornan un shape `{ data: ... }` — solo 3 en todo el
      proyecto: coach-requests.controller.ts findAll (`{data: array, meta}`,
      sin cambio de comportamiento) y los 2 ya analizados de
      exercises.controller.ts. Confirmo la conclusión del QA: sin regresión
      posible sobre EPICA-01/EPICA-09.

